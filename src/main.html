const streetClock=new THREE.Clock();
const slotClock=new THREE.Clock();

function updateStreetCar(){
  if(!STREET_ASSETS.cars.length) return;

  const dt=Math.min(streetClock.getDelta(),.05);
  const now=performance.now()*.0032;
  const roadLength=uRoadCurve.getLength();

  for(const car of STREET_ASSETS.cars){
    car.progress+=car.direction*(car.speed/roadLength)*dt;

    // Ricompare molto lontano sul ramo opposto, fuori dalla vista principale.
    if(car.progress>1.015) car.progress=-.015;
    if(car.progress<-.015) car.progress=1.015;

    const visibleProgress=THREE.MathUtils.clamp(car.progress,0,1);
    const p=uRoadCurve.getPointAt(visibleProgress);
    const tangent=uRoadCurve.getTangentAt(visibleProgress).normalize();
    const nx=-tangent.z;
    const nz=tangent.x;

    car.root.position.x=p.x+nx*car.laneOffset;
    car.root.position.z=p.z+nz*car.laneOffset;

    // Rotazione continua, senza scatti quando l'angolo attraversa +/-PI.
    const targetYaw=Math.atan2(tangent.x,tangent.z)+(car.direction<0?Math.PI:0);
    let yawDelta=targetYaw-car.smoothYaw;
    yawDelta=Math.atan2(Math.sin(yawDelta),Math.cos(yawDelta));
    car.smoothYaw+=yawDelta*Math.min(1,dt*7.5);
    car.root.rotation.y=car.smoothYaw;

    // Sterzata visiva: leggero rollio e beccheggio proporzionali alla curva.
    let curvature=0;
    if(car.previousTangent){
      const cross=
        car.previousTangent.x*tangent.z-
        car.previousTangent.z*tangent.x;
      curvature=THREE.MathUtils.clamp(cross/Math.max(dt,.001),-.9,.9);
    }
    car.previousTangent=tangent.clone();

    const targetRoll=-curvature*.045*(car.direction>0?1:-1);
    const targetPitch=Math.sin(now*.55+car.phase)*.002;
    car.smoothRoll=THREE.MathUtils.lerp(car.smoothRoll,targetRoll,Math.min(1,dt*5));
    car.smoothPitch=THREE.MathUtils.lerp(car.smoothPitch,targetPitch,Math.min(1,dt*3));
    car.root.rotation.z=car.smoothRoll;
    car.root.rotation.x=car.smoothPitch;

    // Invisibile solo oltre l'estremità remota, dopo avere già girato.
    car.root.visible=car.progress>=0 && car.progress<=1;

    if(car.wheelAnimation){
      const currentWorldPosition=new THREE.Vector3();
      car.root.getWorldPosition(currentWorldPosition);

      // Al primo frame visibile, o dopo il teletrasporto di ricomparsa,
      // inizializziamo soltanto il riferimento: nessuna rotazione improvvisa.
      if(!car.root.visible){
        car.wheelAnimation.previousWorldPosition=null;
        car.wheelAnimation.wasVisible=false;
      }else if(
        !car.wheelAnimation.wasVisible ||
        !car.wheelAnimation.previousWorldPosition
      ){
        car.wheelAnimation.previousWorldPosition=currentWorldPosition.clone();
        car.wheelAnimation.wasVisible=true;
      }else{
        const travelled=currentWorldPosition.distanceTo(
          car.wheelAnimation.previousWorldPosition
        );

        // Limite largo abbastanza per un frame lento, ma piccolo rispetto
        // al salto fra le due estremità della strada.
        const teleportThreshold=Math.max(car.speed*dt*4.0,2.0);
        if(travelled<=teleportThreshold){
          const signedDistance=travelled*car.direction;

          // Le auto opposte sono ruotate di PI: il segno della direzione
          // mantiene il rotolamento coerente nel sistema locale del modello.
          car.wheelAnimation.angle-=
            signedDistance/car.wheelAnimation.worldWheelRadius;

          // Mantiene l'angolo numericamente stabile durante sessioni lunghe.
          if(Math.abs(car.wheelAnimation.angle)>Math.PI*200){
            car.wheelAnimation.angle%=(Math.PI*2);
          }

          car.wheelAnimation.uniforms.uWheelAngle.value=
            car.wheelAnimation.angle;
        }

        car.wheelAnimation.previousWorldPosition.copy(currentWorldPosition);
      }
    }

    // Sospensione più naturale, molto leggera.
    car.root.position.y=
      car.baseY+
      Math.sin(now*1.55+car.phase)*.012+
      Math.sin(now*3.1+car.phase*.7)*.004;
  }
}

function findBone(c,words){
  const lowerWords=words.map(w=>w.toLowerCase());

  return c.bones.find((bone)=>{
    const n=(bone.name || "").toLowerCase();
    return lowerWords.some(w=>n.includes(w));
  }) || null;
}

function getRest(c,bone){

}

// ================= TESTA PROCEDURALE SECURITY MAN =================
// Il file securityMan(4).glb NON contiene jaw, mandibola, labbra o morph target.
// L'unico osso facciale/testa disponibile è: mixamorig:Head_06.
// Per questo durante il parlato muoviamo soltanto la testa reale del modello.
const SECURITY_HEAD_SPEECH_STATE=new WeakMap();

function getSecurityHeadSpeechState(c){
  let state=SECURITY_HEAD_SPEECH_STATE.get(c);
  if(state) return state;

  const head=c.bones.find((bone)=>bone.name==="mixamorig:Head_06") || null;

  state={
    head,
    rest:head ? head.rotation.clone() : null,
    warned:false
  };

  SECURITY_HEAD_SPEECH_STATE.set(c,state);
  return state;
}

function animateSecurityHeadSpeech(c,talking=false){
  if(c.name!=="securityMan") return;

  const state=getSecurityHeadSpeechState(c);
  if(!state.head || !state.rest){
    if(!state.warned){
      console.warn("securityMan: osso mixamorig:Head_06 non trovato.");
      state.warned=true;
    }
    return;
  }

  const now=performance.now();
  const nod=Math.sin(now*.0055);
  const turn=Math.sin(now*.0037+1.1);

  const targetX=state.rest.x+(talking ? nod*.018 : 0);
  const targetY=state.rest.y+(talking ? turn*.026 : 0);
  const targetZ=state.rest.z+(talking ? Math.sin(now*.0043+.4)*.010 : 0);

  smoothBoneTo(
    state.head,
    targetX,
    targetY,
    targetZ,
    talking ? .10 : .08
  );
}

// ================= FALANGI PROCEDURALI SECURITY MAN =================
// Configurazione ricavata direttamente dal rig di securityMan(4).glb.
// Le falangi Index/Middle/Ring/Pinky si piegano sull'asse locale X positivo.
// Le ossa terminali *4 non vengono ruotate perché sono end-bones.
const SECURITY_FINGER_STATE=new WeakMap();

function cleanBoneName(name){
  return (name || "").toLowerCase().replace(/[^a-z0-9]/g,"");
}

function getFingerSegment(name){
  const match=name.match(/(?:thumb|index|middle|ring|pinky|little)([1-4])/);
  return match ? Number(match[1]) : 0;
}

function isSecurityFingerBone(name){
  const n=cleanBoneName(name);
  const isFinger=
    n.includes("thumb") ||
    n.includes("index") ||
    n.includes("middle") ||
    n.includes("ring") ||
    n.includes("pinky") ||
    n.includes("little");

  const segment=getFingerSegment(n);

  // Nel GLB reale sono animabili soltanto le falangi 1, 2 e 3.
  return isFinger && segment>=1 && segment<=3;
}

function getSecurityFingerState(c){
  let state=SECURITY_FINGER_STATE.get(c);
  if(state) return state;

  const fingers=c.bones
    .filter((bone)=>isSecurityFingerBone(bone.name))
    .map((bone)=>({
      bone,
      rest:bone.rotation.clone(),
      name:cleanBoneName(bone.name),
      segment:getFingerSegment(cleanBoneName(bone.name))
    }));

  state={fingers};
  SECURITY_FINGER_STATE.set(c,state);
  return state;
}

function getMainFingerCurl(name,segment){
  // Valori in radianti, specifici per il rig Mixamo del GLB caricato.
  // La seconda falange si chiude più della prima e della terza.
  let amount=0;

  if(segment===1) amount=0.72;
  else if(segment===2) amount=1.02;
  else if(segment===3) amount=0.82;

  // Differenze leggere per rendere il pugno naturale.
  if(name.includes("index")) amount*=0.92;
  else if(name.includes("middle")) amount*=1.00;
  else if(name.includes("ring")) amount*=1.05;
  else if(name.includes("pinky") || name.includes("little")) amount*=1.08;

  return amount;
}

function animateSecurityFingers(c,talking=false){
  if(c.name!=="securityMan") return;

  const state=getSecurityFingerState(c);
  if(!state.fingers.length) return;

  const t=performance.now()*.007;
  const waveA=(Math.sin(t)+1)*.5;
  const waveB=(Math.sin(t*1.63+.8)+1)*.5;
  const gesture=waveA*.65+waveB*.35;

  // Da fermo: dita rilassate e moderatamente chiuse.
  // Quando parla: quasi come la versione originale, ma mai completamente distese.
  const closure=talking
    ? THREE.MathUtils.lerp(.34,.20,gesture)
    : .34;

  for(const item of state.fingers){
    const {bone,rest,name,segment}=item;
    const isLeft=name.includes("left");

    if(name.includes("thumb")){
      // Il pollice usa una combinazione di X e Z per appoggiarsi sopra
      // indice e medio, invece di attraversare il palmo.
      let addX=0;
      let addZ=0;

      if(segment===1){
        addX=-0.07;
        addZ=isLeft ? -0.12 : 0.12;
      }else if(segment===2){
        addX=-0.17;
        addZ=isLeft ? -0.16 : 0.16;
      }else if(segment===3){
        addX=-0.16;
        addZ=isLeft ? -0.04 : 0.04;
      }

      smoothBoneTo(
        bone,
        rest.x+addX*closure,
        rest.y,
        rest.z+addZ*closure,
        talking ? .14 : .11
      );
      continue;
    }

    // Nel rig reale tutte le dita principali si chiudono su X positivo,
    // sia a sinistra sia a destra.
    const addX=getMainFingerCurl(name,segment)*closure;

    smoothBoneTo(
      bone,
      rest.x+addX,
      rest.y,
      rest.z,
      talking ? .14 : .11
    );
  }
}

// ================= ANIMAZIONI BASE =================
function animateIdle(c){
  if(!c.ready) return;

  // Il player non usa più il vecchio sistema Euler degli NPC.
  // La sua posa ferma viene gestita dallo stesso motore quaternion
  // della camminata, così non ci sono scatti entrando o uscendo dal movimento.
  if(c.name==="player"){
    animatePlayerProceduralIdle(c);
    return;
  }

  const b=getBones(c);
  const t=performance.now()*.0035;
  const s=Math.sin(t);
  const s2=Math.sin(t*.7);
  const pose=getPose(c);
  const talkCfg=TALK_POSES[c.name];

  if(c.name==="toxicMan" && TOXIC_MAN_STATIC_CONFIG.enabled){
    animateToxicManSpecial(c,b);
    return;
  }else if(c.name==="securityMan"){
    // =====================================================
    // SECURITY MAN - POSA DA FERMO MODIFICABILE
    // MODIFICA SOLO QUESTO BLOCCO.
    // L'ANIMAZIONE DI DIALOGO NON VIENE TOCCATA.
    //
    // arm  = braccio destro / posizione del gomito
    // fore = avambraccio destro / posizione della mano
    // hand = rotazione del polso
    // =====================================================
    const idlePose={
      // Posa 4 usata come punto di partenza.
      arm:{x:.80,y:-.25,z:-.36},
      fore:{x:-.10,y:-1.30,z:-0.80},
      hand:{x:.10,y:-.124,z:-.52}
    };

    // Lato sinistro invariato.
    smoothBoneTo(b.leftArm,talkCfg.leftArm.restX,talkCfg.leftArm.restY,talkCfg.leftArm.restZ,.14);
    smoothBoneTo(b.leftForeArm,talkCfg.leftForeArm.restX,talkCfg.leftForeArm.restY,talkCfg.leftForeArm.restZ,.14);
    smoothBoneTo(
      b.leftHand,
      getRest(c,b.leftHand).x+talkCfg.leftHand.restX,
      getRest(c,b.leftHand).y+talkCfg.leftHand.restY,
      getRest(c,b.leftHand).z+talkCfg.leftHand.restZ,
      .14
    );

    // Solo braccio destro: usa la posa definita nel blocco idlePose qui sopra.
    smoothBoneTo(b.rightArm,idlePose.arm.x,idlePose.arm.y,idlePose.arm.z,.14);
    smoothBoneTo(b.rightForeArm,idlePose.fore.x,idlePose.fore.y,idlePose.fore.z,.14);
    smoothBoneTo(
      b.rightHand,
      getRest(c,b.rightHand).x+idlePose.hand.x,
      getRest(c,b.rightHand).y+idlePose.hand.y,
      getRest(c,b.rightHand).z+idlePose.hand.z,
      .14
    );

    animateSecurityFingers(c,false);
  }else if(talkCfg){
    const fullEditableArms =
      typeof talkCfg.leftForeArm === "object" &&
      typeof talkCfg.rightForeArm === "object";

    if(fullEditableArms){
      smoothBoneTo(b.leftArm,talkCfg.leftArm.restX,talkCfg.leftArm.restY,talkCfg.leftArm.restZ,.14);
      smoothBoneTo(b.rightArm,talkCfg.rightArm.restX,talkCfg.rightArm.restY,talkCfg.rightArm.restZ,.14);
      smoothBoneTo(b.leftForeArm,talkCfg.leftForeArm.restX,talkCfg.leftForeArm.restY,talkCfg.leftForeArm.restZ,.14);
      smoothBoneTo(b.rightForeArm,talkCfg.rightForeArm.restX,talkCfg.rightForeArm.restY,talkCfg.rightForeArm.restZ,.14);
      smoothBoneTo(
        b.leftHand,
        getRest(c,b.leftHand).x + talkCfg.leftHand.restX,
        getRest(c,b.leftHand).y + talkCfg.leftHand.restY,
        getRest(c,b.leftHand).z + talkCfg.leftHand.restZ,
        .14
      );
      smoothBoneTo(
        b.rightHand,
        getRest(c,b.rightHand).x + talkCfg.rightHand.restX,
        getRest(c,b.rightHand).y + talkCfg.rightHand.restY,
        getRest(c,b.rightHand).z + talkCfg.rightHand.restZ,
        .14
      );
    }else{
      smoothBoneTo(b.leftArm,talkCfg.leftArm.restX,0,talkCfg.leftArm.restZ,.14);
      smoothBoneTo(b.rightArm,talkCfg.rightArm.restX,0,talkCfg.rightArm.restZ,.14);
      smoothBoneTo(b.leftForeArm,talkCfg.leftForeArmX,0,0,.14);
      smoothBoneTo(b.rightForeArm,talkCfg.rightForeArmX,0,0,.14);
    }
  }else{
    smoothBoneTo(b.leftArm,pose.armX,0,0,.14);
    smoothBoneTo(b.rightArm,pose.armX,0,0,.14);

    // PLAYER: gomiti su asse Z con valore base quando è fermo.
    if(c.name==="player"){
      smoothBoneTo(
        b.leftForeArm,
        pose.foreArmX,
        0,
        0,
        .14
      );

      smoothBoneTo(
        b.rightForeArm,
        pose.foreArmX,
        0,
        0,
        .14
      );
    }else{
      smoothBoneTo(b.leftForeArm,pose.foreArmX,0,0,.14);
      smoothBoneTo(b.rightForeArm,pose.foreArmX,0,0,.14);
    }
  }

  // PLAYER: quando smette di camminare, gambe e piedi tornano a posto
  // in modo fluido partendo dalla posa in cui si trovavano.
  if(c.name==="player"){
    smoothBoneTo(
      b.leftUpLeg,
      getRest(c,b.leftUpLeg).x,
      getRest(c,b.leftUpLeg).y,
      getRest(c,b.leftUpLeg).z,
      .10
    );

    smoothBoneTo(
      b.rightUpLeg,
      getRest(c,b.rightUpLeg).x,
      getRest(c,b.rightUpLeg).y,
      getRest(c,b.rightUpLeg).z,
      .10
    );

    smoothBoneTo(
      b.leftKnee,
      getRest(c,b.leftKnee).x,
      getRest(c,b.leftKnee).y,
      getRest(c,b.leftKnee).z,
      .12
    );

    smoothBoneTo(
      b.rightKnee,
      getRest(c,b.rightKnee).x,
      getRest(c,b.rightKnee).y,
      getRest(c,b.rightKnee).z,
      .12
    );

    smoothBoneTo(
      b.leftFoot,
      getRest(c,b.leftFoot).x,
      getRest(c,b.leftFoot).y,
      getRest(c,b.leftFoot).z,
      .12
    );

    smoothBoneTo(
      b.rightFoot,
      getRest(c,b.rightFoot).x,
      getRest(c,b.rightFoot).y,
      getRest(c,b.rightFoot).z,
      .12
    );
  }

  // Tutti hanno idle vivo.
  smoothBoneTo(
    b.hips,
    getRest(c,b.hips).x+s2*.003,
    getRest(c,b.hips).y+s*.004,
    getRest(c,b.hips).z-s*.004,
    .09
  );

  smoothBoneTo(
    b.spine,
    getRest(c,b.spine).x+s2*.006,
    getRest(c,b.spine).y,
    getRest(c,b.spine).z+s*.012,
    .09
  );

  smoothBoneTo(
    b.neck,
    getRest(c,b.neck).x+s2*.004,
    getRest(c,b.neck).y+s*.014,
    getRest(c,b.neck).z,
    .09
  );

  smoothBoneTo(
    b.head,
    getRest(c,b.head).x+s2*.007,
    getRest(c,b.head).y+s*.026,
    getRest(c,b.head).z+s2*.008,
    .09
  );

  if(c.model){
    c.model.position.y=THREE.MathUtils.lerp(c.model.position.y,Math.abs(s)*.004,.12);
  }

  // Personalità specifica durante l'attesa.
  animateNpcPersonality(c,b,false);

  // SecurityMan: mantiene la posa delle dita già approvata.
  animateSecurityFingers(c,false);
  animateSecurityHeadSpeech(c,false);
}


// ================= NUOVA CAMMINATA PROCEDURALE PLAYER =================
// Sostituisce completamente il vecchio PLAYER_WALK_CONFIG e la vecchia
// animatePlayerWalk basata su Euler assoluti.
//
// Questa configurazione è la traduzione DIRETTA del JSON esportato dal
// simulatore. Gli angoli sono offset applicati alla posa originale del GLB,
// sugli assi del modello, tramite quaternion.
const PLAYER_PROCEDURAL_WALK_CONFIG={
  format:"procedural-walk-config",
  version:1,

  speed:1.12,
  stride:0.38,
  knee:0.84,
  ankle:0.36,

  armAmount:0.70,

  shoulderIn:0.29,
  shoulderPoseX:0.00,
  shoulderPoseY:-0.41,
  shoulderPoseZ:0.00,

  armPoseX:0.00,
  armPoseY:0.00,
  armPoseZ:0.00,

  forearmPoseX:0.20,
  forearmPoseY:0.00,
  forearmPoseZ:0.00,

  handPoseX:-0.16,
  handPoseY:-0.08,
  handPoseZ:0.00,

  armSwingX:1.00,
  armSwingY:0.00,
  armSwingZ:0.00,

  forearmSwingX:0.12,
  forearmSwingY:0.00,
  forearmSwingZ:0.00,

  handSwingX:0.00,
  handSwingY:0.00,
  handSwingZ:0.00,

  floorClearance:0.075,

  mirrorArmPose:true,
  invertLeftArm:false,
  invertRightArm:false,
  invertHips:false,
  invertKnees:false,

  // Valori interni del simulatore.
  cycleRadiansPerSecond:4.85,
  shoulderSwingFactor:0.05,
  toeFactor:0.52,

  pelvisTwist:0.012,
  pelvisRoll:0.004,
  breathingSway:0.003,

  // BRACCIA DELLA VERSIONE PRECEDENTE DEL GIOCO.
  // Questi valori vengono applicati come posa Euler assoluta, esattamente
  // come nel vecchio animatePlayerWalk.
  oldArms:{
    shoulderZ:0.0,
    armSwingX:-0.01,
    armBaseX:-0.04,

    leftArmZMin:0.20,
    leftArmZMax:-0.50,
    rightArmZMin:-0.20,
    rightArmZMax:0.50,

    foreArmBaseX:0.06,
    foreArmMoveX:0.045,

    leftForeArmZBase:0.00,
    leftForeArmZMin:0.15,
    leftForeArmZMax:0.25,

    rightForeArmZBase:0.00,
    rightForeArmZMin:-0.15,
    rightForeArmZMax:-0.25,

    handZ:0.025
  },

  // Morbidezza della transizione.
  // Più basso = ritorno alla posa ferma più lento.
  walkPoseLerp:0.28,
  stopPoseLerp:0.075,
  stopPositionLerp:0.08
};

const PLAYER_AXIS_RIGHT=new THREE.Vector3(1,0,0);
const PLAYER_AXIS_UP=new THREE.Vector3(0,1,0);
const PLAYER_AXIS_FORWARD=new THREE.Vector3(0,0,1);

// Stato separato per ogni istanza, senza modificare Player.js.
const PLAYER_PROCEDURAL_STATE=new WeakMap();

function createPlayerProceduralState(c){
  const b=getBones(c);
  const restQ=new Map();
  const restP=new Map();

  Object.values(b).filter(Boolean).forEach((bone)=>{
    restQ.set(bone,bone.quaternion.clone());
    restP.set(bone,bone.position.clone());
  });

  const state={
    bones:b,
    restQ,
    restP,
    phase:0,
    lastTime:performance.now(),
    initialized:true,
    modelBaseY:c.model ? c.model.position.y : 0
  };

  PLAYER_PROCEDURAL_STATE.set(c,state);
  return state;
}

function getPlayerProceduralState(c){
  let state=PLAYER_PROCEDURAL_STATE.get(c);

  // Ricrea la cache se il modello o le ossa non erano ancora disponibili.
  if(!state || !state.initialized || state.bones.hips?.parent===null){
    state=createPlayerProceduralState(c);
  }

  return state;
}

function smooth01(v){
  const x=THREE.MathUtils.clamp(v,0,1);
  return x*x*(3-2*x);
}

// Stesse quattro fasi usate dal simulatore:
// contatto tallone, appoggio, distacco punta, oscillazione.
function getPlayerGaitPhase(phase){
  const s=Math.sin(phase);
  const c=Math.cos(phase);

  const pushOff=smooth01((-c-0.08)/0.92);
  const swingLift=smooth01((-s+0.02)/1.02);
  const landing=smooth01((c-0.08)/0.92);
  const support=smooth01((s+0.15)/1.15)*smooth01((c+0.35)/1.35);

  const knee=
    pushOff*0.34+
    swingLift*0.90-
    landing*0.08;

  const ankle=
    -s*0.20+
    pushOff*0.38-
    landing*0.22-
    support*0.05;

  const toe=
    pushOff*0.50-
    landing*0.06;

  return {
    hip:s,
    knee:Math.max(0.02,knee),
    ankle,
    toe
  };
}

function restorePlayerProceduralPose(state){
  for(const [bone,q] of state.restQ){
    bone.quaternion.copy(q);
  }

  for(const [bone,p] of state.restP){
    bone.position.copy(p);
  }
}

// Converte un asse del modello nell'asse locale del parent dell'osso.
// È la stessa logica del simulatore: gli assi restano coerenti anche se
// il personaggio gira nel mondo.
function getPlayerAxisInBoneParent(c,bone,axisInModel){
  if(!c.model || !bone || !bone.parent) return null;

  c.model.updateMatrixWorld(true);
  bone.parent.updateMatrixWorld(true);

  const modelWorldQ=new THREE.Quaternion();
  const parentWorldQ=new THREE.Quaternion();

  c.model.getWorldQuaternion(modelWorldQ);
  bone.parent.getWorldQuaternion(parentWorldQ);

  return axisInModel.clone()
    .applyQuaternion(modelWorldQ)
    .normalize()
    .applyQuaternion(parentWorldQ.invert())
    .normalize();
}

function setPlayerBoneAxisRotation(c,state,bone,axisInModel,angle){
  if(!bone || !state.restQ.has(bone)) return;

  const axisParent=getPlayerAxisInBoneParent(c,bone,axisInModel);
  if(!axisParent) return;

  const deltaQ=new THREE.Quaternion().setFromAxisAngle(axisParent,angle);
  bone.quaternion.copy(state.restQ.get(bone));
  bone.quaternion.premultiply(deltaQ);
}

function addPlayerBoneAxisRotation(c,bone,axisInModel,angle){
  if(!bone) return;

  const axisParent=getPlayerAxisInBoneParent(c,bone,axisInModel);
  if(!axisParent) return;

  const deltaQ=new THREE.Quaternion().setFromAxisAngle(axisParent,angle);
  bone.quaternion.premultiply(deltaQ);
}

function applyPlayerOldArms(c,state,phase,isWalking){
  const cfg=PLAYER_PROCEDURAL_WALK_CONFIG.oldArms;
  const b=state.bones;
  const pose=getPose(c);

  const walk=Math.sin(phase);
  const walkOpp=Math.sin(phase+Math.PI);

  if(isWalking){
    // SPALLE della vecchia versione.
    if(b.leftShoulder){
      b.leftShoulder.rotation.set(
        getRest(c,b.leftShoulder).x,
        getRest(c,b.leftShoulder).y,
        getRest(c,b.leftShoulder).z+walkOpp*cfg.shoulderZ
      );
    }

    if(b.rightShoulder){
      b.rightShoulder.rotation.set(
        getRest(c,b.rightShoulder).x,
        getRest(c,b.rightShoulder).y,
        getRest(c,b.rightShoulder).z+walk*cfg.shoulderZ
      );
    }

    // OMERI: stessi min/max della versione precedente.
    const leftArmZAmount=(walkOpp+1)*0.5;
    const rightArmZAmount=(walk+1)*0.5;

    const leftArmZ=THREE.MathUtils.lerp(
      cfg.leftArmZMin,
      cfg.leftArmZMax,
      leftArmZAmount
    );

    const rightArmZ=THREE.MathUtils.lerp(
      cfg.rightArmZMin,
      cfg.rightArmZMax,
      rightArmZAmount
    );

    if(b.leftArm){
      b.leftArm.rotation.set(
        pose.armX+cfg.armBaseX+walkOpp*cfg.armSwingX,
        0,
        leftArmZ
      );
    }

    if(b.rightArm){
      b.rightArm.rotation.set(
        pose.armX+cfg.armBaseX+walk*cfg.armSwingX,
        0,
        rightArmZ
      );
    }

    // AVAMBRACCI / GOMITI della vecchia versione.
    const leftElbowZAmount=(walkOpp+1)*0.5;
    const rightElbowZAmount=(walk+1)*0.5;

    const leftForeArmZ=THREE.MathUtils.lerp(
      cfg.leftForeArmZMin,
      cfg.leftForeArmZMax,
      leftElbowZAmount
    );

    const rightForeArmZ=THREE.MathUtils.lerp(
      cfg.rightForeArmZMin,
      cfg.rightForeArmZMax,
      rightElbowZAmount
    );

    if(b.leftForeArm){
      b.leftForeArm.rotation.set(
        pose.foreArmX+cfg.foreArmBaseX+Math.max(0,walk)*cfg.foreArmMoveX,
        0,
        leftForeArmZ
      );
    }

    if(b.rightForeArm){
      b.rightForeArm.rotation.set(
        pose.foreArmX+cfg.foreArmBaseX+Math.max(0,walkOpp)*cfg.foreArmMoveX,
        0,
        rightForeArmZ
      );
    }

    // MANI leggere come prima.
    if(b.leftHand){
      b.leftHand.rotation.set(
        getRest(c,b.leftHand).x,
        getRest(c,b.leftHand).y,
        getRest(c,b.leftHand).z+walkOpp*cfg.handZ
      );
    }

    if(b.rightHand){
      b.rightHand.rotation.set(
        getRest(c,b.rightHand).x,
        getRest(c,b.rightHand).y,
        getRest(c,b.rightHand).z+walk*cfg.handZ
      );
    }
  }else{
    // Posa ferma originale della vecchia versione.
    if(b.leftShoulder){
      b.leftShoulder.rotation.copy(getRest(c,b.leftShoulder));
    }
    if(b.rightShoulder){
      b.rightShoulder.rotation.copy(getRest(c,b.rightShoulder));
    }

    if(b.leftArm){
      b.leftArm.rotation.set(pose.armX,0,0);
    }
    if(b.rightArm){
      b.rightArm.rotation.set(pose.armX,0,0);
    }

    if(b.leftForeArm){
      b.leftForeArm.rotation.set(
        pose.foreArmX,
        0,
        cfg.leftForeArmZBase
      );
    }

    if(b.rightForeArm){
      b.rightForeArm.rotation.set(
        pose.foreArmX,
        0,
        cfg.rightForeArmZBase
      );
    }

    if(b.leftHand){
      b.leftHand.rotation.copy(getRest(c,b.leftHand));
    }
    if(b.rightHand){
      b.rightHand.rotation.copy(getRest(c,b.rightHand));
    }
  }
}

// Salva la posa visuale corrente prima di costruire il nuovo target.
function capturePlayerPose(state){
  const snapshot=new Map();

  for(const bone of state.restQ.keys()){
    snapshot.set(bone,{
      quaternion:bone.quaternion.clone(),
      position:bone.position.clone()
    });
  }

  return snapshot;
}

// Mescola la posa precedente con quella appena calcolata.
// In questo modo il passaggio walk -> idle non può scattare.
function blendPlayerPoseFromSnapshot(state,snapshot,amount,positionAmount=amount){
  const targetQ=new THREE.Quaternion();
  const targetP=new THREE.Vector3();

  for(const bone of state.restQ.keys()){
    const previous=snapshot.get(bone);
    if(!previous) continue;

    targetQ.copy(bone.quaternion);
    bone.quaternion.copy(previous.quaternion).slerp(targetQ,amount);

    targetP.copy(bone.position);
    bone.position.copy(previous.position).lerp(targetP,positionAmount);
  }
}

function solvePlayerFloorCollision(c,state){
  if(!c.model) return;

  c.model.updateMatrixWorld(true);

  const floorBones=[
    state.bones.leftFoot,
    state.bones.rightFoot,
    state.bones.leftToe,
    state.bones.rightToe
  ].filter(Boolean);

  if(!floorBones.length) return;

  const worldPos=new THREE.Vector3();
  let lowestY=Infinity;

  for(const bone of floorBones){
    bone.getWorldPosition(worldPos);
    lowestY=Math.min(lowestY,worldPos.y);
  }

  const targetY=PLAYER_PROCEDURAL_WALK_CONFIG.floorClearance;
  const correction=targetY-lowestY;

  // Alza immediatamente in caso di penetrazione.
  if(correction>0){
    c.model.position.y+=correction;
  }else{
    // Quando non c'è penetrazione, torna dolcemente alla quota di caricamento.
    c.model.position.y=THREE.MathUtils.lerp(
      c.model.position.y,
      state.modelBaseY,
      0.12
    );
  }

  c.model.updateMatrixWorld(true);
}

function animatePlayerWalk(c){
  if(!c.ready || !c.model) return;

  const cfg=PLAYER_PROCEDURAL_WALK_CONFIG;
  const state=getPlayerProceduralState(c);
  const b=state.bones;

  const now=performance.now();
  const delta=Math.min((now-state.lastTime)/1000,0.05);
  state.lastTime=now;
  state.phase+=delta*cfg.cycleRadiansPerSecond*Math.max(cfg.speed,0.04);

  const previousPose=capturePlayerPose(state);
  restorePlayerProceduralPose(state);

  const left=getPlayerGaitPhase(state.phase);
  const right=getPlayerGaitPhase(state.phase+Math.PI);

  const legSign=cfg.invertHips ? -1 : 1;
  const kneeSign=cfg.invertKnees ? -1 : 1;

  left.hip*=legSign;
  right.hip*=legSign;

  // GAMBE: stessa sequenza anatomica del simulatore.
  setPlayerBoneAxisRotation(c,state,b.leftUpLeg,PLAYER_AXIS_RIGHT,left.hip*cfg.stride);
  setPlayerBoneAxisRotation(c,state,b.rightUpLeg,PLAYER_AXIS_RIGHT,right.hip*cfg.stride);

  setPlayerBoneAxisRotation(
    c,state,b.leftKnee,PLAYER_AXIS_RIGHT,
    kneeSign*left.knee*cfg.knee
  );
  setPlayerBoneAxisRotation(
    c,state,b.rightKnee,PLAYER_AXIS_RIGHT,
    kneeSign*right.knee*cfg.knee
  );

  setPlayerBoneAxisRotation(
    c,state,b.leftFoot,PLAYER_AXIS_RIGHT,
    left.ankle*cfg.ankle
  );
  setPlayerBoneAxisRotation(
    c,state,b.rightFoot,PLAYER_AXIS_RIGHT,
    right.ankle*cfg.ankle
  );

  setPlayerBoneAxisRotation(
    c,state,b.leftToe,PLAYER_AXIS_RIGHT,
    left.toe*cfg.toeFactor
  );
  setPlayerBoneAxisRotation(
    c,state,b.rightToe,PLAYER_AXIS_RIGHT,
    right.toe*cfg.toeFactor
  );

  // BRACCIA: ripristinate dalla vecchia versione del gioco.
  applyPlayerOldArms(c,state,state.phase,true);

  // OSCILLAZIONI LEGGERE:
  // mantengono un po' di naturalezza senza il forte effetto ondeggiante
  // presente nella prima versione.
  const pelvisTwist=Math.sin(state.phase)*cfg.pelvisTwist;
  const pelvisRoll=Math.sin(state.phase*2)*cfg.pelvisRoll;
  const bodyBreath=Math.sin(state.phase*2)*cfg.breathingSway;

  setPlayerBoneAxisRotation(c,state,b.hips,PLAYER_AXIS_UP,pelvisTwist);
  addPlayerBoneAxisRotation(c,b.hips,PLAYER_AXIS_FORWARD,pelvisRoll);

  setPlayerBoneAxisRotation(c,state,b.spine,PLAYER_AXIS_UP,-pelvisTwist*0.30);
  addPlayerBoneAxisRotation(c,b.spine,PLAYER_AXIS_RIGHT,bodyBreath);

  setPlayerBoneAxisRotation(c,state,b.spine1,PLAYER_AXIS_UP,-pelvisTwist*0.20);
  addPlayerBoneAxisRotation(c,b.spine1,PLAYER_AXIS_RIGHT,bodyBreath*0.55);

  setPlayerBoneAxisRotation(c,state,b.spine2,PLAYER_AXIS_UP,-pelvisTwist*0.12);
  addPlayerBoneAxisRotation(c,b.spine2,PLAYER_AXIS_RIGHT,bodyBreath*0.25);

  setPlayerBoneAxisRotation(c,state,b.neck,PLAYER_AXIS_UP,pelvisTwist*0.08);
  setPlayerBoneAxisRotation(c,state,b.head,PLAYER_AXIS_UP,pelvisTwist*0.035);

  if(b.hips && state.restP.has(b.hips)){
    b.hips.position.copy(state.restP.get(b.hips));

    // Spostamenti molto piccoli: niente forte oscillazione laterale.
    b.hips.position.x+=Math.sin(state.phase)*0.018;
    b.hips.position.y+=Math.cos(state.phase*2)*0.018;
    b.hips.position.z+=Math.sin(state.phase)*0.018;
  }

  // Passaggio morbido verso il target di camminata.
  blendPlayerPoseFromSnapshot(
    state,
    previousPose,
    cfg.walkPoseLerp,
    cfg.walkPoseLerp
  );

  c.model.updateMatrixWorld(true);
  solvePlayerFloorCollision(c,state);
}

function animatePlayerProceduralIdle(c){
  if(!c.ready || !c.model) return;

  const cfg=PLAYER_PROCEDURAL_WALK_CONFIG;
  const state=getPlayerProceduralState(c);
  const now=performance.now();

  // Congela la fase nel punto esatto in cui il player si è fermato.
  // La posa corrente diventa il punto di partenza della transizione.
  state.lastTime=now;
  const previousPose=capturePlayerPose(state);

  // Costruisce la posa target ferma.
  restorePlayerProceduralPose(state);
  applyPlayerOldArms(c,state,state.phase,false);

  // Movimento idle molto leggero SOLO dalla vita in su.
  // Bacino, gambe, ginocchia, piedi e dita restano completamente fermi.
  const idleSeconds=now*0.001;
  const idleSlow=Math.sin(idleSeconds*1.15);
  const idleBreath=Math.sin(idleSeconds*1.85);
  const idleMicro=Math.sin(idleSeconds*0.63);

  setPlayerBoneAxisRotation(
    c,state,state.bones.spine,PLAYER_AXIS_RIGHT,
    idleBreath*0.006
  );
  addPlayerBoneAxisRotation(
    c,state,state.bones.spine,PLAYER_AXIS_UP,
    idleSlow*0.0035
  );

  setPlayerBoneAxisRotation(
    c,state,state.bones.spine1,PLAYER_AXIS_RIGHT,
    idleBreath*0.0045
  );
  addPlayerBoneAxisRotation(
    c,state,state.bones.spine1,PLAYER_AXIS_UP,
    -idleSlow*0.0028
  );

  setPlayerBoneAxisRotation(
    c,state,state.bones.spine2,PLAYER_AXIS_RIGHT,
    idleBreath*0.003
  );
  addPlayerBoneAxisRotation(
    c,state,state.bones.spine2,PLAYER_AXIS_UP,
    idleMicro*0.002
  );

  setPlayerBoneAxisRotation(
    c,state,state.bones.neck,PLAYER_AXIS_UP,
    -idleSlow*0.002
  );
  setPlayerBoneAxisRotation(
    c,state,state.bones.head,PLAYER_AXIS_UP,
    idleMicro*0.0015
  );

  // Piccolissimo sollevamento del torace per simulare il respiro.
  // Viene spostata solo la colonna, non il bacino.
  if(state.bones.spine && state.restP.has(state.bones.spine)){
    state.bones.spine.position.copy(state.restP.get(state.bones.spine));
    state.bones.spine.position.y+=idleBreath*0.0035;
  }

  // Ritorno lento e continuo dalla posa dell'ultimo passo alla posa ferma.
  blendPlayerPoseFromSnapshot(
    state,
    previousPose,
    cfg.stopPoseLerp,
    cfg.stopPositionLerp
  );

  c.model.updateMatrixWorld(true);
  solvePlayerFloorCollision(c,state);
}

function animateTalkSecurity(c){
  const b=getBones(c);
  const t=performance.now()*.0065;
  const s=Math.sin(t);
  const s2=Math.sin(t*1.5);
  const pose=getPose(c);

  /*
    FIX IMPORTANTE:
    non muoviamo più avambracci in modo grande.
    Prima gli avambracci finivano verso anche/linguine.
    Ora le braccia restano nella posa stretta e il dialogo lo fanno:
    testa + busto + mani leggere.
  */

  smoothBoneTo(b.leftArm,pose.armX,0,0,.16);
  smoothBoneTo(b.rightArm,pose.armX,0,0,.16);

  smoothBoneTo(b.leftForeArm,pose.foreArmX,0,0,.16);
  smoothBoneTo(b.rightForeArm,pose.foreArmX,0,0,.16);

  // solo piccoli movimenti delle mani
  smoothBoneTo(b.leftHand,getRest(c,b.leftHand).x,getRest(c,b.leftHand).y+s*.04,getRest(c,b.leftHand).z+s2*.05,.16);
  smoothBoneTo(b.rightHand,getRest(c,b.rightHand).x,getRest(c,b.rightHand).y+s2*.05,getRest(c,b.rightHand).z+s*.07,.16);

  // spalle appena vive, senza aprire braccia
  smoothBoneTo(b.leftShoulder,getRest(c,b.leftShoulder).x,getRest(c,b.leftShoulder).y,getRest(c,b.leftShoulder).z+s*.006,.12);
  smoothBoneTo(b.rightShoulder,getRest(c,b.rightShoulder).x,getRest(c,b.rightShoulder).y,getRest(c,b.rightShoulder).z-s*.006,.12);

  // corpo/testa parlano
  smoothBoneTo(b.hips,getRest(c,b.hips).x,getRest(c,b.hips).y+s*.003,getRest(c,b.hips).z-s*.003,.12);
  smoothBoneTo(b.spine,getRest(c,b.spine).x+.015,getRest(c,b.spine).y,getRest(c,b.spine).z+s*.020,.12);
  smoothBoneTo(b.neck,getRest(c,b.neck).x,getRest(c,b.neck).y+s*.032,getRest(c,b.neck).z,.12);
  smoothBoneTo(b.head,getRest(c,b.head).x+s2*.014,getRest(c,b.head).y+s*.060,getRest(c,b.head).z+s*.018,.12);
}


function animateTalkMusic(c){
  const b=getBones(c);
  const t=performance.now()*.008;
  const s=Math.sin(t);

  const pose=getPose(c);

  // Braccia ferme vicino al busto: niente più mani dentro le anche.
  smoothBoneTo(b.leftArm,pose.armX,0,0,.16);

  smoothBoneTo(b.leftForeArm,pose.foreArmX,0,0,.16);

  // mani leggere, come piccoli gesti
  smoothBoneTo(b.leftHand,getRest(c,b.leftHand).x+s*.03,getRest(c,b.leftHand).y,getRest(c,b.leftHand).z+s*.08,.16);
  smoothBoneTo(b.rightHand,getRest(c,b.rightHand).x+s2*.03,getRest(c,b.rightHand).y,getRest(c,b.rightHand).z+s*.10,.16);

  smoothBoneTo(b.leftShoulder,getRest(c,b.leftShoulder).x,getRest(c,b.leftShoulder).y,getRest(c,b.leftShoulder).z+s*.006,.12);
  smoothBoneTo(b.rightShoulder,getRest(c,b.rightShoulder).x,getRest(c,b.rightShoulder).y,getRest(c,b.rightShoulder).z-s*.006,.12);

  smoothBoneTo(b.hips,getRest(c,b.hips).x,getRest(c,b.hips).y+s*.004,getRest(c,b.hips).z-s*.004,.12);
  smoothBoneTo(b.spine,getRest(c,b.spine).x+.010,getRest(c,b.spine).y,getRest(c,b.spine).z+s*.025,.12);
  smoothBoneTo(b.neck,getRest(c,b.neck).x,getRest(c,b.neck).y+s2*.040,getRest(c,b.neck).z,.12);
  smoothBoneTo(b.head,getRest(c,b.head).x+s*.014,getRest(c,b.head).y+s*.075,getRest(c,b.head).z+s*.035,.12);

  if(c.model){
    c.model.position.y=THREE.MathUtils.lerp(c.model.position.y,Math.abs(s)*.008,.12);

function animateTalkChild(c){
  const b=getBones(c);
  const t=performance.now()*.0075;
  const s=Math.sin(t);
  const s2=Math.sin(t*1.7);
  const pose=getPose(c);

  /*
    Questa animazione usa i TUOI valori:

    RIPOSO:
    leftArm  x=1.0795 z=-0.0015
    rightArm x=1.1295 z=0.0246

    BRACCIO ALZATO:
    leftArm  x=0.9295 z=0.7485
    rightArm x=1.1295 z=0.2246

    Movimento:
    - passa dalla posa riposo alla posa braccio alzato
    - poi oscilla un po' con sin()
    - busto e testa ondulano mentre parla
  */

  // talkAmount va circa da 0.15 a 1.0, così non torna mai completamente morto.
  const talkAmount=0.58 + Math.sin(t*.9)*0.22;

  const leftArmX=THREE.MathUtils.lerp(
    pose.leftArmRestX,
    pose.leftArmTalkX,
    talkAmount
  );

  const leftArmZ=THREE.MathUtils.lerp(
    pose.leftArmRestZ,
    pose.leftArmTalkZ,
    talkAmount
  );

  const rightArmX=THREE.MathUtils.lerp(
    pose.rightArmRestX,
    pose.rightArmTalkX,
    talkAmount*.55
  );

  const rightArmZ=THREE.MathUtils.lerp(
    pose.rightArmRestZ,
    pose.rightArmTalkZ,
    talkAmount*.55
  );

  // Braccio sinistro alzato come nella tua seconda posa.
  smoothBoneTo(
    b.leftArm,
    leftArmX + s*.025,
    0,
    leftArmZ + s2*.035,
    .17
  );

  // Braccio destro accompagna meno, ma segue un po'.
  smoothBoneTo(
    b.rightArm,
    rightArmX + s2*.018,
    0,
    rightArmZ + s*.025,
    .17
  );

  // Avambraccio sinistro leggermente vivo.
  smoothBoneTo(
    b.leftForeArm,
    pose.leftForeArmTalkX + s2*.05,
    getRest(c,b.leftForeArm).y,
    getRest(c,b.leftForeArm).z,
    .17
  );

  // Avambraccio destro resta vicino alla tua posa.
  smoothBoneTo(
    b.rightForeArm,
    pose.rightForeArmTalkX + s*.04,
    getRest(c,b.rightForeArm).y,
    getRest(c,b.rightForeArm).z,
    .17
  );

  // Mano destra come nella posa che hai trovato, con piccola oscillazione.
  smoothBoneTo(
    b.rightHand,
    pose.rightHandTalkX + s*.025,
    pose.rightHandTalkY + s2*.045,
    getRest(c,b.rightHand).z + s*.035,
    .17
  );

  // Mano sinistra un po' viva.
  smoothBoneTo(
    b.leftHand,
    getRest(c,b.leftHand).x + s*.025,
    getRest(c,b.leftHand).y + s2*.030,
    getRest(c,b.leftHand).z + s2*.045,
    .17
  );

  // Corpo ondula mentre parla.
  smoothBoneTo(
    b.hips,
    getRest(c,b.hips).x+s*.002,
    getRest(c,b.hips).y+s*.004,
    getRest(c,b.hips).z-s*.004,
    .12
  );

  smoothBoneTo(
    b.spine,
    getRest(c,b.spine).x+s*.012,
    getRest(c,b.spine).y,
    getRest(c,b.spine).z+s*.026,
    .12
  );

  smoothBoneTo(
    b.neck,
    getRest(c,b.neck).x+s2*.006,
    getRest(c,b.neck).y+s*.040,
    getRest(c,b.neck).z,
    .12
  );

  smoothBoneTo(
    b.head,
    getRest(c,b.head).x+s*.020,
    getRest(c,b.head).y+s*.085,
    getRest(c,b.head).z+s2*.018,
    .12
  );

  if(c.model){
    c.model.position.y=THREE.MathUtils.lerp(c.model.position.y,Math.abs(s)*.010,.12);
  }
}

// ================= TRANSIZIONI PORTE / CAMBIO ZONA =================
// Il cambio zona avviene solo dopo conferma con E davanti alla porta.
const WORLD_ZONES={
  outside:{label:"OUTSIDE"},
  leftRoom:{label:"LEFT SHOP"},
  rightRoom:{label:"RIGHT SHOP"}
};

let activeWorldZone="outside";
let sceneTransitionBusy=false;
let transitionCooldown=0;
let pendingDoorTransition=null;

function setWorldZone(zoneKey){
  activeWorldZone=zoneKey;
  currentZoneLabel.textContent="";
}

function runDoorTransition(zoneKey,targetPosition,targetRotation){
  if(sceneTransitionBusy || !player || !player.ready) return;

  const transitionData=pendingDoorTransition;
  const isStationRealEntry=Boolean(transitionData?.stationRealEntry);
  const isStationRealExit=Boolean(transitionData?.stationRealExit);

  pendingDoorTransition=null;
  doorPrompt.style.display="none";
  sceneTransitionBusy=true;
  sceneFade.classList.add("active");

  if(!isStationRealEntry && !isStationRealExit){
    zoneTitle.textContent=WORLD_ZONES[zoneKey].label;
    zoneTitle.classList.add("active");
  }

  setTimeout(()=>{
    if(isStationRealEntry){
      // Spostamento solo orizzontale: la Y non viene mai modificata.
      stationInside=true;
      player.root.position.x=STATION_NAV.insideX;
      player.root.position.z=STATION_NAV.insideZ;
    }else if(isStationRealExit){
      stationInside=false;
      player.root.position.x=STATION_NAV.outsideX;
      player.root.position.z=STATION_NAV.outsideZ;
    }else{
      player.root.position.copy(targetPosition);
    }

    player.root.rotation.y=targetRotation;

    cleanCameraReady=false;
    setWorldZone(zoneKey);

    setTimeout(()=>{
      sceneFade.classList.remove("active");
      setTimeout(()=>{
        if(!isStationRealEntry && !isStationRealExit) zoneTitle.classList.remove("active");
        sceneTransitionBusy=false;
        transitionCooldown=45;
      },220);
    },120);
  },330);
}

function updateDoorSceneTransitions(){
  pendingDoorTransition=null;

  if(!player || !player.ready || sceneTransitionBusy){
    doorPrompt.style.display="none";
    return;
  }

  if(transitionCooldown>0){
    transitionCooldown--;
    doorPrompt.style.display="none";
    return;
  }

  const p=player.root.position;
  const leftDoorX=SCENE_ENV_CONFIG.leftRoomCenterX+SCENE_ENV_CONFIG.leftDoorOffsetX;
  const rightDoorX=SCENE_ENV_CONFIG.rightRoomCenterX;

  const nearLeftX=Math.abs(p.x-leftDoorX)<2.8;
  const nearRightX=Math.abs(p.x-rightDoorX)<2.8;

  // Davanti alle porte dall'esterno.
  if(activeWorldZone==="outside" && p.z>2.4 && p.z<7.2){
    if(nearLeftX){
      pendingDoorTransition={
        label:"Enter GAME ROOM?",
        zoneKey:"leftRoom",
        target:new THREE.Vector3(leftDoorX,0,-4.2),
        rotation:Math.PI
      };
    }else if(nearRightX){
      pendingDoorTransition={
        label:"Enter MUSIC ROOM?",
        zoneKey:"rightRoom",
        target:new THREE.Vector3(rightDoorX,0,-2.2),
        rotation:Math.PI
      };
    }
  }

  // Davanti alla porta dall'interno.
  if(activeWorldZone==="leftRoom" && nearLeftX && p.z>-3.8 && p.z<1.9){
    pendingDoorTransition={
      label:"Exit to OUTSIDE?",
      zoneKey:"outside",
      target:new THREE.Vector3(leftDoorX,0,6.2),
      rotation:0
    };
  }

  if(activeWorldZone==="rightRoom" && nearRightX && p.z>-3.8 && p.z<1.9){
    pendingDoorTransition={
      label:"Exit to OUTSIDE?",
      zoneKey:"outside",
      target:new THREE.Vector3(rightDoorX,0,6.2),
      rotation:0
    };
  }

  // Station: E appare esclusivamente davanti alla porta reale.
  if(activeWorldZone==="outside"){
    const doorDistance=Math.hypot(
      p.x-STATION_NAV.doorX,
      p.z-STATION_NAV.doorZ
    );

    if(!stationInside && doorDistance<STATION_NAV.interactionRadius && p.y>STATION_NAV.deckMinY){
      pendingDoorTransition={
        label:"Entra nella LIFEGUARD STATION?",
        zoneKey:"outside",
        target:new THREE.Vector3(STATION_NAV.insideX,p.y,STATION_NAV.insideZ),
        rotation:-Math.PI*.80,
        stationRealEntry:true
      };
    }else if(stationInside && doorDistance<STATION_NAV.interactionRadius+0.25){
      pendingDoorTransition={
        label:"Esci dalla LIFEGUARD STATION?",
        zoneKey:"outside",
        target:new THREE.Vector3(STATION_NAV.outsideX,p.y,STATION_NAV.outsideZ),
        rotation:Math.PI*.20,
        stationRealExit:true
      };
    }
  }

  if(pendingDoorTransition){
    doorPrompt.innerHTML=pendingDoorTransition.label+"<strong>Press E</strong>";
    doorPrompt.style.display="block";
  }else{
    doorPrompt.style.display="none";
  }
}

// ================= MINIMAP =================
const MAP_WORLD={
  minX:-75,
  maxX:75,
  minZ:-40,
  maxZ:430
};

function mapPoint(x,z){
  const px=(x-MAP_WORLD.minX)/(MAP_WORLD.maxX-MAP_WORLD.minX)*minimap.width;
  const py=(z-MAP_WORLD.minZ)/(MAP_WORLD.maxZ-MAP_WORLD.minZ)*minimap.height;
  return {x:px,y:py};
}

function roundedRectPath(ctx,x,y,width,height,radius=12){
  const r=Math.min(radius,width/2,height/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+width-r,y);
  ctx.quadraticCurveTo(x+width,y,x+width,y+r);
  ctx.lineTo(x+width,y+height-r);
  ctx.quadraticCurveTo(x+width,y+height,x+width-r,y+height);
  ctx.lineTo(x+r,y+height);
  ctx.quadraticCurveTo(x,y+height,x,y+height-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function drawMapZone(x1,z1,x2,z2,radius=12){
  const a=mapPoint(x1,z1);
  const b=mapPoint(x2,z2);
  const left=Math.min(a.x,b.x);
  const top=Math.min(a.y,b.y);
  const width=Math.abs(b.x-a.x);
  const height=Math.abs(b.y-a.y);

  minimapCtx.strokeStyle="#ffffff";
  minimapCtx.lineWidth=3;
  roundedRectPath(minimapCtx,left,top,width,height,radius);
  minimapCtx.stroke();
}

function getPlayerMapZone(){
  if(!player || !player.ready) return "LOADING";
  const p=player.root.position;

  if(p.z<SCENE_ENV_CONFIG.frontZ){
    const splitX=(SCENE_ENV_CONFIG.leftRoomCenterX+SCENE_ENV_CONFIG.rightRoomCenterX)/2;
    return p.x<splitX ? "CASINO" : "PUB";
  }
  if(p.z<29.1) return "SIDEWALK";
  if(p.z<53.1) return "ROAD";
  if(p.z<60.5) return "FAR SIDEWALK";

  if(p.z<180) return "BEACH";
  return "SEA";
}

function drawMinimap(){
  const ctx=minimapCtx;
  ctx.clearRect(0,0,minimap.width,minimap.height);
  ctx.fillStyle="#000000";
  ctx.fillRect(0,0,minimap.width,minimap.height);

  const halfRoom=SCENE_ENV_CONFIG.roomWidth/2;
  drawMapZone(SCENE_ENV_CONFIG.leftRoomCenterX-halfRoom,-40,SCENE_ENV_CONFIG.leftRoomCenterX+halfRoom,3);
  drawMapZone(SCENE_ENV_CONFIG.rightRoomCenterX-halfRoom,-40,SCENE_ENV_CONFIG.rightRoomCenterX+halfRoom,3);

  drawMapZone(MAP_WORLD.minX,3,MAP_WORLD.maxX,29.1);
  drawMapZone(MAP_WORLD.minX,29.1,MAP_WORLD.maxX,53.1);
  drawMapZone(MAP_WORLD.minX,53.1,MAP_WORLD.maxX,60.5);
  drawMapZone(MAP_WORLD.minX,60.5,MAP_WORLD.maxX,180);
  drawMapZone(MAP_WORLD.minX,180,MAP_WORLD.maxX,MAP_WORLD.maxZ);

  // Divisione interna del locale slot, senza nomi.
  const splitTop=mapPoint(SLOT_SPLIT_X,SCENE_ENV_CONFIG.backZ);
  const splitDoorA=mapPoint(SLOT_SPLIT_X,SLOT_SMALL_DOOR_Z-SLOT_SMALL_DOOR_WIDTH/2);
  const splitDoorB=mapPoint(SLOT_SPLIT_X,SLOT_SMALL_DOOR_Z+SLOT_SMALL_DOOR_WIDTH/2);
  const splitBottom=mapPoint(SLOT_SPLIT_X,SCENE_ENV_CONFIG.frontZ);
  ctx.strokeStyle="#ffffff";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(splitTop.x,splitTop.y);
  ctx.lineTo(splitDoorA.x,splitDoorA.y);
  ctx.moveTo(splitDoorB.x,splitDoorB.y);
  ctx.lineTo(splitBottom.x,splitBottom.y);
  ctx.stroke();

  // Porte bianche.
  const leftDoor=mapPoint(
    SCENE_ENV_CONFIG.leftRoomCenterX+SCENE_ENV_CONFIG.leftDoorOffsetX,
    3.2
  );
  const rightDoor=mapPoint(SCENE_ENV_CONFIG.rightRoomCenterX,3.2);

  ctx.fillStyle="#ffffff";
  ctx.fillRect(leftDoor.x-10,leftDoor.y-3,20,6);
  ctx.fillRect(rightDoor.x-10,rightDoor.y-3,20,6);

  // Strisce pedonali tratteggiate sulla minimappa.
  ctx.fillStyle="#ffffff";
  for(let z=CROSSWALK.roadMinZ+1.2;z<CROSSWALK.roadMaxZ-1.0;z+=2.5){
    const a=mapPoint(CROSSWALK.centerX-CROSSWALK.halfWidth,z-.45);
    const b=mapPoint(CROSSWALK.centerX+CROSSWALK.halfWidth,z+.45);

    ctx.fillRect(
      Math.min(a.x,b.x),
      Math.min(a.y,b.y),
      Math.abs(b.x-a.x),
      Math.max(2,Math.abs(b.y-a.y))
    );
  }

  // Linea di costa e mare sulla minimappa.
  const shoreA=mapPoint(MAP_WORLD.minX,180);
  const shoreB=mapPoint(MAP_WORLD.maxX,180);
  ctx.strokeStyle="#65c8ff";
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(shoreA.x,shoreA.y);
  ctx.lineTo(shoreB.x,shoreB.y);
  ctx.stroke();

  // Player: cerchio nero con bordo bianco, così la mappa resta monocromatica.
  if(player && player.ready){
    const p=mapPoint(player.root.position.x,player.root.position.z);

    ctx.beginPath();
    ctx.arc(p.x,p.y,10,0,Math.PI*2);
    ctx.fillStyle="#000000";
    ctx.fill();
    ctx.lineWidth=4;
    ctx.strokeStyle="#ffffff";
    ctx.stroke();

    const angle=player.root.rotation.y;
    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
    ctx.lineTo(
      p.x+Math.sin(angle)*23,
      p.y+Math.cos(angle)*23
    );
    ctx.lineWidth=5;
    ctx.strokeStyle="#ffffff";
    ctx.stroke();
  }

  currentZoneLabel.textContent=getPlayerMapZone();
}

// ================= MOVIMENTO PLAYER =================
let playerMoving=false;

function updatePlayer(){
  if(!player.ready || sceneTransitionBusy) return;

  const speed=player.getMoveSpeed();
  const previousPosition=player.root.position.clone();

  // Movimento CAMERA-RELATIVE:
  // W/S/A/D restano coerenti con quello che vedi sullo schermo.
  // W va verso il centro della visuale, S indietro, A/D laterali.
  const camForward=new THREE.Vector3();
  camera.getWorldDirection(camForward);
  camForward.y=0;

  if(camForward.lengthSq()<0.0001){
    camForward.set(0,0,-1);
  }else{
    camForward.normalize();
  }

  const camRight=new THREE.Vector3()
    .crossVectors(camForward,new THREE.Vector3(0,1,0))
    .normalize();

  const moveDir=new THREE.Vector3(0,0,0);

  if(keys["w"]) moveDir.add(camForward);
  if(keys["s"]) moveDir.sub(camForward);
  if(keys["d"]) moveDir.add(camRight);
  if(keys["a"]) moveDir.sub(camRight);

  playerMoving=moveDir.lengthSq()>0.0001;

  if(playerMoving){
    moveDir.normalize();

    player.root.position.addScaledVector(moveDir,speed);

    // Il player gira verso la direzione reale in cui cammina.
    const targetRotation=Math.atan2(moveDir.x,moveDir.z);
    player.root.rotation.y=lerpAngle(player.root.rotation.y,targetRotation,.20);
  }

  if(activeWorldZone==="outside"){
    // La carreggiata si può attraversare soltanto sulle strisce.
    const isInsideRoad=
      player.root.position.z>CROSSWALK.roadMinZ &&
      player.root.position.z<CROSSWALK.roadMaxZ;

    const isOnCrosswalk=
      Math.abs(player.root.position.x-CROSSWALK.centerX)<=CROSSWALK.halfWidth;

    if(isInsideRoad && !isOnCrosswalk){
      player.root.position.copy(previousPosition);
    }

    // Esterno raggiungibile: fronte e intera area interna della U,
    // compresi i marciapiedi laterali continui.
    player.root.position.x=THREE.MathUtils.clamp(
      player.root.position.x,
      -(U_X-19),
      U_X-19
    );
    player.root.position.z=THREE.MathUtils.clamp(
      player.root.position.z,
      U_BACK_Z+2,
      176.0
    );
  }else{
    // Limiti interni calcolati sul Casino o sul Pub.
    {
      const centerX=
        activeWorldZone==="leftRoom"
          ? SCENE_ENV_CONFIG.leftRoomCenterX
          : activeWorldZone==="rightRoom"
            ? SCENE_ENV_CONFIG.rightRoomCenterX
            : SCENE_ENV_CONFIG.thirdRoomCenterX;

      const halfW=SCENE_ENV_CONFIG.roomWidth/2-.8;
      player.root.position.x=THREE.MathUtils.clamp(
        player.root.position.x,
        centerX-halfW,
        centerX+halfW
      );
      player.root.position.z=THREE.MathUtils.clamp(
        player.root.position.z,
        SCENE_ENV_CONFIG.backZ+1.0,
        SCENE_ENV_CONFIG.frontZ-1.0
      );
    }
  }

  updatePlayerStationFloor(previousPosition);

  if(playerMoving) animatePlayerWalk(player);
  else animateIdle(player);
}

// ================= INTERAZIONE NPC =================
let currentTarget=null;
let lastE=false;

function distance(a,b){
  return a.root.position.distanceTo(b.root.position);
}

function updateInteraction(){
  currentTarget=null;
  slotInteractionTarget=null;

  let best=null;
  let bestDist=999;

  for(const npc of npcs){
    if(!npc.ready) continue;

    const d=player.distanceTo(npc);
    if(d<4.3 && d<bestDist){
      best=npc;
      bestDist=d;
    }
  }

  currentTarget=best;

  // La slot ha priorità solo quando il player è realmente vicino al mobile.
  let nearestSlotDistance=999;
  if(activeWorldZone==="leftRoom"){
    for(const state of SLOT_MACHINES){
      const d=player.root.position.distanceTo(state.root.position);
      if(d<4.0 && d<nearestSlotDistance){
        nearestSlotDistance=d;
        slotInteractionTarget=state;
      }
    }
  }

  if(slotInteractionTarget && !pendingDoorTransition){
    slotPrompt.innerHTML=slotInteractionTarget.playing
      ? "SLOT MACHINE<strong>Animation in progress...</strong>"
      : "SLOT MACHINE<strong>Press E to play</strong>";
    slotPrompt.style.display="block";
  }else{
    slotPrompt.style.display="none";
  }

  const eDown=!!keys["e"];

  if(eDown && !lastE){
    if(pendingDoorTransition){
      runDoorTransition(
        pendingDoorTransition.zoneKey,
        pendingDoorTransition.target,
        pendingDoorTransition.rotation
      );
    }else if(slotInteractionTarget){
      playSlotMachine(slotInteractionTarget);
    }else if(currentTarget){
      currentTarget.startDialogue();
    }
  }

  lastE=eDown;
}

function updateNPC(npc){
  if(!npc.ready) return;

  if(npc.state==="talk"){
    npc.timer++;

    if(npc.name==="toxicMan"){
      updateToxicManTalkFacing();
      animateTalk(npc);
      updateToxicHeadFacingPlayer(npc);

      if(typeof npc.toxicFixedRotationY==="number"){
        npc.root.rotation.y=npc.toxicFixedRotationY;
      }
    }else{
      npc.lookAtCharacter(player,.12);
      animateTalk(npc);
    }

    if(npc.timer>260){
      npc.stopDialogue();
    }

    return;
  }

  if(npc.name==="toxicMan"){
    updateToxicManFacingSlot();

    if(typeof npc.toxicFixedRotationY==="number"){
      npc.root.rotation.y=npc.toxicFixedRotationY;
    }
  }

  animateIdle(npc);
}


// ================= CAMERA PULITA TERZA PERSONA =================
// Camera unica e stabile:
// - sempre dietro al player
// - più alta
// - guarda nuca/spalle, non gambe
// - niente logiche stanza/porta/collisione camera
// - movimento lento e smooth
const CLEAN_CAMERA_CONFIG={
  distance:6.75,
  height:6.25,
  lookHeight:2.55,
  sideOffset:0.00,

  // La camera segue rapidamente la rotazione, ma senza scatti.
  yawLerp:0.16,
  sharpTurnYawLerp:0.48,
  sharpTurnThreshold:THREE.MathUtils.degToRad(75),

  // La posizione segue abbastanza rapidamente da non attraversare il player.
  positionLerp:0.16,
  sharpTurnPositionLerp:0.32,
  lookLerp:0.12
};

let cleanCameraLookTarget=new THREE.Vector3();
let cleanCameraReady=false;
let cleanCameraYaw=0;

function updateCleanPlayerCamera(){
  if(!player || !player.root) return;

  const targetYaw=player.root.rotation.y;

  if(!cleanCameraReady){
    cleanCameraYaw=targetYaw;
  }

  // Differenza angolare più corta tra camera e player.
  const yawDelta=Math.atan2(
    Math.sin(targetYaw-cleanCameraYaw),
    Math.cos(targetYaw-cleanCameraYaw)
  );

  const sharpTurn=Math.abs(yawDelta)>CLEAN_CAMERA_CONFIG.sharpTurnThreshold;
  const yawAmount=sharpTurn
    ? CLEAN_CAMERA_CONFIG.sharpTurnYawLerp
    : CLEAN_CAMERA_CONFIG.yawLerp;

  // La camera ruota intorno al player seguendo la sua schiena.
  cleanCameraYaw=lerpAngle(cleanCameraYaw,targetYaw,yawAmount);

  const forward=new THREE.Vector3(
    Math.sin(cleanCameraYaw),
    0,
    Math.cos(cleanCameraYaw)
  ).normalize();

  const right=new THREE.Vector3(
    Math.cos(cleanCameraYaw),
    0,
    -Math.sin(cleanCameraYaw)
  ).normalize();

  const zoneCamera=CAMERA_ZONE_SETTINGS[activeWorldZone] || CAMERA_ZONE_SETTINGS.outside;

  // Avvicinamento progressivo sulla rampa e dentro la station reale.
  // Non cambia scena: dipende soltanto dalla posizione effettiva del player.
  const stationDistance=Math.hypot(
    player.root.position.x-STATION_NAV.centerX,
    player.root.position.z-STATION_NAV.doorZ
  );
  const onStationApproach=activeWorldZone==="outside" && stationDistance<14.5;
  const stationCameraBlend=onStationApproach
    ? THREE.MathUtils.clamp((14.5-stationDistance)/8.5,0,1)
    : 0;
  const cabinCameraBlend=stationInside ? 1 : 0;

  const normalCameraDistance=activeWorldZone==="outside"
    ? CLEAN_CAMERA_CONFIG.distance
    : zoneCamera.distance;
  const normalCameraHeight=activeWorldZone==="outside"
    ? CLEAN_CAMERA_CONFIG.height
    : zoneCamera.height;
  const normalLookHeight=activeWorldZone==="outside"
    ? CLEAN_CAMERA_CONFIG.lookHeight
    : 2.15;

  const rampCameraDistance=THREE.MathUtils.lerp(normalCameraDistance,5.25,stationCameraBlend);
  const rampCameraHeight=THREE.MathUtils.lerp(normalCameraHeight,3.65,stationCameraBlend);
  const rampLookHeight=THREE.MathUtils.lerp(normalLookHeight,1.85,stationCameraBlend);
  // Dentro la cabina la camera segue il player come una vera camera interna.
  const cameraDistance=THREE.MathUtils.lerp(rampCameraDistance,3.15,cabinCameraBlend);
  const cameraHeight=THREE.MathUtils.lerp(rampCameraHeight,4.15,cabinCameraBlend);
  const cameraLookHeight=THREE.MathUtils.lerp(rampLookHeight,2.05,cabinCameraBlend);

  const desiredCameraPos=player.root.position.clone()
    .addScaledVector(forward,-cameraDistance)
    .addScaledVector(right,THREE.MathUtils.lerp(CLEAN_CAMERA_CONFIG.sideOffset,.18,cabinCameraBlend))
    .add(new THREE.Vector3(0,cameraHeight,0));

  const desiredLookTarget=player.root.position.clone();
  desiredLookTarget.y+=cameraLookHeight;

  if(!cleanCameraReady){
    camera.position.copy(desiredCameraPos);
    cleanCameraLookTarget.copy(desiredLookTarget);
    cleanCameraReady=true;
  }else{
    const positionAmount=sharpTurn
      ? CLEAN_CAMERA_CONFIG.sharpTurnPositionLerp
      : CLEAN_CAMERA_CONFIG.positionLerp;

    camera.position.lerp(desiredCameraPos,positionAmount);
    cleanCameraLookTarget.lerp(
      desiredLookTarget,
      CLEAN_CAMERA_CONFIG.lookLerp
    );
  }

  camera.lookAt(cleanCameraLookTarget);
}

// ================= LOOP =================


function animate(){
  requestAnimationFrame(animate);

  updatePlayer();
  updateSlidingDoors();
  updateDoorSceneTransitions();
  updateStreetCar();
  updateCoastalWater();
  updateSlotMachines(Math.min(slotClock.getDelta(),.05));
  updateSecurityIdleFacing();
  
  updateInteraction();

  for(const npc of npcs){
    updateNPC(npc);
  }

  // Ultima correzione del frame: ToxicMan resta rivolto verso la slot destra.
  

  updateCleanPlayerCamera();
  drawMinimap();

  ui.textContent=pendingDoorTransition
    ? "WASD = move | E = confirm door"
    : slotInteractionTarget
      ? (slotInteractionTarget.playing
          ? "SLOT MACHINE: animation in progress"
          : "WASD = move | E = play slot machine")
      : currentTarget
        ? "WASD = move | E = talk to " + currentTarget.name
        : "WASD = move | stand in front of a door to enter";

  renderer.render(scene,camera);
}

animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
