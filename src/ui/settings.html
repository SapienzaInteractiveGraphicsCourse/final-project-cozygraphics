<div id="settingsBackdrop">
</div>

<div id="settingsToggle">SETTINGS</div>

<div id="collisionDebugToggle">COLLISIONS</div>

<div id="settingsPanel">
<div id="settingsHeader">
<div>
<div id="settingsKicker">GAME CONFIGURATION</div>
<div id="settingsTitle">SETTINGS</div>
</div>
<button id="settingsClose">×</button>
</div>
<div id="settingsGrid">
<div class="settingsSection settingsCard">
<div class="settingsSectionTitle">CAMERA</div>
<div class="settingsCardHint">Global view tuning</div>
<label>
          Zoom 
          <span id="setCamZoomVal">1.00×</span>
</label>
<input id="setCamZoom" max="1.35" min="0.65" step="0.01" type="range" value="1.00"/>
<label>
          Height 
          <span id="setCamHeightVal">0.00</span>
</label>
<input id="setCamHeight" max="2.0" min="-2.0" step="0.05" type="range" value="0"/>
<label>
          Look height 
          <span id="setCamLookVal">0.00</span>
</label>
<input id="setCamLook" max="1.5" min="-1.5" step="0.05" type="range" value="0"/>
<label>
          FOV 
          <span id="setCamFovVal">60°</span>
</label>
<input id="setCamFov" max="80" min="45" step="1" type="range" value="60"/>
</div>
<div class="settingsSection settingsCard">
<div class="settingsSectionTitle">CLOTHES</div>
<div class="settingsCardHint">Clothing color combinations — skin/hair stay unchanged</div>
<select id="setOutfit">
<option value="original">Original Outfit</option>
<option value="forest">Forest Green Hoodie · Blue Jeans</option>
<option value="burgundy">Burgundy Hoodie · Charcoal Jeans</option>
<option value="mono">White &amp; Black Hoodie · Black Jeans</option>
</select>
</div>
<div class="settingsSection settingsCard">
<div class="settingsSectionTitle">DIFFICULTY</div>
<div class="settingsCardHint">Mission difficulty profile</div>
<select id="setDifficulty">
<option selected="" value="easy">Easy</option>
<option value="intermediate">Intermediate</option>
<option value="hard">Hard</option>
</select>
<div class="settingsNote">Easy shows task + map destination · Intermediate shows task only · Hard hides guidance.</div>
</div>
</div>
</div>
