function makeBox(name,w,h,d,x,y,z,color){
  const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({color})
  );
  mesh.name=name;
  mesh.position.set(x,y,z);

  return mesh;
}

  );

  mesh.rotation.x=-Math.PI/2;
  mesh.position.set(x,y,z);
  scene.add(mesh);
  return mesh;
}

function makeRoomFacade(roomName,centerX,color){
  const roomW=SCENE_ENV_CONFIG.roomWidth;

  const h=SCENE_ENV_CONFIG.roomHeight;

  makeBox(`${roomName}_front_wall_right_of_door`,sideW,h,.62,centerX+sideCenterOffset,h/2,z,color);
  makeBox(`${roomName}_front_wall_above_door`,doorW,SCENE_ENV_CONFIG.roomHeight-SCENE_ENV_CONFIG.doorHeight,.62,centerX,SCENE_ENV_CONFIG.doorHeight+(SCENE_ENV_CONFIG.roomHeight-SCENE_ENV_CONFIG.doorHeight)/2,z,color);

  makeBox(`${roomName}_door_frame_top`,doorW+.56,.28,.78,centerX,SCENE_ENV_CONFIG.doorHeight+.14,z+.06,0x120018);
}

function updateSlidingDoors(){
  if(!player || !player.root) return;

  Object.values(SLIDING_DOORS).forEach((d)=>{
    const dist=Math.hypot(
      player.root.position.x-d.triggerX,
      player.root.position.z-d.triggerZ
    );

    const targetX = dist < d.openDistance ? d.openX : d.closedX;
    const oldDoorX=d.door.position.x;

    d.door.position.x=THREE.MathUtils.lerp(d.door.position.x,targetX,d.speed);

    const delta=d.door.position.x-oldDoorX;
    d.handle.position.x+=delta;
  });
}

// ================= FUNZIONI UTILI =================
function fitModelToHeight(model,targetHeight=1.7){
  model.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(model);
  const size=box.getSize(new THREE.Vector3());

  if(size.y<=0){
    console.warn("Altezza modello non valida",size);
    return;
  }

  const scale=targetHeight/size.y;
  model.scale.multiplyScalar(scale);
  model.updateMatrixWorld(true);
}

function putModelOnFloor(model,y=0){
  model.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(model);
  model.position.y += y - box.min.y;
  model.updateMatrixWorld(true);
}

function keepCharacterAboveFloor(c,margin=0.035){
  if(!c || !c.model) return;

  c.model.updateMatrixWorld(true);

  // Box del modello + controllo diretto delle ossa dei piedi.
  // Con gli SkinnedMesh a volte il Box3 non vede bene la deformazione animata,
  // quindi controlliamo anche leftFoot/rightFoot in world position.
  const box=new THREE.Box3().setFromObject(c.model);
  let minY=box.min.y;

  const b=getBones(c);
  const footPos=new THREE.Vector3();

  if(b.leftFoot){
    b.leftFoot.getWorldPosition(footPos);
    minY=Math.min(minY,footPos.y);
  }

  if(b.rightFoot){
    b.rightFoot.getWorldPosition(footPos);
    minY=Math.min(minY,footPos.y);
  }

  if(minY < margin){
    c.model.position.y += margin - minY;
    c.model.updateMatrixWorld(true);
  }
}

function centerModelXZ(model){
  model.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(model);
  const center=box.getCenter(new THREE.Vector3());

  model.position.x -= center.x;
  model.position.z -= center.z;
  model.updateMatrixWorld(true);
}

function printHierarchy(obj,depth=0){
  const pad="  ".repeat(depth);
  const info=[];

  if(obj.isMesh) info.push("Mesh");
  if(obj.isSkinnedMesh) info.push("SkinnedMesh");
  if(obj.isBone) info.push("Bone");
  if(obj.isGroup) info.push("Group");

  console.log(`${pad}${obj.name || "(senza nome)"} | type=${obj.type} | ${info.join(", ")}`);

  obj.children.forEach((child)=>printHierarchy(child,depth+1));
}

function lerpAngle(a,b,t){
  const diff=Math.atan2(Math.sin(b-a),Math.cos(b-a));
  return a+diff*t;
}

function smoothBoneTo(bone,x,y,z,lerp=0.28){
  if(!bone) return;
  bone.rotation.x=THREE.MathUtils.lerp(bone.rotation.x,x,lerp);
  bone.rotation.y=THREE.MathUtils.lerp(bone.rotation.y,y,lerp);
  bone.rotation.z=THREE.MathUtils.lerp(bone.rotation.z,z,lerp);
}

function angleToTarget(fromGroup,targetGroup){
  const dx=targetGroup.position.x-fromGroup.position.x;
  const dz=targetGroup.position.z-fromGroup.position.z;

  // Corretto: niente +Math.PI.
  // Prima tutti guardavano dalla parte opposta.
  return Math.atan2(dx,dz);
}

function createCharacterData(name,file,x,z,height=4,rotationY=Math.PI){
  const c={
    name,
    file,
    root:new THREE.Group(),
    model:null,
    bones:[],
    meshes:[],
    rest:new Map(),
    ready:false,
    height,
    state:"idle",
    timer:0,
    dialogue:"",
    style:"idle",
    originalRotationY:rotationY
  };

  c.root.position.set(x,0,z);
  c.root.rotation.y=rotationY;
  scene.add(c.root);

  return c;
}

function createCharacterFromBlock(block){
  const c=createCharacterData(
    block.name,
    block.file,
    block.position.x,
    block.position.z,
    block.height,
    block.rotationY
  );

  c.style=block.style || "idle";
  c.dialogue=block.dialogue || "";
  c.zone=block.zone || "world";
  c.role=block.role || "npc";

  if(block.speed) c.speed=block.speed;

  return c;
}

function smoothStep01(v){
  v=THREE.MathUtils.clamp(v,0,1);
  return v*v*(3-2*v);
}

function lerpRot(a,b,t){
  return {
    x:THREE.MathUtils.lerp(a.x ?? 0,b.x ?? a.x ?? 0,t),
    y:THREE.MathUtils.lerp(a.y ?? 0,b.y ?? a.y ?? 0,t),
    z:THREE.MathUtils.lerp(a.z ?? 0,b.z ?? a.z ?? 0,t),
    lerp:b.lerp ?? a.lerp ?? TOXIC_MAN_ANIM_CONFIG.limbLerp
  };
}

function applyToxicRot(b,limbName,rot,lerpOverride=null){
  const bone=b[limbName];
  if(!bone || !rot) return;
  smoothBoneTo(
    bone,
    rot.x ?? 0,
    rot.y ?? 0,
    rot.z ?? 0,
    lerpOverride ?? rot.lerp ?? TOXIC_MAN_ANIM_CONFIG.limbLerp
  );
}

function addRubToRightBellyPose(rot,rubA,rubB,cfg,mult=1){
  rot.rightArm.x += rubA*cfg.rubArmX*mult;
  rot.rightForeArm.y -= rubA*cfg.rubForeArmY*mult;
  rot.rightForeArm.z -= rubB*cfg.rubForeArmZ*mult;
  rot.rightHand.x += rubB*cfg.rubHandX*mult;
  rot.rightHand.y -= rubA*cfg.rubHandY*mult;
  rot.rightHand.z -= rubB*cfg.rubHandZ*mult;
}

function animateToxicManSpecial(c,b){
  if(c.name!=="toxicMan") return false;
  if(!TOXIC_MAN_STATIC_CONFIG.enabled) return false;
  if(!TOXIC_MAN_ANIM_CONFIG.enabled){
    applyToxicManStaticConfig(c,b);
    return true;
  }

  const cfg=TOXIC_MAN_ANIM_CONFIG;
  const base=TOXIC_MAN_STATIC_CONFIG.limbs;
  const now=performance.now();

  const t=now*.0042;
  const s=Math.sin(t);
  const s2=Math.sin(t*1.57);
  const s3=Math.sin(t*.73);

  const rubT=now*cfg.rubSpeed;
  const rubA=Math.sin(rubT);
  const rubB=Math.cos(rubT*1.08);

  const talkMode=c.state==="talk";
  const rubMult=talkMode ? cfg.talkRubMultiplier : 1.0;

  // SINISTRA: resta ferma sulla gamba.
  const leftRot={
    leftArm:{...base.leftArm},
    leftForeArm:{...base.leftForeArm},
    leftHand:{...base.leftHand}
  };

  // DESTRA: sulla pancia + strofinamento.
  const rightRot={
    rightArm:{...base.rightArm},
    rightForeArm:{...base.rightForeArm},
    rightHand:{...base.rightHand}
  };
  addRubToRightBellyPose(rightRot,rubA,rubB,cfg,rubMult);

  // Quando parli con toxicMan, entrambe le braccia vengono portate più davanti.
  // L'oscillazione è morbida: entra/esce senza scatti.
  if(talkMode){
    const talkPulse=(Math.sin(now*cfg.talkForwardSpeed)+1)*0.5;
    const talkAmount=0.45 + talkPulse*cfg.talkForwardLerp;

    leftRot.leftArm=lerpRot(leftRot.leftArm,cfg.leftTalkForward.leftArm,talkAmount);
    leftRot.leftForeArm=lerpRot(leftRot.leftForeArm,cfg.leftTalkForward.leftForeArm,talkAmount);
    leftRot.leftHand=lerpRot(leftRot.leftHand,cfg.leftTalkForward.leftHand,talkAmount);

    rightRot.rightArm=lerpRot(rightRot.rightArm,cfg.rightTalkForward.rightArm,talkAmount);
    rightRot.rightForeArm=lerpRot(rightRot.rightForeArm,cfg.rightTalkForward.rightForeArm,talkAmount);
    rightRot.rightHand=lerpRot(rightRot.rightHand,cfg.rightTalkForward.rightHand,talkAmount);
  }

  if(shouldUseToxicLimb("leftArm")) applyToxicRot(b,"leftArm",leftRot.leftArm);
  if(shouldUseToxicLimb("leftForeArm")) applyToxicRot(b,"leftForeArm",leftRot.leftForeArm);
  if(shouldUseToxicLimb("leftHand")) applyToxicRot(b,"leftHand",leftRot.leftHand);

  if(shouldUseToxicLimb("rightArm")) applyToxicRot(b,"rightArm",rightRot.rightArm);
  if(shouldUseToxicLimb("rightForeArm")) applyToxicRot(b,"rightForeArm",rightRot.rightForeArm);
  if(shouldUseToxicLimb("rightHand")) applyToxicRot(b,"rightHand",rightRot.rightHand);

  // Gambe/piedi: restano statici se disattivati, ma possono essere controllati dalla config.
  ["leftUpLeg","rightUpLeg","leftKnee","rightKnee","leftFoot","rightFoot"].forEach((limbName)=>{
    if(shouldUseToxicLimb(limbName)) applyToxicRot(b,limbName,base[limbName]);
  });

  // Corpo leggermente inquieto, ma controllato.
  const e=cfg.bodyEnergy;

  smoothBoneTo(
    b.hips,
    getRest(c,b.hips).x+s*cfg.hipsX*e,
    getRest(c,b.hips).y+s2*cfg.hipsY*e,
    getRest(c,b.hips).z+s3*cfg.hipsZ*e,
    cfg.bodyLerp
  );

  smoothBoneTo(
    b.spine,
    getRest(c,b.spine).x+s2*cfg.spineX*e,
    getRest(c,b.spine).y+s3*cfg.spineY*e,
    getRest(c,b.spine).z+s*cfg.spineZ*e,
    cfg.bodyLerp
  );

  smoothBoneTo(
    b.neck,
    getRest(c,b.neck).x+s3*cfg.neckX*e,
    getRest(c,b.neck).y+s*cfg.neckY*e,
    getRest(c,b.neck).z+s2*cfg.neckZ*e,
    cfg.bodyLerp
  );

  smoothBoneTo(
    b.head,
    getRest(c,b.head).x+s*cfg.headX*e,
    getRest(c,b.head).y+s2*cfg.headY*e,
    getRest(c,b.head).z+s3*cfg.headZ*e,
    cfg.bodyLerp
  );

  if(c.model){
    c.model.position.y=THREE.MathUtils.lerp(
      c.model.position.y,
      Math.abs(s)*cfg.modelBounce,
      .10
    );
  }

  return true;
}

function shouldUseToxicLimb(limbName){
  if(!TOXIC_MAN_STATIC_CONFIG.enabled) return false;
  if(TOXIC_MAN_STATIC_CONFIG.targetLimb==="all"){
    return !!TOXIC_MAN_STATIC_CONFIG.use[limbName];
  }
  return TOXIC_MAN_STATIC_CONFIG.targetLimb===limbName;
}

function applyToxicManStaticConfig(c,b){
  if(c.name!=="toxicMan") return false;
  if(!TOXIC_MAN_STATIC_CONFIG.enabled) return false;

  Object.entries(TOXIC_MAN_STATIC_CONFIG.limbs).forEach(([limbName,rot])=>{
    if(!shouldUseToxicLimb(limbName)) return;
    const bone=b[limbName];
    if(!bone) return;

    smoothBoneTo(
      bone,
      rot.x ?? 0,
      rot.y ?? 0,
      rot.z ?? 0,
      rot.lerp ?? 0.14
    );
  });

  return true;
}

function getCharacterCurrentLimbRotations(c){

    "leftArm","rightArm",
    "leftForeArm","rightForeArm",
    "leftHand","rightHand",
    "leftUpLeg","rightUpLeg",
    "leftKnee","rightKnee",
    "leftFoot","rightFoot"
  ];

  return limbNames.map((limbName)=>{
    const bone=b[limbName];

    return {
      limb:limbName,
      boneName:bone ? bone.name : "(non trovato)",
      currentX:bone ? Number(bone.rotation.x.toFixed(4)) : null,
      currentY:bone ? Number(bone.rotation.y.toFixed(4)) : null,
      currentZ:bone ? Number(bone.rotation.z.toFixed(4)) : null,
      configEnabled:!!TOXIC_MAN_STATIC_CONFIG.use[limbName],
      configX:TOXIC_MAN_STATIC_CONFIG.limbs[limbName]?.x ?? null,
      configY:TOXIC_MAN_STATIC_CONFIG.limbs[limbName]?.y ?? null,
      configZ:TOXIC_MAN_STATIC_CONFIG.limbs[limbName]?.z ?? null
    };
  });
}

function getSelectedToxicLimbName(){

function getSelectedToxicAxis(){

function getSelectedToxicRotation(){

function clampToxicIndex(){

  ed.axisIndex=(ed.axisIndex+ed.axes.length)%ed.axes.length;

function handleToxicRuntimeKey(e){
  const key=e.key.toLowerCase();
  const ed=TOXIC_RUNTIME_EDITOR;

  // Non rubare WASD/E al gioco.
  const handledKeys=["u","j","i","k","m","n","b","p","1","2","3","arrowup","arrowdown"];
  if(!handledKeys.includes(key)) return;

  e.preventDefault();

  if(key==="u") ed.limbIndex++;
  if(key==="j") ed.limbIndex--;
  if(key==="i") ed.axisIndex++;
  if(key==="k") ed.axisIndex--;
  if(key==="1") ed.axisIndex=0;
  if(key==="2") ed.axisIndex=1;
  if(key==="3") ed.axisIndex=2;

  clampToxicIndex();

  const limb=getSelectedToxicLimbName();
  const axis=getSelectedToxicAxis();
  const rot=getSelectedToxicRotation();

  if(key==="m" || key==="arrowup"){
    rot[axis]=Number((rot[axis]+ed.step).toFixed(4));
  }

  if(key==="n" || key==="arrowdown"){
    rot[axis]=Number((rot[axis]-ed.step).toFixed(4));
  }

  if(key==="b"){
    TOXIC_MAN_STATIC_CONFIG.use[limb]=!TOXIC_MAN_STATIC_CONFIG.use[limb];
  }

  if(key==="p"){
    printToxicManConfigOnly();
    printToxicManDebug();
  }

  TOXIC_MAN_STATIC_CONFIG.enabled=true;
  updateToxicRuntimePanel();
}

function posePartValues(part,talkAmount,s,s2,e){
  return {
    x:THREE.MathUtils.lerp(part.restX ?? 0, part.talkX ?? part.restX ?? 0, talkAmount) + s*(part.moveX ?? 0)*e,
    y:THREE.MathUtils.lerp(part.restY ?? 0, part.talkY ?? part.restY ?? 0, talkAmount) + s2*(part.moveY ?? 0)*e,
    z:THREE.MathUtils.lerp(part.restZ ?? 0, part.talkZ ?? part.restZ ?? 0, talkAmount) + s2*(part.moveZ ?? 0)*e
  };
}

function animateConfiguredTalk(c){
  const b=getBones(c);
  const cfg=TALK_POSES[c.name];
  if(!cfg){
    animateIdle(c);
    return;
  }

  const t=performance.now()*.0075;
  const s=Math.sin(t);
  const s2=Math.sin(t*1.7);

  // Da 0 a 1, con movimento morbido.
  const talkAmount=0.62 + Math.sin(t*.9)*0.22;
  const e=cfg.energy;

  // =====================================================
  // NUOVO SISTEMA MODIFICABILE PER SECURITY MAN
  // Se un personaggio ha leftForeArm/rightForeArm come oggetti,
  // allora usa tutti gli assi X/Y/Z configurabili.
  // =====================================================
  const fullEditableArms =
    typeof cfg.leftForeArm === "object" &&
    typeof cfg.rightForeArm === "object" &&
    typeof cfg.leftHand === "object" &&
    typeof cfg.rightHand === "object";

  if(fullEditableArms){
    const leftArm=posePartValues(cfg.leftArm,talkAmount,s,s2,e);
    const rightArm=posePartValues(cfg.rightArm,talkAmount,s2,s,e);
    const leftForeArm=posePartValues(cfg.leftForeArm,talkAmount,s2,s,e);
    const rightForeArm=posePartValues(cfg.rightForeArm,talkAmount,s,s2,e);
    const leftHand=posePartValues(cfg.leftHand,talkAmount,s,s2,e);
    const rightHand=posePartValues(cfg.rightHand,talkAmount,s,s2,e);

    if(cfg.useLeft){
      smoothBoneTo(b.leftArm,leftArm.x,leftArm.y,leftArm.z,.17);
      smoothBoneTo(b.leftForeArm,leftForeArm.x,leftForeArm.y,leftForeArm.z,.17);
      smoothBoneTo(
        b.leftHand,
        getRest(c,b.leftHand).x + leftHand.x,
        getRest(c,b.leftHand).y + leftHand.y,
        getRest(c,b.leftHand).z + leftHand.z,
        .17
      );
    }else{
      smoothBoneTo(b.leftArm,cfg.leftArm.restX,cfg.leftArm.restY,cfg.leftArm.restZ,.17);
      smoothBoneTo(b.leftForeArm,cfg.leftForeArm.restX,cfg.leftForeArm.restY,cfg.leftForeArm.restZ,.17);
      smoothBoneTo(
        b.leftHand,
        getRest(c,b.leftHand).x + cfg.leftHand.restX,
        getRest(c,b.leftHand).y + cfg.leftHand.restY,
        getRest(c,b.leftHand).z + cfg.leftHand.restZ,
        .17
      );
    }

    if(cfg.useRight){
      smoothBoneTo(b.rightArm,rightArm.x,rightArm.y,rightArm.z,.17);
      smoothBoneTo(b.rightForeArm,rightForeArm.x,rightForeArm.y,rightForeArm.z,.17);
      smoothBoneTo(
        b.rightHand,
        getRest(c,b.rightHand).x + rightHand.x,
        getRest(c,b.rightHand).y + rightHand.y,
        getRest(c,b.rightHand).z + rightHand.z,
        .17
      );
    }else{
      smoothBoneTo(b.rightArm,cfg.rightArm.restX,cfg.rightArm.restY,cfg.rightArm.restZ,.17);
      smoothBoneTo(b.rightForeArm,cfg.rightForeArm.restX,cfg.rightForeArm.restY,cfg.rightForeArm.restZ,.17);
      smoothBoneTo(
        b.rightHand,
        getRest(c,b.rightHand).x + cfg.rightHand.restX,
        getRest(c,b.rightHand).y + cfg.rightHand.restY,
        getRest(c,b.rightHand).z + cfg.rightHand.restZ,
        .17
      );
    }
  }else{
    // Sistema vecchio per child e boyListeningMusic.
    function armValues(side){
      const data=cfg[side+"Arm"];

      return {
        x:THREE.MathUtils.lerp(data.restX,data.talkX,talkAmount),
        z:THREE.MathUtils.lerp(data.restZ,data.talkZ,talkAmount)
      };
    }

    const left=armValues("left");
    const right=armValues("right");

    // LEFT ARM
    if(cfg.useLeft){
      smoothBoneTo(
        b.leftArm,
        left.x+s*.025*e,
        0,
        left.z+s2*.035*e,
        .17
      );

      smoothBoneTo(
        b.leftForeArm,
        cfg.leftForeArmX+s2*.05*e,
        getRest(c,b.leftForeArm).y,
        getRest(c,b.leftForeArm).z,
        .17
      );

      smoothBoneTo(
        b.leftHand,
        getRest(c,b.leftHand).x+s*.025*e,
        getRest(c,b.leftHand).y+s2*.030*e,
        getRest(c,b.leftHand).z+s2*.045*e,
        .17
      );
    }else{
      smoothBoneTo(b.leftArm,cfg.leftArm.restX,0,cfg.leftArm.restZ,.17);
      smoothBoneTo(b.leftForeArm,cfg.leftForeArmX,0,0,.17);
      smoothBoneTo(
        b.leftHand,
        getRest(c,b.leftHand).x,
        getRest(c,b.leftHand).y,
        getRest(c,b.leftHand).z,
        .17
      );
    }

    // RIGHT ARM
    if(cfg.useRight){
      smoothBoneTo(
        b.rightArm,
        right.x+s2*.025*e,
        0,
        right.z+s2*.035*e,
        .17
      );

      smoothBoneTo(
        b.rightForeArm,
        cfg.rightForeArmX+s*.05*e,
        getRest(c,b.rightForeArm).y,
        getRest(c,b.rightForeArm).z,
        .17
      );

      // Security: mano un pochino più a pugno.
      // Per gli altri NPC resta quasi uguale.
      const fistX = c.name==="securityMan" ? 0.10 : 0.00;
      const fistY = c.name==="securityMan" ? 0.08 : 0.00;
      const fistZ = c.name==="securityMan" ? -0.06 : 0.00;

      smoothBoneTo(
        b.rightHand,
        getRest(c,b.rightHand).x+fistX+s*.030*e,
        getRest(c,b.rightHand).y+fistY+s2*.10*e,
        getRest(c,b.rightHand).z+fistZ+s*.12*e,
        .17
      );
    }else{
      smoothBoneTo(b.rightArm,cfg.rightArm.restX,0,cfg.rightArm.restZ,.17);
      smoothBoneTo(b.rightForeArm,cfg.rightForeArmX,0,0,.17);
      smoothBoneTo(
        b.rightHand,
        getRest(c,b.rightHand).x,
        getRest(c,b.rightHand).y,
        getRest(c,b.rightHand).z,
        .17
      );
    }
  }

  // Corpo ondulatorio durante dialogo.
  smoothBoneTo(
    b.hips,
    getRest(c,b.hips).x+s*.002*e,
    getRest(c,b.hips).y+s*.004*e,
    getRest(c,b.hips).z-s*.004*e,
    .12
  );

  smoothBoneTo(
    b.spine,
    getRest(c,b.spine).x+s*.012*e,
    getRest(c,b.spine).y,
    getRest(c,b.spine).z+s*.026*e,
    .12
  );

  smoothBoneTo(
    b.neck,
    getRest(c,b.neck).x+s2*.006*e,
    getRest(c,b.neck).y+s*.040*e,
    getRest(c,b.neck).z,
    .12
  );

  smoothBoneTo(
    b.head,
    getRest(c,b.head).x+s*.020*e,
    getRest(c,b.head).y+s*.085*e,
    getRest(c,b.head).z+s2*.018*e,
    .12
  );

  if(c.model){
    c.model.position.y=THREE.MathUtils.lerp(c.model.position.y,Math.abs(s)*.008*e,.12);
  }
}


// ================= CARICAMENTO CHARACTER =================
function loadCharacter(c){
  loader.load(
    c.file,
    (gltf)=>{
      const model=gltf.scene;
      c.model=model;

      console.log("===== CARICATO:",c.file,"=====");
      console.log(gltf);
      printHierarchy(model);

      c.bones=[];
      c.meshes=[];
      c.rest.clear();

      model.traverse((obj)=>{
        if(obj.isBone) c.bones.push(obj);

        if(obj.isMesh || obj.isSkinnedMesh){
          c.meshes.push(obj);
          obj.castShadow=true;
          obj.frustumCulled=false;
        }
      });

      c.bones.forEach((bone)=>{
        c.rest.set(bone,bone.rotation.clone());
      });

      centerModelXZ(model);
      fitModelToHeight(model,c.height);
      putModelOnFloor(model,0);

      c.root.add(model);
      c.ready=true;

      window[c.name]=c;

      console.log(c.name+" pronto");
      console.log("Bones:",c.bones.map(b=>b.name));

      // ================= DEBUG POLICE / SECURITY OFFICER =================

            },

              x: bone.position.x,
              y: bone.position.y,

            }
          );
        });

        console.log("----- OSSA BRACCIA / GOMITI / MANI -----");

            n.includes("shoulder") ||

// ================= OSSA =================
function findBone(c,words){
  const lowerWords=words.map(w=>w.toLowerCase());

  return c.bones.find((bone)=>{
    const n=(bone.name || "").toLowerCase();
    return lowerWords.some(w=>n.includes(w));
  }) || null;
}

function getRest(c,bone){
  return c.rest.get(bone) || new THREE.Euler(0,0,0);
}

function getBones(c){
  return {
    hips:findBone(c,["hips","pelvis","mixamorighips"]),
    spine:findBone(c,["spine2","spine_04","chest","spine"]),
    neck:findBone(c,["neck"]),
    head:findBone(c,["head"]),

    leftShoulder:findBone(c,["leftshoulder","mixamorigleftshoulder"]),
    rightShoulder:findBone(c,["rightshoulder","mixamorigrightshoulder"]),

    leftArm:findBone(c,["leftarm","left_arm","arm_l","upperarm_l","mixamorigleftarm"]),
    rightArm:findBone(c,["rightarm","right_arm","arm_r","upperarm_r","mixamorigrightarm"]),

    leftForeArm:findBone(c,["leftforearm","left_forearm","forearm_l","lowerarm_l","mixamorigleftforearm"]),
    rightForeArm:findBone(c,["rightforearm","right_forearm","forearm_r","lowerarm_r","mixamorigrightforearm"]),

    leftHand:findBone(c,["lefthand","hand_l","mixamoriglefthand"]),
    rightHand:findBone(c,["righthand","hand_r","mixamorigrighthand"]),

    leftUpLeg:findBone(c,["leftupleg","thigh_l","mixamorigleftupleg"]),
    rightUpLeg:findBone(c,["rightupleg","thigh_r","mixamorigrightupleg"]),

    leftKnee:findBone(c,["mixamorigleftleg","leftlowerleg","lowerleg_l","calf_l","shin_l"]),
    rightKnee:findBone(c,["mixamorigrightleg","rightlowerleg","lowerleg_r","calf_r","shin_r"]),

    leftFoot:findBone(c,["leftfoot","foot_l","mixamorigleftfoot"]),
    rightFoot:findBone(c,["rightfoot","foot_r","mixamorigrightfoot"])
  };
}

// ================= ANIMAZIONI BASE =================
function animateIdle(c){
  if(!c.ready) return;

  const b=getBones(c);
  const t=performance.now()*.0035;
  const s=Math.sin(t);
  const s2=Math.sin(t*.7);
  const pose=getPose(c);
  const talkCfg=TALK_POSES[c.name];

  if(c.name==="toxicMan" && TOXIC_MAN_STATIC_CONFIG.enabled){
    animateToxicManSpecial(c,b);
    return;
  }else if(talkCfg){
    const fullEditableArms =
      typeof talkCfg.leftForeArm === "object" &&
      typeof talkCfg.rightForeArm === "object";

    if(fullEditableArms){
      smoothBoneTo(b.leftArm,talkCfg.leftArm.restX,talkCfg.leftArm.restY,talkCfg.leftArm.restZ,.14);
      smoothBoneTo(b.rightArm,talkCfg.rightArm.restX,talkCfg.rightArm.restY,talkCfg.rightArm.restZ,.14);
      smoothBoneTo(b.leftForeArm,talkCfg.leftForeArm.restX,talkCfg.leftForeArm.restY,talkCfg.leftForeArm.restZ,.14);
      smoothBoneTo(b.rightForeArm,talkCfg.rightForeArm.restX,talkCfg.rightForeArm.restY,talkCfg.rightForeArm.restZ,.14);
      smoothBoneTo(
        b.leftHand,
        getRest(c,b.leftHand).x + talkCfg.leftHand.restX,
        getRest(c,b.leftHand).y + talkCfg.leftHand.restY,
        getRest(c,b.leftHand).z + talkCfg.leftHand.restZ,
        .14
      );
      smoothBoneTo(
        b.rightHand,
        getRest(c,b.rightHand).x + talkCfg.rightHand.restX,
        getRest(c,b.rightHand).y + talkCfg.rightHand.restY,
        getRest(c,b.rightHand).z + talkCfg.rightHand.restZ,
        .14
      );
    }else{
      smoothBoneTo(b.leftArm,talkCfg.leftArm.restX,0,talkCfg.leftArm.restZ,.14);
      smoothBoneTo(b.rightArm,talkCfg.rightArm.restX,0,talkCfg.rightArm.restZ,.14);
      smoothBoneTo(b.leftForeArm,talkCfg.leftForeArmX,0,0,.14);
      smoothBoneTo(b.rightForeArm,talkCfg.rightForeArmX,0,0,.14);
    }
  }else{
    smoothBoneTo(b.leftArm,pose.armX,0,0,.14);
    smoothBoneTo(b.rightArm,pose.armX,0,0,.14);

    // PLAYER: gomiti su asse Z con valore base quando è fermo.
    if(c.name==="player"){
      smoothBoneTo(
        b.leftForeArm,
        pose.foreArmX,
        0,
        PLAYER_WALK_CONFIG.leftForeArmZBase,
        .14
      );

      smoothBoneTo(
        b.rightForeArm,
        pose.foreArmX,
        0,
        PLAYER_WALK_CONFIG.rightForeArmZBase,
        .14
      );
    }else{
      smoothBoneTo(b.leftForeArm,pose.foreArmX,0,0,.14);
      smoothBoneTo(b.rightForeArm,pose.foreArmX,0,0,.14);
    }
  }

  // PLAYER: quando smette di camminare, gambe e piedi tornano a posto
  // in modo fluido partendo dalla posa in cui si trovavano.
  if(c.name==="player"){
    smoothBoneTo(
      b.leftUpLeg,
      getRest(c,b.leftUpLeg).x,
      getRest(c,b.leftUpLeg).y,
      getRest(c,b.leftUpLeg).z,
      .10
    );

    smoothBoneTo(
      b.rightUpLeg,
      getRest(c,b.rightUpLeg).x,
      getRest(c,b.rightUpLeg).y,
      getRest(c,b.rightUpLeg).z,
      .10
    );

    smoothBoneTo(
      b.leftKnee,
      getRest(c,b.leftKnee).x,
      getRest(c,b.leftKnee).y,
      getRest(c,b.leftKnee).z,
      .12
    );

    smoothBoneTo(
      b.rightKnee,
      getRest(c,b.rightKnee).x,
      getRest(c,b.rightKnee).y,
      getRest(c,b.rightKnee).z,
      .12
    );

    smoothBoneTo(
      b.leftFoot,
      getRest(c,b.leftFoot).x,
      getRest(c,b.leftFoot).y,
      getRest(c,b.leftFoot).z,
      .12
    );

    smoothBoneTo(
      b.rightFoot,
      getRest(c,b.rightFoot).x,
      getRest(c,b.rightFoot).y,
      getRest(c,b.rightFoot).z,
      .12
    );
  }

  // Tutti hanno idle vivo.
  smoothBoneTo(
    b.hips,
    getRest(c,b.hips).x+s2*.003,
    getRest(c,b.hips).y+s*.004,
    getRest(c,b.hips).z-s*.004,
    .09
  );

  smoothBoneTo(
    b.spine,
    getRest(c,b.spine).x+s2*.006,
    getRest(c,b.spine).y,
    getRest(c,b.spine).z+s*.012,
    .09
  );

  smoothBoneTo(
    b.neck,
    getRest(c,b.neck).x+s2*.004,
    getRest(c,b.neck).y+s*.014,
    getRest(c,b.neck).z,
    .09
  );

  smoothBoneTo(
    b.head,
    getRest(c,b.head).x+s2*.007,
    getRest(c,b.head).y+s*.026,
    getRest(c,b.head).z+s2*.008,
    .09
  );

  if(c.model){
    c.model.position.y=THREE.MathUtils.lerp(c.model.position.y,Math.abs(s)*.004,.12);
  }
}


// ================= CONFIG CAMMINATA PLAYER =================
// Modifica solo questi valori per sistemare la camminata.
// X = avanti/indietro, Y = torsione, Z = lato/apertura.
// Consiglio: cambia poco alla volta, tipo +0.01 / -0.01.
const PLAYER_WALK_CONFIG = {
  // velocità ciclo camminata: più alto = passi più veloci
  speed: 0.0070,

  // rimbalzo verticale del modello intero
  bodyBounce: 0.0002,

  // bacino: tienili bassi se il corpo traballa troppo
  hipsX: 0.002,
  hipsY: 0.002,
  hipsZ: 0.002,

  // busto: abbassa spineY/spineZ se sopra balla troppo
  spineBaseX: 0.008,
  spineY: 0.002,
  spineZ: -0.008,

  // collo/testa: abbassa headY/headZ se sembra instabile
  neckX: 0.002,
  neckY: 0.005,
  neckZ: 0.002,
  headX: 0.024,
  headY: 0.010,
  headZ: 0.004,

  // spalle e braccia
  shoulderZ: 0.0,
  armSwingX: -0.01,
  armBaseX: -0.04,
  armZ: 0.1,

  // SWING ASSE Z DELLE BRACCIA
  // Questi sono i nuovi min/max dello swing laterale delle braccia.
  // Non toccano armSwingX: servono solo per controllare l'apertura su Z.
  leftArmZMin: 0.20,
  leftArmZMax: -0.50,
  rightArmZMin: -0.20,
  rightArmZMax: 0.50,

  // gomiti/braccia inferiori
  foreArmBaseX: 0.06,
  foreArmMoveX: 0.045,

  // NUOVO: asse Z dei gomiti del PLAYER durante la camminata
  // base = valore quando il player è fermo
  // min/max = estremi dell'oscillazione mentre cammina
  // Se il gomito va dalla parte sbagliata, cambia il segno dei valori Z.
  leftForeArmZBase: 0.00,
  leftForeArmZMin: 0.15,
  leftForeArmZMax: 0.25,

  rightForeArmZBase: 0.00,
  rightForeArmZMin:- 0.15,
  rightForeArmZMax: -0.25,
// gambe
upLegSwing: 0.30,
upLegRecover: 0.16,
kneeBend: 0.30,

// piedi
footLift: 0.20,
footPlantDown: 0.23,

// mani leggere durante camminata
handZ: 0.025,

// morbidezza
upperLerp: 0.14,
legLerp: 0.14,
kneeLerp: 0.24,
footLerp: 0.16,
bounceLerp: 0.22,

// margine minimo per non scendere sotto il pavimento
floorSafetyMargin: 0.035
};

function animatePlayerWalk(c){
  if(!c.ready) return;

  const b=getBones(c);
  const cfg=PLAYER_WALK_CONFIG;
  const t=performance.now()*cfg.speed;

  const walk=Math.sin(t);
  const walkOpp=Math.sin(t+Math.PI);

  const leftSwing=Math.max(0,-walk);
  const rightSwing=Math.max(0,-walkOpp);

  const leftPlant=Math.max(0,walk);
  const rightPlant=Math.max(0,walkOpp);

  const bounce=Math.abs(Math.sin(t*2));
  const pose=getPose(c);

  // BACINO - molto stabile
  smoothBoneTo(
    b.hips,
    getRest(c,b.hips).x + bounce*cfg.hipsX,
    getRest(c,b.hips).y + walk*cfg.hipsY,
    getRest(c,b.hips).z - walk*cfg.hipsZ,
    cfg.upperLerp
  );

  // SPALLE - movimento piccolo e opposto alle braccia
  smoothBoneTo(
    b.leftShoulder,
    getRest(c,b.leftShoulder).x,
    getRest(c,b.leftShoulder).y,
    getRest(c,b.leftShoulder).z + walkOpp*cfg.shoulderZ,
    cfg.upperLerp
  );

  smoothBoneTo(
    b.rightShoulder,
    getRest(c,b.rightShoulder).x,
    getRest(c,b.rightShoulder).y,
    getRest(c,b.rightShoulder).z + walk*cfg.shoulderZ,
    cfg.upperLerp
  );

  // BUSTO - meno traballante
  smoothBoneTo(
    b.spine,
    getRest(c,b.spine).x + cfg.spineBaseX,
    getRest(c,b.spine).y + walk*cfg.spineY,
    getRest(c,b.spine).z + walk*cfg.spineZ,
    cfg.upperLerp
  );

  // COLLO
  smoothBoneTo(
    b.neck,
    getRest(c,b.neck).x + Math.sin(t*2)*cfg.neckX,
    getRest(c,b.neck).y + walk*cfg.neckY,
    getRest(c,b.neck).z - walk*cfg.neckZ,
    cfg.upperLerp
  );

  // TESTA
  smoothBoneTo(
    b.head,
    getRest(c,b.head).x + Math.sin(t*2)*cfg.headX,
    getRest(c,b.head).y + walk*cfg.headY,
    getRest(c,b.head).z + walkOpp*cfg.headZ,
    cfg.upperLerp
  );

  // BRACCIA
  // Swing su asse Z con minimo e massimo separati per braccio.
  const leftArmZAmount = (walkOpp + 1) * 0.5; // 0..1
  const rightArmZAmount = (walk + 1) * 0.5;  // 0..1

  const leftArmZ = THREE.MathUtils.lerp(
    cfg.leftArmZMin,
    cfg.leftArmZMax,
    leftArmZAmount
  );

  const rightArmZ = THREE.MathUtils.lerp(
    cfg.rightArmZMin,
    cfg.rightArmZMax,
    rightArmZAmount
  );

  smoothBoneTo(
    b.leftArm,
    pose.armX + cfg.armBaseX + walkOpp*cfg.armSwingX,
    0,
    leftArmZ,
    cfg.upperLerp
  );

  smoothBoneTo(
    b.rightArm,
    pose.armX + cfg.armBaseX + walk*cfg.armSwingX,
    0,
    rightArmZ,
    cfg.upperLerp
  );

  // GOMITI / AVAMBRACCI
  // Z usa minimo/massimo durante la camminata.
  // Quando il player è fermo, animateIdle usa invece ZBase.
  const leftElbowZAmount = (walkOpp + 1) * 0.5; // 0..1
  const rightElbowZAmount = (walk + 1) * 0.5;   // 0..1

  const leftForeArmZ = THREE.MathUtils.lerp(
    cfg.leftForeArmZMin,
    cfg.leftForeArmZMax,
    leftElbowZAmount
  );

  const rightForeArmZ = THREE.MathUtils.lerp(
    cfg.rightForeArmZMin,
    cfg.rightForeArmZMax,
    rightElbowZAmount
  );

  smoothBoneTo(
    b.leftForeArm,
    pose.foreArmX + cfg.foreArmBaseX + Math.max(0,walk)*cfg.foreArmMoveX,
    0,
    leftForeArmZ,
    cfg.upperLerp
  );

  smoothBoneTo(
    b.rightForeArm,
    pose.foreArmX + cfg.foreArmBaseX + Math.max(0,walkOpp)*cfg.foreArmMoveX,
    0,
    rightForeArmZ,
    cfg.upperLerp
  );

  // MANI
  smoothBoneTo(
    b.leftHand,
    getRest(c,b.leftHand).x,
    getRest(c,b.leftHand).y,
    getRest(c,b.leftHand).z + walkOpp*cfg.handZ,
    cfg.upperLerp
  );

  smoothBoneTo(
    b.rightHand,
    getRest(c,b.rightHand).x,
    getRest(c,b.rightHand).y,
    getRest(c,b.rightHand).z + walk*cfg.handZ,
    cfg.upperLerp
  );

  // COSCE
  smoothBoneTo(
    b.leftUpLeg,
    getRest(c,b.leftUpLeg).x + walk*cfg.upLegSwing - leftSwing*cfg.upLegRecover,
    getRest(c,b.leftUpLeg).y,
    getRest(c,b.leftUpLeg).z,
    cfg.legLerp
  );

  smoothBoneTo(
    b.rightUpLeg,
    getRest(c,b.rightUpLeg).x + walkOpp*cfg.upLegSwing - rightSwing*cfg.upLegRecover,
    getRest(c,b.rightUpLeg).y,
    getRest(c,b.rightUpLeg).z,
    cfg.legLerp
  );

  // GINOCCHIA / POLPACCI
  smoothBoneTo(
    b.leftKnee,
    getRest(c,b.leftKnee).x - leftSwing*cfg.kneeBend,
    getRest(c,b.leftKnee).y,
    getRest(c,b.leftKnee).z,
    cfg.kneeLerp
  );

  smoothBoneTo(
    b.rightKnee,
    getRest(c,b.rightKnee).x - rightSwing*cfg.kneeBend,
    getRest(c,b.rightKnee).y,
    getRest(c,b.rightKnee).z,
    cfg.kneeLerp
  );

  // PIEDI - meno effetto strisciamento
  smoothBoneTo(
    b.leftFoot,
    getRest(c,b.leftFoot).x + leftSwing*cfg.footLift - leftPlant*cfg.footPlantDown,
    getRest(c,b.leftFoot).y,
    getRest(c,b.leftFoot).z,
    cfg.footLerp
  );

  smoothBoneTo(
    b.rightFoot,
    getRest(c,b.rightFoot).x + rightSwing*cfg.footLift - rightPlant*cfg.footPlantDown,
    getRest(c,b.rightFoot).y,
    getRest(c,b.rightFoot).z,
    cfg.footLerp
  );

  // RIMBALZO GLOBALE DEL MODELLO
  if(c.model){
    c.model.position.y=THREE.MathUtils.lerp(
      c.model.position.y,
      bounce*cfg.bodyBounce,
      cfg.bounceLerp
    );

    // Correzione reale: dopo tutte le rotazioni di gambe/piedi,
    // impedisce al modello skinned di scendere sotto il floor.
    keepCharacterAboveFloor(c,cfg.floorSafetyMargin);
  }
}

// ================= ANIMAZIONI DIALOGO NPC =================
function animateTalkSecurity(c){
  const b=getBones(c);
  const t=performance.now()*.0065;
  const s=Math.sin(t);
  const s2=Math.sin(t*1.5);
  const pose=getPose(c);

  /*
    FIX IMPORTANTE:
    non muoviamo più avambracci in modo grande.
    Prima gli avambracci finivano verso anche/linguine.
    Ora le braccia restano nella posa stretta e il dialogo lo fanno:
    testa + busto + mani leggere.
  */

  smoothBoneTo(b.leftArm,pose.armX,0,0,.16);
  smoothBoneTo(b.rightArm,pose.armX,0,0,.16);

  smoothBoneTo(b.leftForeArm,pose.foreArmX,0,0,.16);
  smoothBoneTo(b.rightForeArm,pose.foreArmX,0,0,.16);

  // solo piccoli movimenti delle mani
  smoothBoneTo(b.leftHand,getRest(c,b.leftHand).x,getRest(c,b.leftHand).y+s*.04,getRest(c,b.leftHand).z+s2*.05,.16);
  smoothBoneTo(b.rightHand,getRest(c,b.rightHand).x,getRest(c,b.rightHand).y+s2*.05,getRest(c,b.rightHand).z+s*.07,.16);

  // spalle appena vive, senza aprire braccia
  smoothBoneTo(b.leftShoulder,getRest(c,b.leftShoulder).x,getRest(c,b.leftShoulder).y,getRest(c,b.leftShoulder).z+s*.006,.12);
  smoothBoneTo(b.rightShoulder,getRest(c,b.rightShoulder).x,getRest(c,b.rightShoulder).y,getRest(c,b.rightShoulder).z-s*.006,.12);

  // corpo/testa parlano
  smoothBoneTo(b.hips,getRest(c,b.hips).x,getRest(c,b.hips).y+s*.003,getRest(c,b.hips).z-s*.003,.12);
  smoothBoneTo(b.spine,getRest(c,b.spine).x+.015,getRest(c,b.spine).y,getRest(c,b.spine).z+s*.020,.12);
  smoothBoneTo(b.neck,getRest(c,b.neck).x,getRest(c,b.neck).y+s*.032,getRest(c,b.neck).z,.12);
  smoothBoneTo(b.head,getRest(c,b.head).x+s2*.014,getRest(c,b.head).y+s*.060,getRest(c,b.head).z+s*.018,.12);
}


function animateTalkMusic(c){
  const b=getBones(c);
  const t=performance.now()*.008;
  const s=Math.sin(t);
  const s2=Math.sin(t*.55);
  const pose=getPose(c);

  // Braccia ferme vicino al busto: niente più mani dentro le anche.
  smoothBoneTo(b.leftArm,pose.armX,0,0,.16);
  smoothBoneTo(b.rightArm,pose.armX,0,0,.16);

  smoothBoneTo(b.leftForeArm,pose.foreArmX,0,0,.16);
  smoothBoneTo(b.rightForeArm,pose.foreArmX,0,0,.16);

  // mani leggere, come piccoli gesti
  smoothBoneTo(b.leftHand,getRest(c,b.leftHand).x+s*.03,getRest(c,b.leftHand).y,getRest(c,b.leftHand).z+s*.08,.16);
  smoothBoneTo(b.rightHand,getRest(c,b.rightHand).x+s2*.03,getRest(c,b.rightHand).y,getRest(c,b.rightHand).z+s*.10,.16);

  smoothBoneTo(b.leftShoulder,getRest(c,b.leftShoulder).x,getRest(c,b.leftShoulder).y,getRest(c,b.leftShoulder).z+s*.006,.12);
  smoothBoneTo(b.rightShoulder,getRest(c,b.rightShoulder).x,getRest(c,b.rightShoulder).y,getRest(c,b.rightShoulder).z-s*.006,.12);

  smoothBoneTo(b.hips,getRest(c,b.hips).x,getRest(c,b.hips).y+s*.004,getRest(c,b.hips).z-s*.004,.12);
  smoothBoneTo(b.spine,getRest(c,b.spine).x+.010,getRest(c,b.spine).y,getRest(c,b.spine).z+s*.025,.12);
  smoothBoneTo(b.neck,getRest(c,b.neck).x,getRest(c,b.neck).y+s2*.040,getRest(c,b.neck).z,.12);
  smoothBoneTo(b.head,getRest(c,b.head).x+s*.014,getRest(c,b.head).y+s*.075,getRest(c,b.head).z+s*.035,.12);

  if(c.model){
    c.model.position.y=THREE.MathUtils.lerp(c.model.position.y,Math.abs(s)*.008,.12);
  }
}


function animateTalkChild(c){
  const b=getBones(c);
  const t=performance.now()*.0075;
  const s=Math.sin(t);
  const s2=Math.sin(t*1.7);
  const pose=getPose(c);

  /*
    Questa animazione usa i TUOI valori:

    RIPOSO:
    leftArm  x=1.0795 z=-0.0015
    rightArm x=1.1295 z=0.0246

    BRACCIO ALZATO:
    leftArm  x=0.9295 z=0.7485
    rightArm x=1.1295 z=0.2246

    Movimento:
    - passa dalla posa riposo alla posa braccio alzato
    - poi oscilla un po' con sin()
    - busto e testa ondulano mentre parla
  */

  // talkAmount va circa da 0.15 a 1.0, così non torna mai completamente morto.
  const talkAmount=0.58 + Math.sin(t*.9)*0.22;

  const leftArmX=THREE.MathUtils.lerp(
    pose.leftArmRestX,
    pose.leftArmTalkX,
    talkAmount
  );

  const leftArmZ=THREE.MathUtils.lerp(
    pose.leftArmRestZ,
    pose.leftArmTalkZ,
    talkAmount
  );

  const rightArmX=THREE.MathUtils.lerp(
    pose.rightArmRestX,
    pose.rightArmTalkX,
    talkAmount*.55
  );

  const rightArmZ=THREE.MathUtils.lerp(
    pose.rightArmRestZ,
    pose.rightArmTalkZ,
    talkAmount*.55
  );

  // Braccio sinistro alzato come nella tua seconda posa.
  smoothBoneTo(
    b.leftArm,
    leftArmX + s*.025,
    0,
    leftArmZ + s2*.035,
    .17
  );

  // Braccio destro accompagna meno, ma segue un po'.
  smoothBoneTo(
    b.rightArm,
    rightArmX + s2*.018,
    0,
    rightArmZ + s*.025,
    .17
  );

  // Avambraccio sinistro leggermente vivo.
  smoothBoneTo(
    b.leftForeArm,
    pose.leftForeArmTalkX + s2*.05,
    getRest(c,b.leftForeArm).y,
    getRest(c,b.leftForeArm).z,
    .17
  );

  // Avambraccio destro resta vicino alla tua posa.
  smoothBoneTo(
    b.rightForeArm,
    pose.rightForeArmTalkX + s*.04,
    getRest(c,b.rightForeArm).y,
    getRest(c,b.rightForeArm).z,
    .17
  );

  // Mano destra come nella posa che hai trovato, con piccola oscillazione.
  smoothBoneTo(
    b.rightHand,
    pose.rightHandTalkX + s*.025,
    pose.rightHandTalkY + s2*.045,
    getRest(c,b.rightHand).z + s*.035,
    .17
  );

  // Mano sinistra un po' viva.
  smoothBoneTo(
    b.leftHand,
    getRest(c,b.leftHand).x + s*.025,
    getRest(c,b.leftHand).y + s2*.030,
    getRest(c,b.leftHand).z + s2*.045,
    .17
  );

  // Corpo ondula mentre parla.
  smoothBoneTo(
    b.hips,
    getRest(c,b.hips).x+s*.002,
    getRest(c,b.hips).y+s*.004,
    getRest(c,b.hips).z-s*.004,
    .12
  );

  smoothBoneTo(
    b.spine,
    getRest(c,b.spine).x+s*.012,
    getRest(c,b.spine).y,
    getRest(c,b.spine).z+s*.026,
    .12
  );

  smoothBoneTo(
    b.neck,
    getRest(c,b.neck).x+s2*.006,
    getRest(c,b.neck).y+s*.040,
    getRest(c,b.neck).z,
    .12
  );

  smoothBoneTo(
    b.head,
    getRest(c,b.head).x+s*.020,
    getRest(c,b.head).y+s*.085,
    getRest(c,b.head).z+s2*.018,
    .12
  );

  if(c.model){
    c.model.position.y=THREE.MathUtils.lerp(c.model.position.y,Math.abs(s)*.010,.12);
  }
}


function animateTalk(c){
  animateConfiguredTalk(c);
}

// ================= MOVIMENTO PLAYER =================
let playerMoving=false;

function updatePlayer(){
  if(!player.ready) return;

  const speed=player.speed || .08;

  let moveX=0;
  let moveZ=0;

  if(keys["w"]) moveZ-=1;
  if(keys["s"]) moveZ+=1;
  if(keys["a"]) moveX-=1;
  if(keys["d"]) moveX+=1;

  playerMoving=(moveX!==0 || moveZ!==0);

  if(playerMoving){
    const len=Math.hypot(moveX,moveZ);
    moveX/=len;
    moveZ/=len;

    player.root.position.x+=moveX*speed;
    player.root.position.z+=moveZ*speed;

    // Corretto: niente +Math.PI.
    // Prima quando andavi a destra guardava a sinistra.
    const targetRotation=Math.atan2(moveX,moveZ);
    player.root.rotation.y=lerpAngle(player.root.rotation.y,targetRotation,.20);
  }

  // Limiti scena esterna: strada + due locali grandi.
  // Prima questi limiti erano troppo stretti (-10.5 su Z),
  // quindi nella stanza di toxicMan/child sembrava esserci una collisione invisibile.
  // Ora puoi entrare fino in fondo nelle due camere.
  player.root.position.x=THREE.MathUtils.clamp(player.root.position.x,-34.5,34.5);
  player.root.position.z=THREE.MathUtils.clamp(player.root.position.z,-38.4,21.5);

  if(playerMoving) animatePlayerWalk(player);
  else animateIdle(player);
}

// ================= INTERAZIONE NPC =================
let currentTarget=null;
let lastE=false;

function distance(a,b){
  return a.root.position.distanceTo(b.root.position);
}

function updateInteraction(){
  currentTarget=null;

  let best=null;
  let bestDist=999;

  for(const npc of npcs){
    if(!npc.ready) continue;

    const d=distance(player,npc);
    if(d<4.3 && d<bestDist){
      best=npc;
      bestDist=d;
    }
  }

  currentTarget=best;

  const eDown=!!keys["e"];

  if(eDown && !lastE && currentTarget){
    currentTarget.state="talk";
    currentTarget.timer=0;
    showDialogue(currentTarget.dialogue);
  }

  lastE=eDown;
}

function updateNPC(npc){
  if(!npc.ready) return;

  if(npc.state==="talk"){
    npc.timer++;

    const targetRotation=angleToTarget(npc.root,player.root);
    npc.root.rotation.y=lerpAngle(npc.root.rotation.y,targetRotation,.12);

    animateTalk(npc);

    if(npc.timer>260){
      npc.state="idle";
      hideDialogue();
    }

    return;
  }

  // Dopo l'interazione l'NPC resta orientato dove si trova:
  // non torna più alla rotazione iniziale.
  animateIdle(npc);
}


// ================= CAMERA DINAMICA STANZE =================
// Quando il player entra in una stanza la camera si avvicina con transizione.
// Dopo che il player ha camminato un po' dentro la stanza, torna alla vista normale.
const CAMERA_CONFIG={
  normal:{
    offsetX:0,
    offsetY:3.8,
    offsetZ:8.8,
    lookY:1.8,
    lerp:0.10
  },

  roomClose:{
    offsetX:0,
    offsetY:2.75,
    offsetZ:4.7,
    lookY:1.55,
    lerp:0.075
  },

  // Dopo questi metri camminati dentro la stanza, la camera torna normale.
  closeCameraWalkDistance:3.6,

  insideZMax:SCENE_ENV_CONFIG.frontZ-0.35,
  insideZMin:SCENE_ENV_CONFIG.backZ+1.0,
  leftRoomXMin:SCENE_ENV_CONFIG.leftRoomCenterX-SCENE_ENV_CONFIG.roomWidth/2+1.0,
  leftRoomXMax:SCENE_ENV_CONFIG.leftRoomCenterX+SCENE_ENV_CONFIG.roomWidth/2-1.0,
  rightRoomXMin:SCENE_ENV_CONFIG.rightRoomCenterX-SCENE_ENV_CONFIG.roomWidth/2+1.0,
  rightRoomXMax:SCENE_ENV_CONFIG.rightRoomCenterX+SCENE_ENV_CONFIG.roomWidth/2-1.0
};

let wasInsideRoom=false;
let roomCameraActive=false;
let roomCameraEntryPos=new THREE.Vector3();

function isPlayerInsideRoom(){
  if(!player || !player.root) return false;

  const x=player.root.position.x;
  const z=player.root.position.z;

  const insideZ = z < CAMERA_CONFIG.insideZMax && z > CAMERA_CONFIG.insideZMin;
  const insideLeft = x > CAMERA_CONFIG.leftRoomXMin && x < CAMERA_CONFIG.leftRoomXMax;
  const insideRight = x > CAMERA_CONFIG.rightRoomXMin && x < CAMERA_CONFIG.rightRoomXMax;

  return insideZ && (insideLeft || insideRight);
}

function updateRoomCameraState(){
  const inside=isPlayerInsideRoom();

  // Appena entri nella stanza: attiva camera ravvicinata.
  if(inside && !wasInsideRoom){
    roomCameraActive=true;
    roomCameraEntryPos.copy(player.root.position);
  }

  // Se sei dentro e hai camminato abbastanza, torna alla camera normale.
  if(inside && roomCameraActive){
    const walked=player.root.position.distanceTo(roomCameraEntryPos);
    if(walked >= CAMERA_CONFIG.closeCameraWalkDistance){
      roomCameraActive=false;
    }
  }

  // Uscendo dalla stanza resetta lo stato; al prossimo ingresso si riattiva.
  if(!inside){
    roomCameraActive=false;
  }

  wasInsideRoom=inside;
}

function updateDynamicCamera(){
  updateRoomCameraState();

  const mode=roomCameraActive ? CAMERA_CONFIG.roomClose : CAMERA_CONFIG.normal;

  const camTarget=new THREE.Vector3(
    player.root.position.x + mode.offsetX,
    player.root.position.y + mode.offsetY,
    player.root.position.z + mode.offsetZ
  );

  camera.position.lerp(camTarget,mode.lerp);
  camera.lookAt(
    player.root.position.x,
    player.root.position.y + mode.lookY,
    player.root.position.z
  );
}

// ================= LOOP =================
function animate(){
  requestAnimationFrame(animate);

  updatePlayer();
  updateSlidingDoors();
  updateInteraction();

  for(const npc of npcs){
    updateNPC(npc);
  }

  updateDynamicCamera();

  ui.textContent=currentTarget
    ? "WASD = muovi | E = parla con " + currentTarget.name
    : "WASD = muovi | avvicinati a un NPC | E = parla";

  renderer.render(scene,camera);
}

animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
