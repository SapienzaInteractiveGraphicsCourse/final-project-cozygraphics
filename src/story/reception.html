<div id="receptionExchangePanel">
<div id="receptionExchangeTitle">CASH EXCHANGE</div>
<div id="receptionExchangeText">Choose how many dollars you want to exchange into cents.</div>
<div id="receptionExchangeChoices">
<button class="rexBtn rexChoice selected" data-rex="1">$1 → 100¢</button>
<button class="rexBtn rexChoice" data-rex="2">$2 → 200¢</button>
<button class="rexBtn rexChoice" data-rex="5">$5 → 500¢</button>
<button class="rexBtn rexChoice" data-rex="10">$10 → 1000¢</button>
</div>
<div id="receptionExchangeActions">
<button class="rexBtn" id="receptionExchangeClose">CANCEL</button>
<button class="rexBtn rexContinue" id="receptionExchangeContinue">CONTINUE</button>
</div>
</div>
