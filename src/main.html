  for(let i=0;i<count;i++){

    positions.push(Math.cos(theta)*radius,y,Math.sin(theta)*radius);

  const material=new THREE.PointsMaterial({
    color:0xffffff,
    size:.72,
    sizeAttenuation:true,
    transparent:true,
    opacity:.88,
    depthWrite:false
  });
  const stars=new THREE.Points(geometry,material);
  stars.name='night_star_field';
  scene.add(stars);
  return stars;
}

// ================= SCENA ESTERNA / LOCALI =================
// Scena esterna con due locali MOLTO più grandi.

// Mezza larghezza dei locali, dichiarata subito dopo la configurazione

function makeBox(name,w,h,d,x,y,z,color){

// ================= TEXTURE OUTSIDE =================
// Metti questi file nella stessa cartella di questo HTML:
// - asp.jpg       -> asfalto
// - concrete.jpg  -> marciapiede / zona davanti ai locali
// - grass.jpg     -> erba lontana / zone non raggiungibili
const textureLoader=new THREE.TextureLoader();

function makeTiledTexture(path,repeatX,repeatY){
  const tex=textureLoader.load(path);
  tex.wrapS=THREE.RepeatWrapping;
  tex.wrapT=THREE.RepeatWrapping;
  tex.repeat.set(repeatX,repeatY);
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return tex;
}

const asphaltMat=new THREE.MeshStandardMaterial({
  map:makeTiledTexture("../assets/textures/asp.jpg",700,14),
  roughness:.92,
  metalness:0
});

const concreteMat=new THREE.MeshStandardMaterial({
  map:makeTiledTexture("../assets/textures/concrete.jpg",650,5),
  roughness:.86,
  metalness:0
});

const beachTexture=makeTiledTexture("../assets/textures/beach.png",24,18);
const grassMat=new THREE.MeshStandardMaterial({
  map:beachTexture,
  color:0xffffff,
  roughness:1.0,
  metalness:0
});

function makeTexturedPlane(name,w,d,x,y,z,material){

// ================= STRADA E MARCIAPIEDI A U =================
// Geometria ripulita:
// - U meno curva e più squadrata;
// - marciapiede vicino ai locali più stretto;
// - marciapiede esterno più largo;
// - entrambi usano lo stesso identico materiale concrete.jpg;
// - UV basate sulle coordinate del mondo, per evitare cambi di pattern;
// - riempimento continuo davanti e ai lati dei locali, senza buchi.

const roadGreyMat=new THREE.MeshStandardMaterial({
  map:makeTiledTexture("../assets/textures/asp.jpg",1,1),
  roughness:.95,
  metalness:0,
  side:THREE.DoubleSide
});

// Un solo materiale condiviso da TUTTI i marciapiedi.
// Texture concreta condivisa da fronte, curve e tratti laterali.
if (typeof sidewalkConcreteTex !== 'undefined') {
  sidewalkConcreteTex.wrapS=THREE.RepeatWrapping;
  sidewalkConcreteTex.wrapT=THREE.RepeatWrapping;
  sidewalkConcreteTex.repeat.set(1,1);
  sidewalkConcreteTex.needsUpdate=true;
}
const unifiedSidewalkMat=new THREE.MeshStandardMaterial({
  map:makeTiledTexture("../assets/textures/concrete.jpg",1,1),
  roughness:.86,
  metalness:0,
  side:THREE.DoubleSide
});

function applyWorldPlanarUV(geometry,tileSize=5){
  const pos=geometry.attributes.position;
  const uv=[];
  for(let i=0;i<pos.count;i++){
    // X/Z del mondo locale: stessa scala e stesso orientamento su ogni pezzo.
    uv.push(pos.getX(i)/tileSize,pos.getZ(i)/tileSize);
  }
  geometry.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
}

// Fascia lungo una curva con UV continue basate sulle coordinate X/Z.
function makeStripAlongCurve(name,curve,offsetA,offsetB,y,material,segments=320,tileSize=5){
  const positions=[];
  const uvs=[];
  const indices=[];

  for(let i=0;i<=segments;i++){
    const t=i/segments;
    const p=curve.getPoint(t);
    const tangent=curve.getTangent(t).normalize();
    const nx=-tangent.z;
    const nz=tangent.x;

    const ax=p.x+nx*offsetA;
    const az=p.z+nz*offsetA;
    const bx=p.x+nx*offsetB;
    const bz=p.z+nz*offsetB;

    positions.push(ax,y,az,bx,y,bz);
    uvs.push(ax/tileSize,az/tileSize,bx/tileSize,bz/tileSize);

    if(i<segments){
      const a=i*2,b=a+1,c=a+2,d=a+3;
      indices.push(a,c,b,c,d,b);
    }
  }

  const geometry=new THREE.BufferGeometry();
  geometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
  geometry.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();

  const mesh=new THREE.Mesh(geometry,material);
  mesh.name=name;
  mesh.receiveShadow=true;
  scene.add(mesh);
  return mesh;
}

// U con curva ampia e geometria stabile.
// Il raggio è maggiore della fascia completa strada + marciapiede esterno,
// così nessun bordo parallelo si incrocia o forma accumuli negli angoli.
const U_X=88;
const U_FRONT_Z=35;
const U_BACK_Z=-330;
// Raggio più ampio: anche il bordo interno della carreggiata
// mantiene una curva larga, senza effetto di restringimento.
const U_RADIUS=30;
const U_ARC_K=.5522847498;

const uRoadCurve=new THREE.CurvePath();

// Ramo sinistro rettilineo.
uRoadCurve.add(new THREE.LineCurve3(
  new THREE.Vector3(-U_X,0,U_BACK_Z),
  new THREE.Vector3(-U_X,0,U_FRONT_Z-U_RADIUS)
));

// Curva sinistra a quarto di cerchio, ampia e regolare.
uRoadCurve.add(new THREE.CubicBezierCurve3(
  new THREE.Vector3(-U_X,0,U_FRONT_Z-U_RADIUS),
  new THREE.Vector3(-U_X,0,U_FRONT_Z-U_RADIUS+U_RADIUS*U_ARC_K),
  new THREE.Vector3(-U_X+U_RADIUS-U_RADIUS*U_ARC_K,0,U_FRONT_Z),
  new THREE.Vector3(-U_X+U_RADIUS,0,U_FRONT_Z)
));

// Fronte rettilineo davanti ai locali.
uRoadCurve.add(new THREE.LineCurve3(
  new THREE.Vector3(-U_X+U_RADIUS,0,U_FRONT_Z),
  new THREE.Vector3(U_X-U_RADIUS,0,U_FRONT_Z)
));

// Curva destra a quarto di cerchio.
uRoadCurve.add(new THREE.CubicBezierCurve3(
  new THREE.Vector3(U_X-U_RADIUS,0,U_FRONT_Z),
  new THREE.Vector3(U_X-U_RADIUS+U_RADIUS*U_ARC_K,0,U_FRONT_Z),
  new THREE.Vector3(U_X,0,U_FRONT_Z-U_RADIUS+U_RADIUS*U_ARC_K),
  new THREE.Vector3(U_X,0,U_FRONT_Z-U_RADIUS)
));

// Ramo destro rettilineo.
uRoadCurve.add(new THREE.LineCurve3(
  new THREE.Vector3(U_X,0,U_FRONT_Z-U_RADIUS),
  new THREE.Vector3(U_X,0,U_BACK_Z)
));

// Due corsie più larghe, costruite separatamente ma con la stessa identica larghezza.
// In questo modo nessuna corsia appare più stretta nelle curve.
const roadLaneShopSide=makeStripAlongCurve(
  'u_road_lane_shop_side_equal_width',
  uRoadCurve,
  -11,
  0,
  .035,
  roadGreyMat,
  560,
  5
);

const roadLaneGardenSide=makeStripAlongCurve(
  'u_road_lane_garden_side_equal_width',
  uRoadCurve,
  0,
  11,
  .035,
  roadGreyMat,
  560,
  5
);

// Riferimento compatibile con il resto del file.
const centralRoad=roadLaneShopSide;

// Marciapiede interno continuo e più spesso: fronte, curve e due rami laterali.
// Parte esattamente dal nuovo bordo della carreggiata (-15) e si allarga solo verso i locali,
// quindi non crea nessuna striscia sopra l'asfalto.
const shopSidewalk=makeStripAlongCurve(
  'u_shop_sidewalk_concrete_continuous_thick',
  uRoadCurve,
  -11,
  -19,
  .058,
  unifiedSidewalkMat,
  560,
  5
);

// Marciapiede esterno più grande: 18 unità.
const gardenSidewalk=makeStripAlongCurve(
  'u_garden_sidewalk_concrete_continuous',
  uRoadCurve,
  11,
  24,
  .025,
  unifiedSidewalkMat,
  560,
  5
);

// Bordi piatti e continui: evitano torsioni e rigonfiamenti nelle curve.
const curbMat=new THREE.MeshStandardMaterial({color:0x8d8d88,roughness:.9,side:THREE.DoubleSide});
function makeFlatCurveBorder(name,curve,offset,y,width,material,segments=640){
  return makeStripAlongCurve(
    name,
    curve,
    offset-width*.5,
    offset+width*.5,
    y,
    material,
    segments,
    5
  );
}
makeFlatCurveBorder('u_road_shop_curb_clean',uRoadCurve,-11,.072,.18,curbMat);
makeFlatCurveBorder('u_road_garden_curb_clean',uRoadCurve,11,.072,.18,curbMat);

// Linee bianche continue sui due bordi esterni della carreggiata.
const roadOuterLineMat=new THREE.MeshStandardMaterial({
  color:0xf4f1df,roughness:.82,metalness:0,side:THREE.DoubleSide
});
makeFlatCurveBorder('u_road_shop_outer_continuous_line',uRoadCurve,-10.55,.079,.22,roadOuterLineMat,760);
makeFlatCurveBorder('u_road_beach_outer_continuous_line',uRoadCurve,10.55,.079,.22,roadOuterLineMat,760);

// Muretto continuo tra marciapiede esterno e spiaggia.
// È costruito come un'unica geometria per ciascun lato dell'ingresso:
// niente box separati, microfessure o segmenti neri nelle curve.
function makeContinuousCurveWallSegment(name,curve,offset,width,height,tStart,tEnd,segments=420){
  const positions=[];
  const indices=[];
  const half=width*.5;

  for(let i=0;i<=segments;i++){
    const t=THREE.MathUtils.lerp(tStart,tEnd,i/segments);
    const p=curve.getPoint(t);
    const tangent=curve.getTangent(t).normalize();
    const nx=-tangent.z;
    const nz=tangent.x;
    const innerX=p.x+nx*(offset-half);
    const innerZ=p.z+nz*(offset-half);
    const outerX=p.x+nx*(offset+half);
    const outerZ=p.z+nz*(offset+half);

    positions.push(
      innerX,.055,innerZ,
      outerX,.055,outerZ,
      innerX,height+.055,innerZ,
      outerX,height+.055,outerZ
    );

    if(i<segments){
      const a=i*4,b=a+1,c=a+2,d=a+3;
      const na=a+4,nb=b+4,nc=c+4,nd=d+4;
      indices.push(
        c,nc,d, nc,nd,d,       // cima
        a,b,na, na,b,nb,       // fondo
        a,na,c, na,nc,c,       // lato interno
        b,d,nb, nb,d,nd        // lato esterno
      );
    }
  }

  const geometry=new THREE.BufferGeometry();
  geometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  const material=new THREE.MeshStandardMaterial({color:0x777b82,roughness:.88});
  const mesh=new THREE.Mesh(geometry,material);
  mesh.name=name;
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  scene.add(mesh);
  return mesh;
}

const BEACH_ENTRY_CENTER=.50;
const BEACH_ENTRY_HALF=.033;
makeContinuousCurveWallSegment(
  'beach_wall_continuous_left',uRoadCurve,24.35,.58,1.18,
  0,BEACH_ENTRY_CENTER-BEACH_ENTRY_HALF,430
);
makeContinuousCurveWallSegment(
  'beach_wall_continuous_right',uRoadCurve,24.35,.58,1.18,
  BEACH_ENTRY_CENTER+BEACH_ENTRY_HALF,1,430
);

// Fascia di sabbia continua sotto e oltre il bordo del marciapiede.
// Copre il raccordo e impedisce che si veda il fondo nero tra cemento e spiaggia.
const beachTransitionMat=new THREE.MeshStandardMaterial({
  map:beachTexture,
  color:0xffffff,
  roughness:1,
  metalness:0,
  side:THREE.DoubleSide
});
makeStripAlongCurve(
  'continuous_beach_sidewalk_transition',uRoadCurve,24.05,24.78,.032,
  beachTransitionMat,900,4.2
);
// Nessun grosso cornicione sul bordo esterno: resta pulito il solo stacco strada/marciapiede.

// Piano con UV mondiali: tutti i riempimenti condividono lo stesso pattern.
function makeWorldUVConcretePlane(name,w,d,x,y,z){
  const geometry=new THREE.PlaneGeometry(w,d);
  geometry.rotateX(-Math.PI/2);

  const pos=geometry.attributes.position;
  const uv=[];
  for(let i=0;i<pos.count;i++){
    uv.push(
      (pos.getX(i)+x)/5,
      (pos.getZ(i)+z)/5
    );
  }
  geometry.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));

  const mesh=new THREE.Mesh(geometry,unifiedSidewalkMat);
  mesh.name=name;
  mesh.position.set(x,y,z);
  mesh.receiveShadow=true;
  scene.add(mesh);
  return mesh;
}

// Bordo interno del marciapiede frontale:
// Bordo interno riallineato al marciapiede laterale più stretto.
const INNER_SIDEWALK_FRONT_Z=16;

// Riempimento unico davanti ai locali, senza interruzioni.
// Copre anche gli spazi tra i tre edifici.
makeWorldUVConcretePlane(
  'continuous_front_sidewalk_no_holes',
  SCENE_ENV_CONFIG.buildingWidth,
  INNER_SIDEWALK_FRONT_Z-SCENE_ENV_CONFIG.frontZ,
  0,
  .055,
  (SCENE_ENV_CONFIG.frontZ+INNER_SIDEWALK_FRONT_Z)/2
);

// Raccordi laterali frontali mirati.
// Non riempiamo più tutta la U: questo evita sovrapposizioni,
// parti prive di texture e incongruenze nelle curve.
const roomOuterX=
  SCENE_ENV_CONFIG.thirdRoomCenterX+
  SCENE_ENV_CONFIG.roomWidth/2;

const innerSidewalkX=U_X-U_RADIUS-.5;
const connectorWidth=innerSidewalkX-roomOuterX;
const connectorCenter=(innerSidewalkX+roomOuterX)/2;
const connectorDepth=INNER_SIDEWALK_FRONT_Z-SCENE_ENV_CONFIG.frontZ;
const connectorCenterZ=(SCENE_ENV_CONFIG.frontZ+INNER_SIDEWALK_FRONT_Z)/2;

// I raccordi terminano esattamente all'inizio delle curve e condividono
// quota, materiale e UV con il marciapiede: niente invasione della strada o viola.
makeWorldUVConcretePlane(
  'left_front_sidewalk_connector_textured',
  connectorWidth,
  connectorDepth,
  -connectorCenter,
  .055,
  connectorCenterZ
);
makeWorldUVConcretePlane(
  'right_front_sidewalk_connector_textured',

function createWaterNormalTexture(size=256){
  const canvas=document.createElement('canvas');
  canvas.width=size;
  canvas.height=size;
  const ctx=canvas.getContext('2d');
  const image=ctx.createImageData(size,size);
  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){
      const wave=Math.sin(x*.18)+Math.sin((x+y)*.095)+Math.cos(y*.14);
      const i=(y*size+x)*4;
      image.data[i]=118+wave*7;
      image.data[i+1]=128+wave*5;
      image.data[i+2]=238;
      image.data[i+3]=255;
    }
  }
  ctx.putImageData(image,0,0);
  const tex=new THREE.CanvasTexture(canvas);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.repeat.set(18,24);
  return tex;
}

function makeCurvedRoadDash(name,curve,tStart,tEnd,width=.34,y=.061,segments=9){
  const positions=[];
  const uvs=[];
  const indices=[];

  for(let i=0;i<=segments;i++){
    const t=THREE.MathUtils.lerp(tStart,tEnd,i/segments);
    const p=curve.getPoint(t);
    const tangent=curve.getTangent(t).normalize();
    const nx=-tangent.z;
    const nz=tangent.x;

    positions.push(
      p.x+nx*width*.5,y,p.z+nz*width*.5,
      p.x-nx*width*.5,y,p.z-nz*width*.5
    );

    const u=i/segments;
    uvs.push(u,0,u,1);

    if(i<segments){
      const a=i*2,b=a+1,c=a+2,d=a+3;
      indices.push(a,c,b,c,d,b);
    }
  }

  const geometry=new THREE.BufferGeometry();
  geometry.setAttribute("position",new THREE.Float32BufferAttribute(positions,3));
  geometry.setAttribute("uv",new THREE.Float32BufferAttribute(uvs,2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();

  const mesh=new THREE.Mesh(geometry,roadMarkingMat);
  mesh.name=name;
  mesh.receiveShadow=true;
  scene.add(mesh);
  return mesh;
}

function createEdgeWornCrosswalkMaterial(seed){
  const canvas=document.createElement("canvas");
  canvas.width=512;
  canvas.height=64;

  const ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Vernice bianca.
  ctx.fillStyle="rgba(255,255,255,1)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  let state=(seed*9301+49297)%233280;
  const random=()=>{
    state=(state*9301+49297)%233280;
    return state/233280;
  };

  ctx.globalCompositeOperation="destination-out";

  function irregularPatch(cx,cy,length,height,opacity,points=8){
    ctx.beginPath();

    const halfL=length*.5;
    const halfH=height*.5;

    const top=[];
    const bottom=[];

    for(let i=0;i<=points;i++){
      const t=i/points;
      const x=cx-halfL+t*length;
      const wobble=(random()-.5)*height*.55;
      top.push([x,cy-halfH+wobble]);
    }

    for(let i=points;i>=0;i--){
      const t=i/points;
      const x=cx-halfL+t*length;
      const wobble=(random()-.5)*height*.55;
      bottom.push([x,cy+halfH+wobble]);
    }

    const pts=top.concat(bottom);
    ctx.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<pts.length;i++){
      ctx.lineTo(pts[i][0],pts[i][1]);
    }
    ctx.closePath();

    ctx.fillStyle=`rgba(0,0,0,${opacity})`;
    ctx.fill();
  }

  // Usura più sottile e meno frequente, soprattutto sui bordi.
  for(let side=0;side<2;side++){
    for(let i=0;i<10;i++){
      const nearLeft=side===0;
      const x=nearLeft
        ? 4+random()*76
        : canvas.width-80+random()*76;

      const y=4+random()*(canvas.height-8);
      const length=12+random()*42;
      const height=1.5+random()*4.5;
      const opacity=.10+random()*.22;

      irregularPatch(x,y,length,height,opacity,7+Math.floor(random()*4));
    }
  }

  // Pochissimi segni anche al centro.
  for(let i=0;i<4;i++){
    const x=canvas.width*.30+random()*canvas.width*.40;
    const y=5+random()*(canvas.height-10);
    const length=10+random()*30;
    const height=1.2+random()*3.2;
    const opacity=.06+random()*.12;

    irregularPatch(x,y,length,height,opacity,7+Math.floor(random()*3));
  }

  // Graffi fini e allungati, non ovali.
  for(let i=0;i<8;i++){
    const edge=random()<.78;
    let x;

    if(edge){
      x=random()<.5
        ? random()*95
        : canvas.width-95+random()*95;
    }else{
      x=canvas.width*.34+random()*canvas.width*.32;
    }

    const y=random()*canvas.height;
    const length=9+random()*34;
    const height=.35+random()*.85;
    const opacity=.07+random()*.13;

    irregularPatch(x,y,length,height,opacity,6+Math.floor(random()*3));
  }

  ctx.globalCompositeOperation="source-over";

  const texture=new THREE.CanvasTexture(canvas);
  texture.colorSpace=THREE.SRGBColorSpace;
  texture.wrapS=THREE.ClampToEdgeWrapping;
  texture.wrapT=THREE.ClampToEdgeWrapping;
  texture.magFilter=THREE.LinearFilter;
  texture.minFilter=THREE.LinearMipmapLinearFilter;
  texture.needsUpdate=true;

  return new THREE.MeshStandardMaterial({
    color:0xffffff,
    map:texture,
    transparent:true,
    opacity:1,
    alphaTest:.018,
    depthWrite:true,
    roughness:.88,
    metalness:0
  });
}

function roundedRectShape(width,height,radius){
  const w=width, h=height;
  const r=Math.min(radius,w*.5,h*.5);
  const s=new THREE.Shape();
  s.moveTo(-w*.5+r,-h*.5);
  s.lineTo(w*.5-r,-h*.5);
  s.quadraticCurveTo(w*.5,-h*.5,w*.5,-h*.5+r);
  s.lineTo(w*.5,h*.5-r);
  s.quadraticCurveTo(w*.5,h*.5,w*.5-r,h*.5);
  s.lineTo(-w*.5+r,h*.5);
  s.quadraticCurveTo(-w*.5,h*.5,-w*.5,h*.5-r);
  s.lineTo(-w*.5,-h*.5+r);
  s.quadraticCurveTo(-w*.5,-h*.5,-w*.5+r,-h*.5);
  return s;
}

function makeRoundedPanel(name,w,h,depth,radius,x,y,z,material){
  const geometry=new THREE.ExtrudeGeometry(
    roundedRectShape(w,h,radius),
    {depth,bevelEnabled:false,curveSegments:14}
  );
  geometry.translate(0,0,-depth*.5);
  geometry.computeVertexNormals();
  const mesh=new THREE.Mesh(geometry,material);
  mesh.name=name;
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  scene.add(mesh);
  return mesh;
}

function makeRoundedFrame(name,w,h,depth,radius,frame,x,y,z,material){
  const outer=roundedRectShape(w,h,radius);
  const inner=roundedRectShape(w-frame*2,h-frame*2,Math.max(.08,radius-frame));
  inner.getPoints().reverse();
  outer.holes.push(inner);
  const geometry=new THREE.ExtrudeGeometry(
    outer,
    {depth,bevelEnabled:true,bevelThickness:.035,bevelSize:.035,bevelSegments:2,curveSegments:14}
  );
  geometry.translate(0,0,-depth*.5);
  geometry.computeVertexNormals();
  const mesh=new THREE.Mesh(geometry,material);
  mesh.name=name;
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  scene.add(mesh);
  return mesh;
}

function makeFacadeCrack(name,x,y,z,segments,scale=1){
  const points=[];

    px+=(i%2===0?.11:-.07)*scale;
    py-=.16*scale;

  const curve=new THREE.CatmullRomCurve3(points);
  const mesh=new THREE.Mesh(
    new THREE.TubeGeometry(curve,Math.max(8,segments*3),.014*scale,5,false),

// ================= PORTE GLB DEFINITIVE =================
// Porte GLB centrate: larghezza uguale al foro e altezza solo leggermente superiore.
// I modelli GLB sostituiscono completamente le vecchie porte procedurali.
// Non vengono creati pannelli, telai, binari, soglie o maniglie in Three.js.
function loadArchitecturalDoorGLB({name,path,centerX,z,targetWidth,targetHeight}){
  loader.load(
    path,
    (gltf)=>{
      const model=gltf.scene;
      model.name=name;

      model.traverse((node)=>{
        if(!node.isMesh) return;
        node.castShadow=true;
        node.receiveShadow=true;

        // Materiali separati per evitare che modifiche esterne si propaghino
        // ad altri modelli che condividono lo stesso materiale.
        if(Array.isArray(node.material)){
          node.material=node.material.map((material)=>material.clone());
        }else if(node.material){
          node.material=node.material.clone();
        }
      });

      model.updateMatrixWorld(true);
      const initialBox=new THREE.Box3().setFromObject(model);
      const initialSize=initialBox.getSize(new THREE.Vector3());

      if(initialSize.y<=0){
        console.warn(`Dimensioni non valide per ${name}`,initialSize);
        return;
      }

      // La porta coincide con la larghezza del foro ed è solo leggermente più alta.
      // La profondità segue la scala verticale per non diventare troppo spessa.
      const scaleX=targetWidth/initialSize.x;
      const scaleY=targetHeight/initialSize.y;
      model.scale.set(scaleX,scaleY,scaleY);
      model.updateMatrixWorld(true);

      // Centra esattamente il modello nell'apertura e appoggialo a terra.
      const scaledBox=new THREE.Box3().setFromObject(model);
      const scaledCenter=scaledBox.getCenter(new THREE.Vector3());
      model.position.x+=centerX-scaledCenter.x;
      model.position.y+=-scaledBox.min.y;
      model.position.z+=z-scaledCenter.z;
      model.updateMatrixWorld(true);

      scene.add(model);
    },
    undefined,
    (error)=>console.error(`Errore caricamento ${path}`,error)
  );
}

const TOXIC_FACING_STATE=new WeakMap();

function getToxicFacingState(toxic){
  let state=TOXIC_FACING_STATE.get(toxic);
  if(state) return state;

  state={
    modelForwardOffset:null
  };

  TOXIC_FACING_STATE.set(toxic,state);
  return state;
}

function calibrateToxicForwardOffset(toxic){
  const state=getToxicFacingState(toxic);
  if(state.modelForwardOffset!==null) return state.modelForwardOffset;

  // Nessuna compensazione artificiale:
  // la root del ToxicMan usa già la stessa direzione geometrica degli altri NPC.
  state.modelForwardOffset=0;
  return state.modelForwardOffset;
}

function faceToxicTowardWorldPosition(toxic,targetPosition,lerp=.14){
  if(!toxic || !toxic.root || !targetPosition) return;

  const dx=targetPosition.x-toxic.root.position.x;
  const dz=targetPosition.z-toxic.root.position.z;
  const geometricAngle=Math.atan2(dx,dz);
  const offset=calibrateToxicForwardOffset(toxic);
  const target=geometricAngle+offset;

  toxic.root.rotation.y=lerpAngle(toxic.root.rotation.y,target,lerp);
}

function updateToxicHeadFacingPlayer(toxic){
  if(!toxic || !toxic.ready || !player || !player.root) return;
  if(toxic.state!=="talk") return;

  const b=getBones(toxic);
  const head=b.head;
  const neck=b.neck;

  if(!head && !neck) return;

  const dx=player.root.position.x-toxic.root.position.x;
  const dz=player.root.position.z-toxic.root.position.z;

  const worldAngle=Math.atan2(dx,dz);
  const localAngle=normalizeAngle(worldAngle-toxic.root.rotation.y);
  const yaw=Math.max(-0.22,Math.min(0.22,localAngle));

  if(neck){
    const rest=getRest(toxic,neck);
    smoothBoneTo(
      neck,
      rest.x+.004,
      rest.y+yaw*.14,
      rest.z-.004,
      .075
    );
  }

  if(head){
    const rest=getRest(toxic,head);
    smoothBoneTo(
      head,
      rest.x+.010,
      rest.y+yaw*.24,
      rest.z-.008,
      .08
    );
  }
}

// ================= FUNZIONI UTILI =================
function fitModelToHeight(model,targetHeight=1.7){
  model.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(model);
  const size=box.getSize(new THREE.Vector3());

  if(size.y<=0){
    console.warn("Altezza modello non valida",size);
    return;
  }

  const scale=targetHeight/size.y;
  model.scale.multiplyScalar(scale);
  model.updateMatrixWorld(true);
}

function putModelOnFloor(model,y=0){
  model.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(model);
  model.position.y += y - box.min.y;
  model.updateMatrixWorld(true);
}

function keepCharacterAboveFloor(c,margin=0.035){
  if(!c || !c.model) return;

  c.model.updateMatrixWorld(true);

  // Box del modello + controllo diretto delle ossa dei piedi.
  // Con gli SkinnedMesh a volte il Box3 non vede bene la deformazione animata,
  // quindi controlliamo anche leftFoot/rightFoot in world position.
  const box=new THREE.Box3().setFromObject(c.model);
  let minY=box.min.y;

  const b=getBones(c);
  const footPos=new THREE.Vector3();

  if(b.leftFoot){
    b.leftFoot.getWorldPosition(footPos);
    minY=Math.min(minY,footPos.y);
  }

  if(b.rightFoot){
    b.rightFoot.getWorldPosition(footPos);
    minY=Math.min(minY,footPos.y);
  }

  if(minY < margin){
    c.model.position.y += margin - minY;
    c.model.updateMatrixWorld(true);
  }
}

function centerModelXZ(model){
  model.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(model);
  const center=box.getCenter(new THREE.Vector3());

  model.position.x -= center.x;
  model.position.z -= center.z;
  model.updateMatrixWorld(true);
}

function printHierarchy(obj,depth=0){
  const pad="  ".repeat(depth);
  const info=[];

  if(obj.isMesh) info.push("Mesh");
  if(obj.isSkinnedMesh) info.push("SkinnedMesh");
  if(obj.isBone) info.push("Bone");
  if(obj.isGroup) info.push("Group");

  console.log(`${pad}${obj.name || "(senza nome)"} | type=${obj.type} | ${info.join(", ")}`);

  obj.children.forEach((child)=>printHierarchy(child,depth+1));
}

function lerpAngle(a,b,t){
  const diff=Math.atan2(Math.sin(b-a),Math.cos(b-a));
  return a+diff*t;
}

function normalizeAngle(angle){
  return Math.atan2(Math.sin(angle),Math.cos(angle));
}

function smoothBoneTo(bone,x,y,z,lerp=0.28){
  if(!bone) return;
  bone.rotation.x=THREE.MathUtils.lerp(bone.rotation.x,x,lerp);
  bone.rotation.y=THREE.MathUtils.lerp(bone.rotation.y,y,lerp);
  bone.rotation.z=THREE.MathUtils.lerp(bone.rotation.z,z,lerp);
}

function angleToTarget(fromGroup,targetGroup){
  const dx=targetGroup.position.x-fromGroup.position.x;
  const dz=targetGroup.position.z-fromGroup.position.z;

  // Corretto: niente +Math.PI.
  // Prima tutti guardavano dalla parte opposta.
  return Math.atan2(dx,dz);
}

function getNpcFacingAngle(c,targetGroup){
  return angleToTarget(c.root,targetGroup);
}

// ================= FALANGI TOXIC MAN =================
// Dita leggermente incurvate, senza formare un pugno.
// Usa le falangi Mixamo 1, 2 e 3 e conserva la rotazione originale.
const TOXIC_FINGER_STATE=new WeakMap();

function getToxicFingerState(c){
  let state=TOXIC_FINGER_STATE.get(c);
  if(state) return state;

  const fingers=c.bones
    .map((bone)=>{
      const name=(bone.name || "").toLowerCase().replace(/[^a-z0-9]/g,"");
      const match=name.match(/(?:thumb|index|middle|ring|pinky|little)([1-4])/);
      const segment=match ? Number(match[1]) : 0;
      const isFinger=
        name.includes("thumb") ||
        name.includes("index") ||
        name.includes("middle") ||
        name.includes("ring") ||
        name.includes("pinky") ||
        name.includes("little");

      return {bone,name,segment,isFinger,rest:bone.rotation.clone()};
    })
    .filter((item)=>item.isFinger && item.segment>=1 && item.segment<=3);

  state={fingers};
  TOXIC_FINGER_STATE.set(c,state);
  return state;
}

function animateToxicFingers(c){
  if(c.name!=="toxicMan") return;

  const state=getToxicFingerState(c);
  if(!state.fingers.length) return;

  for(const item of state.fingers){
    const {bone,name,segment,rest}=item;
    const isLeft=name.includes("left");

    if(name.includes("thumb")){
      // Pollice appena appoggiato verso il palmo.
      const thumbX=segment===1 ? -0.025 : segment===2 ? -0.055 : -0.075;
      const thumbZ=(segment===1 ? 0.045 : segment===2 ? 0.035 : 0.015)*(isLeft ? -1 : 1);

      smoothBoneTo(
        bone,
        rest.x+thumbX,
        rest.y,
        rest.z+thumbZ,
        .09
      );
      continue;
    }

    // Curvatura molto leggera e progressiva.
    let curl=segment===1 ? 0.10 : segment===2 ? 0.16 : 0.12;

    if(name.includes("ring")) curl*=1.05;
    if(name.includes("pinky") || name.includes("little")) curl*=1.10;

    smoothBoneTo(
      bone,
      rest.x+curl,
      rest.y,
      rest.z,
      .09
    );
  }
}


function animateToxicFingersTalk(c,gesture,waveSide,waveTwist,fingerIntensity=1){
  if(c.name!=="toxicMan") return;

  const state=getToxicFingerState(c);
  if(!state.fingers.length) return;

  for(const item of state.fingers){
    const {bone,name,segment,rest}=item;
    const isLeft=name.includes("left");

    // Mano sinistra resta quasi uguale alla posa idle.
    if(isLeft){
      if(name.includes("thumb")){
        const thumbX=segment===1 ? -0.025 : segment===2 ? -0.055 : -0.075;
        const thumbZ=(segment===1 ? -0.045 : segment===2 ? -0.035 : -0.015);
        smoothBoneTo(bone,rest.x+thumbX,rest.y,rest.z+thumbZ,.09);
      }else{
        let curl=segment===1 ? .10 : segment===2 ? .16 : .12;
        smoothBoneTo(bone,rest.x+curl,rest.y,rest.z,.09);
      }
      continue;
    }

    // Mano destra: durante il "via via" le dita si aprono e richiudono poco.
    if(name.includes("thumb")){
      const base=segment===1 ? -.025 : segment===2 ? -.055 : -.075;
      const open=gesture*fingerIntensity*(segment===1 ? .080 : .060);
      const zBase=segment===1 ? .045 : segment===2 ? .035 : .015;

      smoothBoneTo(
        bone,
        rest.x+base+open,
        rest.y+waveSide*.020,
        rest.z+zBase+waveTwist*.020,
        .10
      );
      continue;
    }

    let baseCurl=segment===1 ? .10 : segment===2 ? .16 : .12;
    if(name.includes("ring")) baseCurl*=1.05;
    if(name.includes("pinky") || name.includes("little")) baseCurl*=1.10;

    const openAmount=gesture*fingerIntensity*(segment===1 ? .24 : segment===2 ? .34 : .28);

    smoothBoneTo(
      bone,
      rest.x+baseCurl-openAmount,
      rest.y+waveSide*.020,
      rest.z+waveTwist*.016,
      .10
    );
  }
}

function smoothStep01(v){
  v=THREE.MathUtils.clamp(v,0,1);
  return v*v*(3-2*v);
}

function lerpRot(a,b,t){
  return {
    x:THREE.MathUtils.lerp(a.x ?? 0,b.x ?? a.x ?? 0,t),
    y:THREE.MathUtils.lerp(a.y ?? 0,b.y ?? a.y ?? 0,t),
    z:THREE.MathUtils.lerp(a.z ?? 0,b.z ?? a.z ?? 0,t),
    lerp:b.lerp ?? a.lerp ?? TOXIC_MAN_ANIM_CONFIG.limbLerp
  };
}

function applyToxicRot(b,limbName,rot,lerpOverride=null){
  const bone=b[limbName];
  if(!bone || !rot) return;
  smoothBoneTo(
    bone,
    rot.x ?? 0,
    rot.y ?? 0,
    rot.z ?? 0,
    lerpOverride ?? rot.lerp ?? TOXIC_MAN_ANIM_CONFIG.limbLerp
  );
}

function addRubToRightBellyPose(rot,rubA,rubB,cfg,mult=1){
  rot.rightArm.x += rubA*cfg.rubArmX*mult;
  rot.rightForeArm.y -= rubA*cfg.rubForeArmY*mult;
  rot.rightForeArm.z -= rubB*cfg.rubForeArmZ*mult;
  rot.rightHand.x += rubB*cfg.rubHandX*mult;
  rot.rightHand.y -= rubA*cfg.rubHandY*mult;
  rot.rightHand.z -= rubB*cfg.rubHandZ*mult;
}

function animateToxicManSpecial(c,b){
  if(c.name!=="toxicMan") return false;
  if(!b) return false;

  const talking=c.state==="talk";
  const now=performance.now();
  const t=now*.0042;
  const s=Math.sin(t);
  const s2=Math.sin(t*1.45+.7);

  // =====================================================
  // NUOVA POSA DA FERMO = VECCHIA ANIMAZIONE DI DIALOGO
  // Mano destra bassa davanti al busto, sinistra rilassata.
  // =====================================================
  // Entrambe le braccia appena più indietro e in posizione neutra.
  // La destra usa la stessa impostazione della sinistra, specchiata.
  const idleLeftArm={
    x:1.02+s*.003,
    y:.010,
    z:.075+s2*.004
  };

  const idleLeftForeArm={
    x:.14+s2*.004,
    y:.035,
    z:.065+s*.004
  };

  const idleLeftHand={
    x:getRest(c,b.leftHand).x+.025+s*.004,
    y:getRest(c,b.leftHand).y+.005,
    z:getRest(c,b.leftHand).z+.008+s2*.003
  };

  // Lato destro uguale al sinistro ma specchiato: posa ferma più naturale.
  const idleRightArm={
    x:idleLeftArm.x,
    y:-idleLeftArm.y,
    z:-idleLeftArm.z
  };

  const idleRightForeArm={
    x:idleLeftForeArm.x,
    y:-idleLeftForeArm.y,
    z:-idleLeftForeArm.z
  };

  const idleRightHand={
    x:getRest(c,b.rightHand).x+(idleLeftHand.x-getRest(c,b.leftHand).x),
    y:-(idleLeftHand.y-getRest(c,b.leftHand).y)+getRest(c,b.rightHand).y,
    z:-(idleLeftHand.z-getRest(c,b.leftHand).z)+getRest(c,b.rightHand).z
  };

  if(!talking){
    smoothBoneTo(b.leftArm,idleLeftArm.x,idleLeftArm.y,idleLeftArm.z,.11);
    smoothBoneTo(b.leftForeArm,idleLeftForeArm.x,idleLeftForeArm.y,idleLeftForeArm.z,.11);
    smoothBoneTo(b.leftHand,idleLeftHand.x,idleLeftHand.y,idleLeftHand.z,.11);

    smoothBoneTo(b.rightArm,idleRightArm.x,idleRightArm.y,idleRightArm.z,.11);
    smoothBoneTo(b.rightForeArm,idleRightForeArm.x,idleRightForeArm.y,idleRightForeArm.z,.11);
    smoothBoneTo(b.rightHand,idleRightHand.x,idleRightHand.y,idleRightHand.z,.11);

    if(b.spine){
      smoothBoneTo(
        b.spine,
        getRest(c,b.spine).x+.010+s*.004,
        getRest(c,b.spine).y,
        getRest(c,b.spine).z+s2*.006,
        .10
      );
    }

    if(b.neck){
      smoothBoneTo(
        b.neck,
        getRest(c,b.neck).x+.004,
        getRest(c,b.neck).y+s*.006,
        getRest(c,b.neck).z-.004,
        .09
      );
    }

    if(b.head){
      smoothBoneTo(
        b.head,
        getRest(c,b.head).x+.010+s*.006,
        getRest(c,b.head).y+s2*.010,
        getRest(c,b.head).z-.008,
        .09
      );
    }

    animateToxicFingers(c);
    return true;
  }

  // =====================================================
  // NUOVA ANIMAZIONE DIALOGO:
  // parte dalla nuova posa da fermo e ogni tanto fa "via via".
  // =====================================================
  // Cinque varianti selezionabili con i tasti 1-5.
  const variants={
    // 1: morbido e naturale, poco teatrale.
    1:{
      speed:.72, pulsePower:1.8, base:.18, pulse:.62,
      armX:.15, armY:.10, armZ:.015,
      foreX:.24, foreY:.08, foreZ:.025,
      handX:.10, handY:.25, handZ:.025,
      side:.10, twist:.055, finger:1.00, doublePush:false
    },

    // 2: apertura laterale più leggibile, gomito più fuori.
    2:{
      speed:.78, pulsePower:1.65, base:.16, pulse:.74,
      armX:0.130, armY:0.405, armZ:.010,
      foreX:0.180, foreY:0.213, foreZ:.020,
      handX:0.065, handY:0.415, handZ:.020,
      side:0.216, twist:.065, finger:1.15, doublePush:false
    },

    // 3: spalla contenuta, gesto soprattutto di polso e mano.
    3:{
      speed:.84, pulsePower:1.55, base:.15, pulse:.78,
      armX:.13, armY:.11, armZ:.008,
      foreX:.26, foreY:.13, foreZ:.018,
      handX:.17, handY:.48, handZ:.018,
      side:.23, twist:.080, finger:1.35, doublePush:false
    },

    // 4: gesto ampio ed energico con tutto il braccio.
    4:{
      speed:.90, pulsePower:1.45, base:.18, pulse:.88,
      armX:.27, armY:.23, armZ:.012,
      foreX:.42, foreY:.22, foreZ:.026,
      handX:.22, handY:.52, handZ:.024,
      side:.27, twist:.095, finger:1.50, doublePush:false
    },

    // 5: due spinte consecutive, tipico "via, via".
    5:{
      speed:.62, pulsePower:1.35, base:.12, pulse:.82,
      armX:.22, armY:.19, armZ:.010,
      foreX:.36, foreY:.19, foreZ:.022,
      handX:.19, handY:.46, handZ:.020,
      side:.25, twist:.085, finger:1.42, doublePush:true
    }
  };

  const v=variants[toxicGestureVariant] || variants[1];

  const continuous=v.base+.055*Math.sin(t*.95);
  let gestureRaw;

  if(v.doublePush){
    // Due colpi positivi per ciclo, con una breve pausa tra loro.
    const a=Math.max(0,Math.sin(t*v.speed-.45));
    const bPulse=Math.max(0,Math.sin(t*v.speed*2.0+1.05))*.48;
    gestureRaw=Math.min(1,a+bPulse);
  }else{
    gestureRaw=Math.max(0,Math.sin(t*v.speed-.7));
  }

  const gesturePulse=Math.pow(gestureRaw,v.pulsePower);
  const gesture=continuous+gesturePulse*v.pulse;

  // Oscillazione verso l'esterno sul principale asse laterale del rig.
  const waveSide=Math.sin(t*3.05)*(v.side*(.30+gesturePulse*.70));
  const waveTwist=Math.sin(t*2.25+.6)*(v.twist*(.30+gesturePulse*.70));

  // Sinistra resta quasi identica alla posa da fermo.
  smoothBoneTo(
    b.leftArm,
    idleLeftArm.x,
    idleLeftArm.y,
    idleLeftArm.z,
    .11
  );

  smoothBoneTo(
    b.leftForeArm,
    idleLeftForeArm.x,
    idleLeftForeArm.y,
    idleLeftForeArm.z,
    .11
  );

  smoothBoneTo(
    b.leftHand,
    idleLeftHand.x,
    idleLeftHand.y,
    idleLeftHand.z,
    .11
  );

  // Spalla e gomito: apertura laterale verso l'esterno.
  // Il verso è invertito rispetto alla versione precedente, che chiudeva nel busto.
  smoothBoneTo(
    b.rightArm,
    idleRightArm.x-gesture*v.armX,
    idleRightArm.y+gesture*v.armY+waveSide*.22,
    idleRightArm.z-gesture*v.armZ,
    .10
  );

  smoothBoneTo(
    b.rightForeArm,
    idleRightForeArm.x+gesture*v.foreX,
    idleRightForeArm.y+gesture*v.foreY+waveSide*.48,
    idleRightForeArm.z+gesture*v.foreZ-waveTwist*.18,
    .10
  );

  // Polso verso l'esterno: la rotazione Y e l'oscillazione laterale
  // sono invertite per ottenere un vero gesto "via via".
  smoothBoneTo(
    b.rightHand,
    idleRightHand.x+gesture*v.handX+s*.010,
    idleRightHand.y-gesture*v.handY-waveSide+s2*.008,
    idleRightHand.z+gesture*v.handZ-waveTwist+s*.008,
    .10
  );

  if(b.spine){
    smoothBoneTo(
      b.spine,
      getRest(c,b.spine).x+.008+s*.005,
      getRest(c,b.spine).y+s2*.002,
      getRest(c,b.spine).z+s2*.005,
      .09
    );
  }

  // Testa e collo vengono orientati dal sistema verso il player.
  animateToxicFingersTalk(c,gesture,waveSide,waveTwist,v.finger);
  return true;
}

function shouldUseToxicLimb(limbName){
  if(!TOXIC_MAN_STATIC_CONFIG.enabled) return false;
  if(TOXIC_MAN_STATIC_CONFIG.targetLimb==="all"){
    return !!TOXIC_MAN_STATIC_CONFIG.use[limbName];
  }
  return TOXIC_MAN_STATIC_CONFIG.targetLimb===limbName;
}

function applyToxicManStaticConfig(c,b){
  if(c.name!=="toxicMan") return false;
  if(!TOXIC_MAN_STATIC_CONFIG.enabled) return false;

  Object.entries(TOXIC_MAN_STATIC_CONFIG.limbs).forEach(([limbName,rot])=>{
    if(!shouldUseToxicLimb(limbName)) return;
    const bone=b[limbName];
    if(!bone) return;

    smoothBoneTo(
      bone,
      rot.x ?? 0,
      rot.y ?? 0,
      rot.z ?? 0,
      rot.lerp ?? 0.14
    );
  });

  return true;
}

function posePartValues(part,talkAmount,s,s2,e){
  return {
    x:THREE.MathUtils.lerp(part.restX ?? 0, part.talkX ?? part.restX ?? 0, talkAmount) + s*(part.moveX ?? 0)*e,
    y:THREE.MathUtils.lerp(part.restY ?? 0, part.talkY ?? part.restY ?? 0, talkAmount) + s2*(part.moveY ?? 0)*e,
    z:THREE.MathUtils.lerp(part.restZ ?? 0, part.talkZ ?? part.restZ ?? 0, talkAmount) + s2*(part.moveZ ?? 0)*e
  };
}

// Animazioni aggiuntive, sovrapposte alle pose di dialogo già esistenti.
// SecurityMan resta invariato. ToxicMan continua a usare il suo sistema speciale.
function animateNpcPersonality(c,b,talking=false){
  const now=performance.now();

  // Bambino: movimenti lenti, leggibili e senza tremolio.
  if(c.name==="child"){
    const t=now*.00155;
    const slow=Math.sin(t);
    const slow2=Math.sin(t*.63+1.1);
    const amount=talking ? .72 : .42;

    if(b.hips){
      smoothBoneTo(
        b.hips,
        getRest(c,b.hips).x,
        getRest(c,b.hips).y+slow2*.006*amount,
        getRest(c,b.hips).z+slow*.010*amount,
        .055
      );
    }

    if(b.spine){
      smoothBoneTo(
        b.spine,
        getRest(c,b.spine).x+slow2*.006*amount,
        getRest(c,b.spine).y,
        getRest(c,b.spine).z+slow*.010*amount,
        .055
      );
    }

    if(b.neck){
      smoothBoneTo(
        b.neck,
        getRest(c,b.neck).x,
        getRest(c,b.neck).y+slow*.012*amount,
        getRest(c,b.neck).z+slow2*.007*amount,
        .060
      );
    }

    if(b.head){
      smoothBoneTo(
        b.head,
        getRest(c,b.head).x+slow2*.010*amount,
        getRest(c,b.head).y+slow*.024*amount,
        getRest(c,b.head).z+slow2*.012*amount,
        .060
      );
    }
    return;
  }

  if(c.name==="boyListeningMusic"){
    // Danza a frasi: groove principale + controtempo + cambio periodico.
    // Frequenze più basse e interpolazione morbida eliminano l'effetto tremolio.
    const t=now*.00215;
    const beat=Math.sin(t*2.0);
    const half=Math.sin(t);
    const quarter=Math.sin(t*.5+.8);
    const sync=Math.sin(t*4.0+.35);
    const phrase=(Math.sin(t*.22)+1)*.5;
    const intensity=talking ? .38 : 1.0;

    // Piccolo abbassamento sulle pulsazioni.
    const down=(1-Math.cos(t*2.0))*.5;
    const side=half*.060*intensity;
    const twist=quarter*.075*intensity;
    const bounce=down*.026*intensity;

    if(b.hips){
      smoothBoneTo(
        b.hips,
        getRest(c,b.hips).x+bounce,
        getRest(c,b.hips).y+twist,
        getRest(c,b.hips).z+side,
        .075
      );
    }

    if(b.spine){
      smoothBoneTo(
        b.spine,
        getRest(c,b.spine).x+bounce*.55,
        getRest(c,b.spine).y-twist*.62,
        getRest(c,b.spine).z-side*.72,
        .075
      );
    }

    if(b.neck){
      smoothBoneTo(
        b.neck,
        getRest(c,b.neck).x+Math.max(0,beat)*.018*intensity,
        getRest(c,b.neck).y+quarter*.020*intensity,
        getRest(c,b.neck).z+half*.020*intensity,
        .080
      );
    }

    if(b.head){
      const headNod=Math.max(0,sync)*.035*intensity;
      smoothBoneTo(
        b.head,
        getRest(c,b.head).x+headNod,
        getRest(c,b.head).y+(talking ? quarter*.015 : quarter*.050),
        getRest(c,b.head).z+(talking ? half*.010 : half*.038),
        .085
      );
    }

    // Spalle alternate, con intensità che cambia lentamente durante la frase.
    const shoulder=.045+.025*phrase;
    if(b.leftArm){
      smoothBoneTo(
        b.leftArm,
        getRest(c,b.leftArm).x+Math.max(0,beat)*shoulder*intensity,
        getRest(c,b.leftArm).y+quarter*.025*intensity,
        getRest(c,b.leftArm).z+half*.065*intensity,
        .080
      );
    }

    if(b.rightArm){
      smoothBoneTo(
        b.rightArm,
        getRest(c,b.rightArm).x+Math.max(0,-beat)*shoulder*intensity,
        getRest(c,b.rightArm).y-quarter*.025*intensity,
        getRest(c,b.rightArm).z-half*.065*intensity,
        .080
      );
    }

    // Avambracci: uno sale mentre l'altro scende, poi si scambiano.
    if(b.leftForeArm){
      smoothBoneTo(
        b.leftForeArm,
        getRest(c,b.leftForeArm).x+(.045+Math.max(0,half)*.070)*intensity,
        getRest(c,b.leftForeArm).y+quarter*.035*intensity,
        getRest(c,b.leftForeArm).z+sync*.018*intensity,
        .085
      );
    }

    if(b.rightForeArm){
      smoothBoneTo(
        b.rightForeArm,
        getRest(c,b.rightForeArm).x+(.045+Math.max(0,-half)*.070)*intensity,
        getRest(c,b.rightForeArm).y-quarter*.035*intensity,
        getRest(c,b.rightForeArm).z-sync*.018*intensity,
        .085
      );
    }

    // Ginocchia alternate: piegamento sul beat e cambio del peso.
    if(b.leftKnee){
      smoothBoneTo(
        b.leftKnee,
        getRest(c,b.leftKnee).x+(down*.085+Math.max(0,half)*.035)*intensity,
        getRest(c,b.leftKnee).y,
        getRest(c,b.leftKnee).z,
        .080
      );
    }

    if(b.rightKnee){
      smoothBoneTo(
        b.rightKnee,
        getRest(c,b.rightKnee).x+(down*.085+Math.max(0,-half)*.035)*intensity,
        getRest(c,b.rightKnee).y,
        getRest(c,b.rightKnee).z,
        .080
      );
    }

    // Passo alternato: tallone/punta, senza scatti.
    if(b.leftFoot){
      smoothBoneTo(
        b.leftFoot,
        getRest(c,b.leftFoot).x-Math.max(0,beat)*.060*intensity,
        getRest(c,b.leftFoot).y+quarter*.012*intensity,
        getRest(c,b.leftFoot).z,
        .080
      );
    }

    if(b.rightFoot){
      smoothBoneTo(
        b.rightFoot,
        getRest(c,b.rightFoot).x-Math.max(0,-beat)*.060*intensity,
        getRest(c,b.rightFoot).y-quarter*.012*intensity,
        getRest(c,b.rightFoot).z,
        .080
      );
    }

    // Il modello segue il baricentro invece di vibrare verticalmente.
    if(c.model){
      const targetY=bounce*.20;
      c.model.position.y=THREE.MathUtils.lerp(c.model.position.y,targetY,.055);
    }
  }
}

function animateConfiguredTalk(c){
  const b=getBones(c);
  const cfg=TALK_POSES[c.name];
  if(!cfg){
    animateIdle(c);
    return;
  }

  const t=performance.now()*.0075;
  const s=Math.sin(t);
  const s2=Math.sin(t*1.7);

  // Da 0 a 1, con movimento morbido.
  const talkAmount=0.62 + Math.sin(t*.9)*0.22;
  const e=cfg.energy;

  // =====================================================
  // NUOVO SISTEMA MODIFICABILE PER SECURITY MAN
  // Se un personaggio ha leftForeArm/rightForeArm come oggetti,
  // allora usa tutti gli assi X/Y/Z configurabili.
  // =====================================================
  const fullEditableArms =
    typeof cfg.leftForeArm === "object" &&
    typeof cfg.rightForeArm === "object" &&
    typeof cfg.leftHand === "object" &&
    typeof cfg.rightHand === "object";

  if(fullEditableArms){
    const leftArm=posePartValues(cfg.leftArm,talkAmount,s,s2,e);
    const rightArm=posePartValues(cfg.rightArm,talkAmount,s2,s,e);
    const leftForeArm=posePartValues(cfg.leftForeArm,talkAmount,s2,s,e);
    const rightForeArm=posePartValues(cfg.rightForeArm,talkAmount,s,s2,e);
    const leftHand=posePartValues(cfg.leftHand,talkAmount,s,s2,e);
    const rightHand=posePartValues(cfg.rightHand,talkAmount,s,s2,e);

    if(cfg.useLeft){
      smoothBoneTo(b.leftArm,leftArm.x,leftArm.y,leftArm.z,.17);
      smoothBoneTo(b.leftForeArm,leftForeArm.x,leftForeArm.y,leftForeArm.z,.17);
      smoothBoneTo(
        b.leftHand,
        getRest(c,b.leftHand).x + leftHand.x,
        getRest(c,b.leftHand).y + leftHand.y,
        getRest(c,b.leftHand).z + leftHand.z,
        .17
      );
    }else{
      smoothBoneTo(b.leftArm,cfg.leftArm.restX,cfg.leftArm.restY,cfg.leftArm.restZ,.17);
      smoothBoneTo(b.leftForeArm,cfg.leftForeArm.restX,cfg.leftForeArm.restY,cfg.leftForeArm.restZ,.17);
      smoothBoneTo(
        b.leftHand,
        getRest(c,b.leftHand).x + cfg.leftHand.restX,
        getRest(c,b.leftHand).y + cfg.leftHand.restY,
        getRest(c,b.leftHand).z + cfg.leftHand.restZ,
        .17
      );
    }

    if(cfg.useRight){
      smoothBoneTo(b.rightArm,rightArm.x,rightArm.y,rightArm.z,.17);
      smoothBoneTo(b.rightForeArm,rightForeArm.x,rightForeArm.y,rightForeArm.z,.17);
      smoothBoneTo(
        b.rightHand,
        getRest(c,b.rightHand).x + rightHand.x,
        getRest(c,b.rightHand).y + rightHand.y,
        getRest(c,b.rightHand).z + rightHand.z,
        .17
      );
    }else{
      smoothBoneTo(b.rightArm,cfg.rightArm.restX,cfg.rightArm.restY,cfg.rightArm.restZ,.17);
      smoothBoneTo(b.rightForeArm,cfg.rightForeArm.restX,cfg.rightForeArm.restY,cfg.rightForeArm.restZ,.17);
      smoothBoneTo(
        b.rightHand,
        getRest(c,b.rightHand).x + cfg.rightHand.restX,
        getRest(c,b.rightHand).y + cfg.rightHand.restY,
        getRest(c,b.rightHand).z + cfg.rightHand.restZ,
        .17
      );
    }
  }else{
    // Sistema vecchio per child e boyListeningMusic.
    function armValues(side){
      const data=cfg[side+"Arm"];

      return {
        x:THREE.MathUtils.lerp(data.restX,data.talkX,talkAmount),
        z:THREE.MathUtils.lerp(data.restZ,data.talkZ,talkAmount)
      };
    }

    const left=armValues("left");
    const right=armValues("right");

    // LEFT ARM
    if(cfg.useLeft){
      smoothBoneTo(
        b.leftArm,
        left.x+s*.025*e,
        0,
        left.z+s2*.035*e,
        .17
      );

      smoothBoneTo(
        b.leftForeArm,
        cfg.leftForeArmX+s2*.05*e,
        getRest(c,b.leftForeArm).y,
        getRest(c,b.leftForeArm).z,
        .17
      );

      smoothBoneTo(
        b.leftHand,
        getRest(c,b.leftHand).x+s*.025*e,
        getRest(c,b.leftHand).y+s2*.030*e,
        getRest(c,b.leftHand).z+s2*.045*e,
        .17
      );
    }else{
      smoothBoneTo(b.leftArm,cfg.leftArm.restX,0,cfg.leftArm.restZ,.17);
      smoothBoneTo(b.leftForeArm,cfg.leftForeArmX,0,0,.17);
      smoothBoneTo(
        b.leftHand,
        getRest(c,b.leftHand).x,
        getRest(c,b.leftHand).y,
        getRest(c,b.leftHand).z,
        .17
      );
    }

    // RIGHT ARM
    if(cfg.useRight){
      smoothBoneTo(
        b.rightArm,
        right.x+s2*.025*e,
        0,
        right.z+s2*.035*e,
        .17
      );

      smoothBoneTo(
        b.rightForeArm,
        cfg.rightForeArmX+s*.05*e,
        getRest(c,b.rightForeArm).y,
        getRest(c,b.rightForeArm).z,
        .17
      );

      // Security: mano un pochino più a pugno.
      // Per gli altri NPC resta quasi uguale.
      const fistX = c.name==="securityMan" ? 0.10 : 0.00;
      const fistY = c.name==="securityMan" ? 0.08 : 0.00;
      const fistZ = c.name==="securityMan" ? -0.06 : 0.00;

      smoothBoneTo(
        b.rightHand,
        getRest(c,b.rightHand).x+fistX+s*.030*e,
        getRest(c,b.rightHand).y+fistY+s2*.10*e,
        getRest(c,b.rightHand).z+fistZ+s*.12*e,
        .17
      );
    }else{
      smoothBoneTo(b.rightArm,cfg.rightArm.restX,0,cfg.rightArm.restZ,.17);
      smoothBoneTo(b.rightForeArm,cfg.rightForeArmX,0,0,.17);
      smoothBoneTo(
        b.rightHand,
        getRest(c,b.rightHand).x,
        getRest(c,b.rightHand).y,
        getRest(c,b.rightHand).z,
        .17
      );
    }
  }

  // Corpo ondulatorio durante dialogo.
  smoothBoneTo(
    b.hips,
    getRest(c,b.hips).x+s*.002*e,
    getRest(c,b.hips).y+s*.004*e,
    getRest(c,b.hips).z-s*.004*e,
    .12
  );

  smoothBoneTo(
    b.spine,
    getRest(c,b.spine).x+s*.012*e,
    getRest(c,b.spine).y,
    getRest(c,b.spine).z+s*.026*e,
    .12
  );

  smoothBoneTo(
    b.neck,
    getRest(c,b.neck).x+s2*.006*e,
    getRest(c,b.neck).y+s*.040*e,
    getRest(c,b.neck).z,
    .12
  );

  smoothBoneTo(
    b.head,
    getRest(c,b.head).x+s*.020*e,
    getRest(c,b.head).y+s*.085*e,
    getRest(c,b.head).z+s2*.018*e,
    .12
  );

  if(c.model){
    c.model.position.y=THREE.MathUtils.lerp(c.model.position.y,Math.abs(s)*.008*e,.12);
  }

  // Personalità specifica di Child e BoyListeningMusic.
  animateNpcPersonality(c,b,true);

  // Le braccia e il corpo del SecurityMan restano quelli già approvati.
  animateSecurityFingers(c,true);
  animateSecurityHeadSpeech(c,true);
}

// Il GLB reale non contiene rig o clip AnimationClip, ma possiede mesh separate:
// quattro rulli, leva laterale e pulsante. Le animiamo proceduralmente.
const SLOT_MACHINES=[];
let rightSlotMachine=null;
let activeSlotMachine=null;
let slotInteractionTarget=null;

function findSlotPart(root,name){
  return root.getObjectByName(name) || null;
}

function makeSlotMaterialsIndependent(root){
  root.traverse((obj)=>{
    if(!obj.isMesh || !obj.material) return;
    obj.material=Array.isArray(obj.material)
      ? obj.material.map((m)=>m.clone())
      : obj.material.clone();
  });
}

function registerAnimatedSlot(slot,isRight=false){
  makeSlotMaterialsIndependent(slot);

  const reels=[
    findSlotPart(slot,"polySurface75"),
    findSlotPart(slot,"polySurface95"),
    findSlotPart(slot,"polySurface96"),
    findSlotPart(slot,"polySurface97")
  ].filter(Boolean);

  const lever=findSlotPart(slot,"polySurface73");
  const leverKnob=findSlotPart(slot,"polySurface88");
  const button=findSlotPart(slot,"pCylinder1");

  const state={
    root:slot,
    reels,
    lever,
    leverKnob,
    button,
    playing:false,
    elapsed:0,
    duration:4.8,
    reelAngles:reels.map(()=>0),
    leverRest:lever ? lever.rotation.clone() : null,
    knobRest:leverKnob ? leverKnob.rotation.clone() : null,
    buttonRest:button ? button.position.clone() : null,
    lamps:[]
  };

  slot.traverse((obj)=>{
    if(!obj.isMesh || !obj.material) return;
    const mats=Array.isArray(obj.material) ? obj.material : [obj.material];
    for(const mat of mats){
      if(!mat.color) continue;
      if("emissive" in mat){
        mat.emissive=mat.emissive || new THREE.Color(0x000000);
        state.lamps.push(mat);
      }
    }
  });

  slot.userData.slotState=state;
  SLOT_MACHINES.push(state);
  if(isRight) rightSlotMachine=slot;
  return state;
}

function playSlotMachine(state){
  if(!state || state.playing) return;
  state.playing=true;
  state.elapsed=0;
  activeSlotMachine=state;
  showDialogue("Slot avviata: i rulli stanno girando...");
  setTimeout(()=>{
    if(activeSlotMachine===state) hideDialogue();
  },4800);
}

function easeInOut(v){
  v=THREE.MathUtils.clamp(v,0,1);
  return v<.5 ? 2*v*v : 1-Math.pow(-2*v+2,2)/2;
}

function updateSlotMachines(dt){
  for(const state of SLOT_MACHINES){
    if(!state.playing) continue;
    state.elapsed+=dt;
    const t=state.elapsed;

    // Leva: scende, resta brevemente abbassata e ritorna.
    let leverAmount=0;
    if(t<.35) leverAmount=easeInOut(t/.35);
    else if(t<.62) leverAmount=1;
    else if(t<1.05) leverAmount=1-easeInOut((t-.62)/.43);

    if(state.lever && state.leverRest){
      state.lever.rotation.copy(state.leverRest);
      state.lever.rotation.z+=leverAmount*.82;
    }
    if(state.leverKnob && state.knobRest){
      state.leverKnob.rotation.copy(state.knobRest);
      state.leverKnob.rotation.z+=leverAmount*.82;
    }
    if(state.button && state.buttonRest){
      state.button.position.copy(state.buttonRest);
      state.button.position.z-=Math.sin(Math.min(1,t/.18)*Math.PI)*.018;
    }

    // I rulli partono insieme e si fermano uno alla volta.
    state.reels.forEach((reel,index)=>{
      const stopTime=2.65+index*.42;
      const remaining=Math.max(0,stopTime-t);
      const speed=remaining>.55 ? 22 : 22*easeInOut(remaining/.55);
      state.reelAngles[index]+=speed*dt;
      reel.rotation.x=state.reelAngles[index];
    });

    // Pulsazione luminosa del mobile durante la giocata.
    const glow=.08+.22*Math.abs(Math.sin(t*9));
    for(const mat of state.lamps){
      if(mat.emissive){
        mat.emissive.setRGB(glow*.9,glow*.45,glow*.08);
        mat.emissiveIntensity=1.15;
      }
    }

    if(t>=state.duration){
      state.playing=false;
      activeSlotMachine=null;
      for(const mat of state.lamps){
        if(mat.emissive){
          mat.emissive.setHex(0x000000);
          mat.emissiveIntensity=1;
        }
      }
    }
  }
}

// I due modelli vengono scalati SEMPRE in modo uniforme: nessun asse viene deformato.
// Il Pub usa un asse verticale diverso, quindi viene ruotato prima del calcolo della scala.
const SHOP_FACADES={casino:null,pub:null};

function cloneFacadeMaterials(root){
  root.traverse((obj)=>{
    if(!obj.isMesh || !obj.material) return;
    if(Array.isArray(obj.material)) obj.material=obj.material.map((m)=>m.clone());
    else obj.material=obj.material.clone();
  });
}

function placeFacadeUniformly(model,config){
  model.rotation.order="YXZ";
  model.rotation.set(config.rotationX||0,config.rotationY||0,config.rotationZ||0);
  model.scale.setScalar(1);
  model.position.set(0,0,0);
  model.updateMatrixWorld(true);

  let box=new THREE.Box3().setFromObject(model);
  let size=box.getSize(new THREE.Vector3());
  if(size.x<=0 || size.y<=0) throw new Error("Dimensioni GLB non valide");

  // Un solo fattore per X/Y/Z: preserva perfettamente le proporzioni originali.
  const uniformScale=Math.min(config.maxWidth/size.x,config.maxHeight/size.y);
  model.scale.setScalar(uniformScale);
  model.updateMatrixWorld(true);

  box=new THREE.Box3().setFromObject(model);
  const center=box.getCenter(new THREE.Vector3());

  // Centro orizzontale, base sul terreno e retro leggermente incassato nella parete.
  model.position.x+=config.centerX-center.x;
  model.position.y+=config.floorY-box.min.y;
  model.position.z+=config.wallZ-box.min.z-config.embedDepth;
  model.updateMatrixWorld(true);

  box=new THREE.Box3().setFromObject(model);
  size=box.getSize(new THREE.Vector3());
  console.info(config.label,"dimensioni finali",size,"scala uniforme",uniformScale);
  return {box,size,uniformScale};
}

function loadShopFacade(paths,config,key){
  loadGLBFromCandidates(paths,(gltf,path)=>{
    const model=gltf.scene;
    model.name=key+"_facade_glb";
    cloneFacadeMaterials(model);
    prepareStaticGLB(model);

    model.traverse((obj)=>{
      if(!obj.isMesh) return;
      obj.frustumCulled=true;
      // Le texture restano originali; solo una leggera correzione evita facciate troppo lucide.
      const mats=Array.isArray(obj.material)?obj.material:[obj.material];
      mats.forEach((mat)=>{
        if(!mat) return;
        if("roughness" in mat) mat.roughness=Math.max(.68,mat.roughness??.68);
        if("metalness" in mat) mat.metalness=Math.min(.18,mat.metalness??0);
        mat.needsUpdate=true;
      });
    });

    const result=placeFacadeUniformly(model,config);
    scene.add(model);
    SHOP_FACADES[key]={model,path,...result};
  },(error)=>console.error("Errore caricando facciata "+key,error));
}

// Prova i percorsi in sequenza e usa il primo GLB disponibile.
function loadGLBFromCandidates(paths,onLoad,onError){
  const candidates=Array.isArray(paths)?paths.filter(Boolean):[];
  let index=0;
  let lastError=null;

  const tryNext=()=>{
    if(index>=candidates.length){
      if(typeof onError==="function"){
        onError(lastError || new Error("Nessun percorso GLB valido."));
      }
      return;
    }

    const path=candidates[index++];
    loader.load(
      path,
      (gltf)=>{
        if(typeof onLoad==="function") onLoad(gltf,path);
      },
      undefined,
      (error)=>{
        lastError=error;
        tryNext();
      }
    );
  };

  tryNext();
}


// ================= VEGETAZIONE GLB NEL GIARDINO =================
// trees.glb viene clonato sempre come gruppo completo (tronco, rami e foglie),
// con dimensioni diverse. plants.glb viene distribuito in piccoli gruppi naturali, soprattutto sotto gli alberi.
const BEACH_VEGETATION={trees:[],plants:[]};

function cloneVegetationModel(source,name){
  const model=source.clone(true);
  model.name=name;
  model.traverse((obj)=>{
    if(!obj.isMesh) return;
    obj.castShadow=true;
    obj.receiveShadow=true;
    obj.frustumCulled=true;
    // Materiale indipendente per ogni gruppo, così le leggere variazioni cromatiche
    // non modificano tutte le copie contemporaneamente.
    if(Array.isArray(obj.material)) obj.material=obj.material.map((m)=>m.clone());
    else if(obj.material) obj.material=obj.material.clone();
  });
  return model;
}

function normalizeVegetation(model,targetHeight){
  model.position.set(0,0,0);
  model.rotation.set(0,0,0);
  model.scale.set(1,1,1);
  model.updateMatrixWorld(true);
  let box=new THREE.Box3().setFromObject(model);
  const size=box.getSize(new THREE.Vector3());
  if(size.y<=.0001) return 1;
  const scale=targetHeight/size.y;
  model.scale.setScalar(scale);
  model.updateMatrixWorld(true);
  box=new THREE.Box3().setFromObject(model);
  model.position.y-=box.min.y;
  model.updateMatrixWorld(true);
  return scale;
}

function placeVegetationOnGround(model,x,z,rotationY=0,scaleMultiplier=1){
  model.rotation.y=rotationY;
  model.scale.multiplyScalar(scaleMultiplier);
  model.position.x=x;
  model.position.z=z;
  model.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(model);
  model.position.y-=box.min.y;
  model.updateMatrixWorld(true);
  scene.add(model);
  return model;
}

function tintTreeGroup(model,index){

  const leafColor=leafColors[index%leafColors.length];
  const barkColor=barkColors[index%barkColors.length];
  model.traverse((obj)=>{
    if(!obj.isMesh || !obj.material) return;
    const mats=Array.isArray(obj.material)?obj.material:[obj.material];
    mats.forEach((mat)=>{
      const label=`${obj.name||''} ${mat.name||''}`.toLowerCase();
      const isLeaf=label.includes('leaf');

      if(mat.color){

function tintStationAsWood(model){
  const woodColors=[0x9a6a43,0xae7a4f,0x865a38,0xb78359];
  let woodIndex=0;
  model.traverse((obj)=>{
    if(!obj.isMesh || !obj.material) return;

    const mats=Array.isArray(obj.material)?obj.material:[obj.material];
    mats.forEach((sourceMat,index)=>{

      }else if(/metal|iron|steel|ring|buoy|life|rope/.test(key)){
        if(mat.color && !/buoy|life|ring/.test(key)) mat.color.setHex(0x302b27);
        mat.roughness=.62;
        mat.metalness=.18;
      }else{
        if(mat.color) mat.color.setHex(woodColors[(woodIndex++)%woodColors.length]);
        mat.roughness=.88;
        mat.metalness=0;
      }
      if(Array.isArray(obj.material)) obj.material[index]=mat;
      else obj.material=mat;

// ================= STATION RIFATTA DA ZERO =================
// Regole:
// 1) nessuna altezza artificiale o quota bloccata;
// 2) il player appoggia sulla superficie reale del GLB tramite raycast verticale;
// 3) E compare solo davanti alla porta sulla pedana;
// 4) entrare sposta esclusivamente X/Z, lasciando invariata Y;
// 5) collisioni semplici sulle pareti della cabina, con apertura reale della porta.
let stationInside=false;
const STATION_NAV={
  centerX:58,
  centerZ:106,

  // La rampa del GLB è decentrata: con rotation.y = Math.PI
  // arriva sul lato destro-frontale della cabina, non al centro.
  doorX:64.35,
  doorZ:109.25,
  insideX:62.95,
  insideZ:109.25,
  outsideX:65.85,
  outsideZ:109.25,

  deckMinY:3.8,
  interactionRadius:1.55,

  // Volume interno reale approssimato dalla bounding box del GLB scalato.
  cabinMinX:51.55,
  cabinMaxX:64.35,
  cabinMinZ:100.85,
  cabinMaxZ:111.65,
  doorHalfWidth:1.70
};

const stationFloorRaycaster=new THREE.Raycaster();
const stationRayOrigin=new THREE.Vector3();
const stationDown=new THREE.Vector3(0,-1,0);
const stationNormalMatrix=new THREE.Matrix3();
const stationWorldNormal=new THREE.Vector3();

function getStationSurfaceY(position,currentY){
  if(!COASTAL_ASSETS.station || COASTAL_ASSETS.stationWalkMeshes.length===0) return null;

  stationRayOrigin.set(position.x,Math.max(currentY+7,14),position.z);
  stationFloorRaycaster.set(stationRayOrigin,stationDown);
  stationFloorRaycaster.far=30;

  const hits=stationFloorRaycaster.intersectObjects(COASTAL_ASSETS.stationWalkMeshes,false);
  let best=null;

  for(const hit of hits){
    if(!hit.face) continue;
    stationNormalMatrix.getNormalMatrix(hit.object.matrixWorld);
    stationWorldNormal.copy(hit.face.normal).applyMatrix3(stationNormalMatrix).normalize();

    // Solo pavimenti, rampa e pedane rivolti verso l'alto.
    if(stationWorldNormal.y<0.38) continue;
    if(hit.point.y < -.08) continue;

    // Evita di saltare sul tetto o su una pedana passando da sotto.
    const maxStepUp=currentY<1 ? .42 : .62;
    if(hit.point.y>currentY+maxStepUp) continue;

    if(best===null || hit.point.y>best) best=hit.point.y;
  }
  return best;
}

function resolveCircleAgainstBox2D(position,box,radius=.48){
  const nearestX=THREE.MathUtils.clamp(position.x,box.minX,box.maxX);
  const nearestZ=THREE.MathUtils.clamp(position.z,box.minZ,box.maxZ);
  let dx=position.x-nearestX;
  let dz=position.z-nearestZ;
  const distSq=dx*dx+dz*dz;

  if(distSq>=radius*radius) return false;

  if(distSq>1e-8){
    const dist=Math.sqrt(distSq);
    const push=(radius-dist)+.015;
    position.x+=dx/dist*push;
    position.z+=dz/dist*push;
    return true;
  }

  // Il centro è già dentro il box: espulsione dal bordo più vicino.
  const left=Math.abs(position.x-box.minX);
  const right=Math.abs(box.maxX-position.x);
  const back=Math.abs(position.z-box.minZ);
  const front=Math.abs(box.maxZ-position.z);
  const minimum=Math.min(left,right,back,front);

  if(minimum===left) position.x=box.minX-radius-.015;
  else if(minimum===right) position.x=box.maxX+radius+.015;
  else if(minimum===back) position.z=box.minZ-radius-.015;
  else position.z=box.maxZ+radius+.015;
  return true;
}

function applyStationWallCollisions(previousPosition){
  const p=player.root.position;
  if(p.y<.18) return;

  // Volumi essenziali e non sovrapposti. L'apertura vera resta sul lato destro,
  // vicino alla ciambella. Le staccionate seguono soltanto i bordi della rampa.
  const colliders=[
    // Cabina: lato sinistro e parete posteriore.
    {minX:50.95,maxX:52.10,minZ:100.45,maxZ:111.95},
    {minX:50.95,maxX:64.75,minZ:100.25,maxZ:101.35},

    // Lato anteriore della cabina, diviso per lasciare libero il raccordo con la rampa.
    {minX:50.95,maxX:60.55,minZ:110.70,maxZ:112.00},

    // Lato destro: due tratti separati con apertura vicino alla ciambella.
    {minX:63.55,maxX:64.80,minZ:100.45,maxZ:107.10},
    {minX:63.55,maxX:64.80,minZ:110.55,maxZ:112.00},

    // Staccionate della pendenza, più sottili e arretrate rispetto al corridoio calpestabile.
    {minX:59.70,maxX:60.55,minZ:110.95,maxZ:127.10},
    {minX:64.05,maxX:64.90,minZ:110.95,maxZ:127.10},

    // Protezioni aggiuntive accanto alla pendenza e ai raccordi della pedana.
    {minX:58.95,maxX:60.20,minZ:124.90,maxZ:127.45},
    {minX:64.25,maxX:65.50,minZ:124.90,maxZ:127.45},
    {minX:59.10,maxX:60.20,minZ:109.90,maxZ:112.20},
    {minX:64.25,maxX:65.25,minZ:110.25,maxZ:112.20},

    // Zona vicina alla ciambella: collisione presente ma apertura della porta libera.
    {minX:62.80,maxX:63.70,minZ:106.50,maxZ:108.15},
    {minX:62.80,maxX:63.70,minZ:110.35,maxZ:111.95}
  ];

  for(const box of colliders){
    resolveCircleAgainstBox2D(p,box,.50);
  }

  if(stationInside){
    // Limiti interni morbidi; la porta destra resta attraversabile.
    p.x=THREE.MathUtils.clamp(p.x,STATION_NAV.cabinMinX+.52,STATION_NAV.cabinMaxX-.52);
    p.z=THREE.MathUtils.clamp(p.z,STATION_NAV.cabinMinZ+.52,STATION_NAV.cabinMaxZ-.52);
  }
}
function updatePlayerStationFloor(previousPosition){
  if(activeWorldZone!=="outside" || !player?.ready) return;

  const p=player.root.position;
  const nearStation=Math.abs(p.x-STATION_NAV.centerX)<12 && Math.abs(p.z-STATION_NAV.centerZ)<22;

  if(!nearStation){
    p.y=THREE.MathUtils.lerp(p.y,0,.55);
    if(Math.abs(p.y)<.01) p.y=0;
    return;
  }

  applyStationWallCollisions(previousPosition);

  const surfaceY=getStationSurfaceY(p,p.y);
  const targetY=surfaceY===null ? 0 : surfaceY;

  // Adesione rapida ma morbida: niente fluttuazione e niente teletrasporto verticale.
  const lerpAmount=targetY>p.y ? .82 : .68;
  p.y=THREE.MathUtils.lerp(p.y,targetY,lerpAmount);
  if(Math.abs(p.y-targetY)<.008) p.y=targetY;
}

// Assi verificati sul GLB:
// - X = larghezza / asse dei mozzi;
// - Y = lunghezza dell'auto;
// - Z = altezza.
// Le ruote devono quindi girare attorno all'asse X, ruotando il piano Y/Z.
function setupCarTyreAnimation(car){
  const carMeshes=[];
  let tyreMesh=null;

  car.traverse((obj)=>{
    if(!obj.isMesh || !obj.geometry) return;
    carMeshes.push(obj);

    const n=(obj.name || "").toLowerCase();
    if(
      !tyreMesh &&
      (n.includes("tyres") || n.includes("tires") || n.includes("wheel"))
    ){
      tyreMesh=obj;
    }
  });

  if(!tyreMesh) return null;

  function cloneMeshForWheelAnimation(mesh){
    mesh.geometry=mesh.geometry.clone();

    if(Array.isArray(mesh.material)){
      mesh.material=mesh.material.map(material=>material.clone());
    }else{
      mesh.material=mesh.material.clone();
    }
  }

  function findConnectedComponents(geometry){
    const position=geometry.getAttribute("position");
    const index=geometry.getIndex();

    if(!position || !index) return [];

    const vertexCount=position.count;
    const parent=new Int32Array(vertexCount);
    const componentSize=new Int32Array(vertexCount);

    for(let i=0;i<vertexCount;i++){
      parent[i]=i;
      componentSize[i]=1;
    }

    function findRoot(value){
      let root=value;
      while(parent[root]!==root) root=parent[root];

      while(parent[value]!==value){
        const next=parent[value];
        parent[value]=root;
        value=next;
      }

      return root;
    }

    function unionVertices(a,b){
      let rootA=findRoot(a);
      let rootB=findRoot(b);
      if(rootA===rootB) return;

      if(componentSize[rootA]<componentSize[rootB]){
        const swap=rootA;
        rootA=rootB;
        rootB=swap;
      }

      parent[rootB]=rootA;
      componentSize[rootA]+=componentSize[rootB];
    }

    for(let i=0;i<index.count;i+=3){
      const a=index.getX(i);
      const b=index.getX(i+1);
      const c=index.getX(i+2);
      unionVertices(a,b);
      unionVertices(b,c);
      unionVertices(c,a);
    }

    const componentMap=new Map();

    for(let i=0;i<vertexCount;i++){
      const root=findRoot(i);

      if(!componentMap.has(root)){
        componentMap.set(root,{
          vertices:[],
          min:new THREE.Vector3(Infinity,Infinity,Infinity),
          max:new THREE.Vector3(-Infinity,-Infinity,-Infinity)
        });
      }

      const component=componentMap.get(root);
      component.vertices.push(i);

      const x=position.getX(i);
      const y=position.getY(i);
      const z=position.getZ(i);

      component.min.x=Math.min(component.min.x,x);
      component.min.y=Math.min(component.min.y,y);
      component.min.z=Math.min(component.min.z,z);
      component.max.x=Math.max(component.max.x,x);
      component.max.y=Math.max(component.max.y,y);
      component.max.z=Math.max(component.max.z,z);
    }

    return Array.from(componentMap.values()).map(component=>{
      component.size=new THREE.Vector3().subVectors(component.max,component.min);
      component.center=new THREE.Vector3()
        .addVectors(component.min,component.max)
        .multiplyScalar(.5);
      return component;
    });
  }

  const uniforms={uWheelAngle:{value:0}};

  function attachWheelShader(mesh,selectedComponents,cacheKey,centerResolver=null){
    if(!selectedComponents.length) return 0;

    const geometry=mesh.geometry;
    const position=geometry.getAttribute("position");
    const wheelCenterAttribute=new Float32Array(position.count*3);
    const wheelWeightAttribute=new Float32Array(position.count);

    for(const component of selectedComponents){
      const rotationCenter=centerResolver
        ? centerResolver(component)
        : component.center;

      for(const vertexIndex of component.vertices){
        const base=vertexIndex*3;
        wheelCenterAttribute[base]=rotationCenter.x;
        wheelCenterAttribute[base+1]=rotationCenter.y;
        wheelCenterAttribute[base+2]=rotationCenter.z;
        wheelWeightAttribute[vertexIndex]=1;
      }
    }

    geometry.setAttribute(
      "aWheelCenter",
      new THREE.BufferAttribute(wheelCenterAttribute,3)
    );
    geometry.setAttribute(
      "aWheelWeight",
      new THREE.BufferAttribute(wheelWeightAttribute,1)
    );

    const materials=Array.isArray(mesh.material)
      ? mesh.material
      : [mesh.material];

    for(const material of materials){
      const previousCompile=material.onBeforeCompile;

      material.onBeforeCompile=(shader,renderer)=>{
        if(previousCompile) previousCompile(shader,renderer);
        Object.assign(shader.uniforms,uniforms);

        shader.vertexShader=shader.vertexShader
          .replace(
            "#include <common>",
            `#include <common>
attribute vec3 aWheelCenter;
attribute float aWheelWeight;
uniform float uWheelAngle;`
          )
          .replace(
            "#include <beginnormal_vertex>",
            `vec3 objectNormal = vec3( normal );

if(aWheelWeight>.5){
  float wheelNormalCos=cos(uWheelAngle);
  float wheelNormalSin=sin(uWheelAngle);
  objectNormal.yz=mat2(
    wheelNormalCos,-wheelNormalSin,
    wheelNormalSin, wheelNormalCos
  )*objectNormal.yz;
}

#ifdef USE_TANGENT
  vec3 objectTangent = vec3( tangent.xyz );
  if(aWheelWeight>.5){
    float wheelTangentCos=cos(uWheelAngle);
    float wheelTangentSin=sin(uWheelAngle);
    objectTangent.yz=mat2(
      wheelTangentCos,-wheelTangentSin,
      wheelTangentSin, wheelTangentCos
    )*objectTangent.yz;
  }
#endif`
          )
          .replace(
            "#include <begin_vertex>",
            `vec3 transformed=vec3(position);

if(aWheelWeight>.5){
  vec3 wheelLocal=transformed-aWheelCenter;
  float wheelCos=cos(uWheelAngle);
  float wheelSin=sin(uWheelAngle);
  wheelLocal.yz=mat2(
    wheelCos,-wheelSin,
    wheelSin, wheelCos
  )*wheelLocal.yz;
  transformed=wheelLocal+aWheelCenter;
}`
          );

        mesh.userData.wheelShader=shader;
      };

      material.customProgramCacheKey=()=>cacheKey;
      material.needsUpdate=true;
    }

    return selectedComponents.length;
  }

  // 1) Pneumatici neri.
  cloneMeshForWheelAnimation(tyreMesh);
  const tyreComponents=findConnectedComponents(tyreMesh.geometry);
  const selectedTyreComponents=tyreComponents.filter(component=>{
    const size=component.size;
    return (
      component.vertices.length>100 &&
      size.y>size.x*1.8 &&
      size.z>size.x*1.8 &&
      Math.abs(size.y-size.z)<Math.max(size.y,size.z)*.18
    );
  });

  attachWheelShader(
    tyreMesh,
    selectedTyreComponents,
    "street-car-tyres-complete-v7"
  );

  // Le gomme sono duplicate a coppie. Ricaviamo quattro centri unici.
  const wheelCenters=[];
  for(const component of selectedTyreComponents){
    const alreadyPresent=wheelCenters.some(center=>(
      Math.abs(center.x-component.center.x)<2 &&
      Math.abs(center.y-component.center.y)<2 &&
      Math.abs(center.z-component.center.z)<2
    ));

    if(!alreadyPresent) wheelCenters.push(component.center.clone());
  }

  // 2) Cerchi, razze, mozzi, bulloni e dischi/fermapneumatici grigi interni.
  // Tutti i componenti selezionati ruotano attorno al centro REALE della
  // rispettiva ruota. Questo evita che piccoli pezzi girino su sé stessi.
  const animatedRimMeshes=[];

  function nearestWheelCenter(component){
    let nearest=wheelCenters[0];
    let bestDistance=Infinity;

    for(const center of wheelCenters){
      const dx=component.center.x-center.x;
      const dy=component.center.y-center.y;
      const dz=component.center.z-center.z;
      const distance=dx*dx+dy*dy+dz*dz;

      if(distance<bestDistance){
        bestDistance=distance;
        nearest=center;
      }
    }

    return nearest || component.center;
  }

  for(const mesh of carMeshes){
    if(mesh===tyreMesh) continue;

    const meshName=(mesh.name || "").toLowerCase();
    const isWheelMetalMesh=
      meshName.includes("color_m08") ||
      meshName.includes("color_m03") ||
      meshName.includes("color_m02");

    if(!isWheelMetalMesh) continue;

    cloneMeshForWheelAnimation(mesh);
    const components=findConnectedComponents(mesh.geometry);

    const selectedRimComponents=components.filter(component=>{
      const size=component.size;
      const center=nearestWheelCenter(component);

      const dx=Math.abs(component.center.x-center.x);
      const dy=component.center.y-center.y;
      const dz=component.center.z-center.z;
      const radialDistance=Math.hypot(dy,dz);

      const belongsToWheelArea=
        dx<26 &&
        radialDistance<39;

      // Anelli, dischi e razze principali.
      const mainCircularPart=
        size.y>18 &&
        size.z>18 &&
        Math.abs(size.y-size.z)<Math.max(size.y,size.z)*.38 &&
        size.x<32;

      // Mozzo centrale e cappellotto.
      const centralHub=
        radialDistance<10 &&
        size.y<18 &&
        size.z<18 &&
        size.x<18;

      // Bulloni e piccoli dettagli distribuiti attorno al mozzo.
      // Devono orbitare attorno al centro ruota, non ruotare sul proprio asse.
      const wheelFastener=
        radialDistance<16 &&
        size.y<7 &&
        size.z<7 &&
        size.x<8;

      return (
        component.vertices.length>20 &&
        belongsToWheelArea &&
        (mainCircularPart || centralHub || wheelFastener)
      );
    });

    const attached=attachWheelShader(
      mesh,
      selectedRimComponents,
      `street-car-wheel-metal-${mesh.name}-v9`,
      nearestWheelCenter
    );

    if(attached>0){
      animatedRimMeshes.push({
        mesh,
        componentCount:attached
      });
    }
  }

  if(wheelCenters.length!==4){
    console.warn("Centri ruota rilevati:",wheelCenters.length);
  }

  car.updateMatrixWorld(true);

  const radii=selectedTyreComponents
    .map(component=>(component.size.y+component.size.z)*.25)
    .sort((a,b)=>a-b);

  const localWheelRadius=radii.length
    ? radii[Math.floor(radii.length/2)]
    : 1;

  const worldScale=new THREE.Vector3();
  tyreMesh.getWorldScale(worldScale);

  const worldWheelRadius=Math.max(
    localWheelRadius*Math.abs(worldScale.z),
    .05
  );

  return {
    mesh:tyreMesh,
    rimMeshes:animatedRimMeshes,
    uniforms,
    angle:0,
    worldWheelRadius,
    previousWorldPosition:null,
    wasVisible:false,
    detectedWheelComponents:selectedTyreComponents,
    wheelCenters
  };
}
